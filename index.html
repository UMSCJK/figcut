<!doctype html>
<html lang="zh-CN" data-ui="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figcut</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/app.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="cluster cluster-left" id="topbar-left"></div>
    <div class="title-block">
      <div class="title" id="topbar-title">figcut</div>
      <div class="subtitle" id="topbar-subtitle"></div>
    </div>
    <div class="cluster cluster-right" id="topbar-right"></div>
  </header>
  <main class="body" id="body">
    <aside class="sidebar" id="panel-left">
      <div class="side-head" id="side-head">
        <span class="side-title">页面</span>
      </div>
      <div class="rail-tools" id="rail-tools" hidden></div>
      <button type="button" class="side-foot" id="toggle-left" title="收起侧边栏">
        <span class="foot-icon"></span><span class="foot-label">收起侧边栏</span>
      </button>
    </aside>
    <div class="splitter" id="split-left" title="拖动调整宽度，双击折叠"></div>
    <div class="canvas" id="canvas">
      <div class="empty" id="empty">
        <div class="big">把 PDF 拖进来</div>
        <div class="small">或点左上角「打开」</div>
        <div class="recent" id="recent"></div>
      </div>
    </div>
    <div class="splitter" id="split-right" title="拖动调整宽度，双击复位"></div>
    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox-inner">
        <div class="lightbox-stage" id="lightbox-stage">
          <canvas class="lightbox-canvas" id="lightbox-canvas"></canvas>
        </div>
        <div class="lightbox-bar">
          <button type="button" class="icon-btn" id="lb-prev" title="上一个">‹</button>
          <span class="lightbox-no" id="lb-no">1</span>
          <button type="button" class="icon-btn" id="lb-next" title="下一个">›</button>
          <span class="lightbox-sep"></span>
          <button type="button" class="icon-btn" id="lb-zoom-out" title="缩小">−</button>
          <button type="button" class="icon-btn" id="lb-zoom" title="实际大小">100%</button>
          <button type="button" class="icon-btn" id="lb-zoom-in" title="放大">+</button>
          <button type="button" class="icon-btn" id="lb-fit" title="适应窗口">适应</button>
          <button type="button" class="icon-btn" id="lb-close" title="关闭 (Esc)">✕</button>
        </div>
      </div>
    </div>
    <aside class="panel" id="panel-right">
      <div class="side-head" id="panel-head">
        <span class="side-title">标注</span>
      </div>
      <button type="button" class="side-foot" id="toggle-right" title="收起侧边栏">
        <span class="foot-icon"></span><span class="foot-label">收起侧边栏</span>
      </button>
    </aside>
  </main>
  <div class="banner" id="banner" hidden></div>
</div>
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js" crossorigin="anonymous"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
