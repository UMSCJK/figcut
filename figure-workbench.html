}

// ---- src/ui/zoom-control.js ----
// 画布右下角缩放控件：− [100% ▾] +，菜单是两列五行的紧凑版
// 状态：已实现。+/- 只在预设档位里走；整页/页宽显示实时算出的百分比。




// 按钮步进用的档位
const STEPS = [0.25, 0.33, 0.5, 0.67, 0.75, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2, 2.5, 3, 4, 5];

// 菜单：两列五行
const MENU = [
  [0.5, 5],
  [0.67, 2],
  [0.75, 1.5],
  [1, 1.25],
  ['fit-width'],
];

const pct = (v) => {
  const p = v * 100;
  return (p >= 100 ? Math.round(p) : Math.round(p * 10) / 10) + '%';
};

// 步进用的档位表 = 预设 + 当前「页宽」实时比例。
// 比如页宽是 188%，那从 150% 往上一步就是 188%，不是 200%。
function stepList(fitWidth) {
  const list = STEPS.slice();
  if (Number.isFinite(fitWidth) && fitWidth > 0.05 && fitWidth < 20) {
    const hit = list.some((v) => Math.abs(v - fitWidth) < 0.001);
    if (!hit) list.push(fitWidth);
  }
  list.sort((a, b) => a - b);
  return list;
}

function stepIndex(scale, list) {
  const arr = list || STEPS;
  let best = 0;
  let bestD = Infinity;
  for (let i = 0; i < arr.length; i += 1) {
    const d = Math.abs(arr[i] - scale);
    if (d < bestD) {
      bestD = d;
      best = i;
    }
  }
  return best;
}

function renderZoomControl(opts) {
  const { container, zoom: z } = opts;
  const doc = container.ownerDocument;
  const fitPcts = opts.fitPcts || (() => ({ page: null, width: null }));

  const box = doc.createElement('div');
  box.className = 'zoom-control';

  const minus = doc.createElement('button');
  minus.type = 'button';
  minus.className = 'icon-btn';
  minus.innerHTML = ICONS.minus;
  minus.setAttribute('aria-label', '缩小');

  const plus = doc.createElement('button');
  plus.type = 'button';
  plus.className = 'icon-btn';
  plus.innerHTML = ICONS.plus;
  plus.setAttribute('aria-label', '放大');

  const entry = doc.createElement('button');
  entry.type = 'button';
  entry.className = 'zoom-entry';
  entry.setAttribute('aria-haspopup', 'menu');

  box.append(minus, entry, plus);
  container.appendChild(box);

  const menu = doc.createElement('div');
  menu.className = 'zoom-menu';
  menu.setAttribute('role', 'menu');
  menu.hidden = true;

  const cells = [];
  for (const row of MENU) {
    for (const item of row) {
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'zoom-cell';
      btn.dataset.action = typeof item === 'string' ? item : 'set';
      if (typeof item === 'number') btn.dataset.value = String(item);
      btn.addEventListener('click', () => {
        close();
        if (typeof item === 'number') setScale(z, item);
        else if (item === 'fit-width') opts.onFitWidth && opts.onFitWidth();
      });
      cells.push(btn);
      menu.appendChild(btn);
    }
  }
  doc.body.appendChild(menu);

  function place() {
    const r = box.getBoundingClientRect();
    menu.style.left = Math.round(r.left) + 'px';
    menu.style.bottom = Math.round(window.innerHeight - r.top + 6) + 'px';
    menu.style.top = 'auto';
  }

  function open() {
    place();
    syncCells();
    menu.hidden = false;
    entry.classList.add('is-open');
    doc.addEventListener('pointerdown', onOutside, true);
    doc.addEventListener('keydown', onKey, true);
  }

  function close() {
    menu.hidden = true;
    entry.classList.remove('is-open');
    doc.removeEventListener('pointerdown', onOutside, true);
    doc.removeEventListener('keydown', onKey, true);
  }

  function onOutside(ev) {
    if (menu.contains(ev.target) || box.contains(ev.target)) return;
    close();
  }

  function onKey(ev) {
    if (ev.key === 'Escape') close();
  }

  entry.addEventListener('click', () => (menu.hidden ? open() : close()));

  function syncCells() {
    const fits = fitPcts();
    for (const btn of cells) {
      const action = btn.dataset.action;
      if (action === 'set') {
        const v = Number(btn.dataset.value);
        btn.textContent = pct(v);
        btn.classList.toggle('on', !z.auto && z.mode === 'free' && Math.abs(z.scale - v) < 1e-6);
      } else {
        btn.textContent = fits.width ? '页宽 ' + pct(fits.width) : '页宽';
        btn.classList.toggle('on', z.mode === 'width');
        btn.classList.add('is-wide');
      }
    }
  }

  function sync() {
    let label = pct(z.scale);
    if (z.auto) label = '自动';
    else if (z.mode === 'width') label = '页宽';
    else if (z.mode === 'page') label = pct(z.scale);
    entry.textContent = label + ' ▾';
    entry.title = '缩放：' + label;
    if (!menu.hidden) syncCells();
  }
  sync();
  z.listeners.add(sync);

  const currentList = () => stepList(fitPcts().width);

  minus.addEventListener('click', () => {
    const list = currentList();
    const i = stepIndex(z.scale, list);
    setScale(z, list[Math.max(0, i - 1)]);
  });
  plus.addEventListener('click', () => {
    const list = currentList();
    const i = stepIndex(z.scale, list);
    setScale(z, list[Math.min(list.length - 1, i + 1)]);
  });

  return { box, sync, menu };
}

function bindZoomInput(control) {
  return control;
}

// ---- src/ui/inspector.js ----
// 类型选择器：题干 + A–K 多选 + 自定义文本（同一个 figure 可以同时是 A 和 C）
// 状态：已实现。

const LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];

function optsOf(region) {
  if (Array.isArray(region.opts)) return region.opts.slice();
  if (region.kind === 'opt' && region.opt) {
    return region.opt === 'custom' ? (region.optText ? [region.optText] : []) : [region.opt];
  }
  return [];
}

function writeOpts(region, list) {
  region.opts = list;
  region.kind = list.length ? 'opt' : 'stem';
  // 兼容旧字段
  region.opt = list.length === 1 && LETTERS.includes(list[0]) ? list[0] : list.length ? 'custom' : null;
  region.optText = list.length ? list.filter((x) => !LETTERS.includes(x)).join(' ') : '';
  return region;
}

function setKind(region, kind) {
  if (kind === 'stem') writeOpts(region, []);
  else if (kind === 'custom') writeOpts(region, region.optText ? [region.optText] : []);
  else if (LETTERS.includes(kind)) writeOpts(region, [kind]);
  return region;
}

function toggleLetter(region, letter) {
  const list = optsOf(region);
  const i = list.indexOf(letter);
  if (i >= 0) list.splice(i, 1);
  else list.push(letter);
  return writeOpts(region, list);
}

function setCustomOption(region, text) {
  const clean = String(text || '').trim();
  const letters = optsOf(region).filter((x) => LETTERS.includes(x));
  return writeOpts(region, clean ? [...letters, clean] : letters);
}

function setQuestion(region, q) {
  region.q = String(q === undefined || q === null ? '' : q).trim();
  return region;
}

function setNote(region, note) {
  region.note = String(note || '');
  return region;
}

function labelOfKind(region) {
  const list = optsOf(region);
  if (!list.length) return '题干';
  return list.join(' ');
}

function kindValue(region) {
  const list = optsOf(region);
  if (!list.length) return 'stem';
  if (list.length === 1 && LETTERS.includes(list[0])) return list[0];
  return 'custom';
}

function buildControls(doc, region, onChange, opts = {}) {
  const row = doc.createElement('div');
  row.className = 'inspector';

  const kindBtn = doc.createElement('button');
  kindBtn.type = 'button';
  kindBtn.className = 'opt-btn';
  kindBtn.title = '类型：题干 / A–K 可多选 / 自定义';

  const menu = doc.createElement('div');
  menu.className = 'opt-menu';
  menu.hidden = true;

  const stemBtn = doc.createElement('button');
  stemBtn.type = 'button';
  stemBtn.className = 'opt-cell is-wide';
  stemBtn.textContent = '题干';
  stemBtn.dataset.kind = 'stem';
  menu.appendChild(stemBtn);

  for (const letter of LETTERS) {
    const b = doc.createElement('button');
    b.type = 'button';
    b.className = 'opt-cell';
    b.textContent = letter;
    b.dataset.kind = letter;
    menu.appendChild(b);
  }

  const custom = doc.createElement('input');
  custom.className = 'opt-cell opt-input';
  custom.type = 'text';
  custom.placeholder = '其他';
  custom.value = optsOf(region).filter((x) => !LETTERS.includes(x)).join(' ');
  custom.title = '自定义选项名';
  menu.appendChild(custom);

  const cells = [...menu.querySelectorAll('.opt-cell[data-kind]')];

  function sync() {
    kindBtn.textContent = labelOfKind(region) + ' ▾';
    const list = optsOf(region);
    for (const c of cells) {
      if (c.dataset.kind === 'stem') c.classList.toggle('on', list.length === 0);
      else c.classList.toggle('on', list.includes(c.dataset.kind));
    }
    custom.classList.toggle('on', list.some((x) => !LETTERS.includes(x)));
  }
  sync();

  function close() {
    menu.hidden = true;
    doc.removeEventListener('pointerdown', onOutside, true);
  }
  function onOutside(ev) {
    if (menu.contains(ev.target) || kindBtn.contains(ev.target)) return;
    close();
  }
  function open() {
    const r = kindBtn.getBoundingClientRect();
    const width = menu.offsetWidth || 160;
    // 贴着右栏时别让弹层越过窗口右边界
    const left = Math.max(6, Math.min(Math.round(r.left), window.innerWidth - width - 6));
    menu.style.left = left + 'px';
    menu.style.top = Math.round(r.bottom + 4) + 'px';
    menu.hidden = false;
    doc.addEventListener('pointerdown', onOutside, true);
    opts.onOpen && opts.onOpen();
  }
  kindBtn.addEventListener('click', () => (menu.hidden ? open() : close()));

  for (const c of cells) {
    c.addEventListener('click', () => {
      if (c.dataset.kind === 'stem') setKind(region, 'stem');
      else toggleLetter(region, c.dataset.kind);
      sync();
      // 只更新状态，不重建列表——否则弹层会被移除，多选就得点一次开一次
      onChange(region, { quiet: true, noRebuild: true });
    });
  }
  custom.addEventListener('input', () => {
    setCustomOption(region, custom.value);
    sync();
    onChange(region, { quiet: true });
  });

  const q = doc.createElement('input');
  q.className = 'region-q';
  q.type = 'text';
  q.placeholder = '题号';
  q.value = region.q || '';
  q.title = '题号';

  const note = doc.createElement('input');
  note.className = 'region-note';
  note.type = 'text';
  note.placeholder = '备注';
  note.value = region.note || '';
  note.title = '备注';

  q.addEventListener('input', () => {
    setQuestion(region, q.value);
    onChange(region, { quiet: true });
  });
  note.addEventListener('input', () => {
    setNote(region, note.value);
    onChange(region, { quiet: true });
  });

  row.append(kindBtn, q, note);
  doc.body.appendChild(menu);
  row._menu = menu;
  return row;
}

function renderInspector(container, region, onChange) {
  const row = buildControls(container.ownerDocument, region, onChange);
  container.textContent = '';
  container.appendChild(row);
  return row;
}

// ---- src/pdf/bitmap.js ----
// 按 devicePixelRatio 渲染页位图并缓存
// 状态：已实现。渲染需要 DOM canvas；缓存键是纯函数，可单测。



// 缓存键必须含文档身份，否则换文件后读到上一份的像素。
function cacheKey(docId, pageNo, scale, dpr) {
  return docId + ':' + pageNo + ':' + Number(scale).toFixed(4) + ':' + Number(dpr).toFixed(3);
}

async function renderPage(page, opts = {}) {
  if (typeof document === 'undefined') {
    throw figcutError('no-dom', '离开浏览器没法渲染页位图');
  }
  const scale = opts.scale === undefined ? 1 : opts.scale;
  const dpr = opts.dpr === undefined ? 1 : opts.dpr;
  const viewport = page.getViewport({ scale });

  const canvas = opts.canvas || document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(viewport.width * dpr));
  canvas.height = Math.max(1, Math.round(viewport.height * dpr));

  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const transform = dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0];
  await page.render({ canvasContext: ctx, viewport, transform }).promise;
  ctx.restore();

  return canvas;
}

function clearCache(cache) {
  if (cache && typeof cache.clear === 'function') cache.clear();
  return cache;
}

// ---- src/view/page-stack.js ----
// 连续/分页滚动 + 单页/双页排版
// 状态：已实现（依赖浏览器 canvas）。当前页只有一页可编辑，其余页只显示。





function createPageStack(opts) {
  const container = opts.container;
  const zoom = opts.zoom;
  if (!container || !container.ownerDocument) throw figcutError('no-dom', '页栈需要 DOM 容器');

  const doc = container.ownerDocument;
  const root = doc.createElement('div');
  root.className = 'pages';
  container.appendChild(root);

  const pages = [];
  let pdfDoc = null;
  let current = 1;
  let token = 0;
  let busy = Promise.resolve();

  // 视图状态：单/双页、奇偶、连续/分页
  const view = { dual: false, oddLeft: false, continuous: true };

  // 缩放立刻给视觉反馈（CSS transform），真正的重绘防抖，避免 trackpad 缩放时闪
  let visualScale = null;
  function setVisualScale(scale) {
    visualScale = scale;
    // 改 .page 的尺寸（canvas 是 100% 填充）：布局立刻稳定，
    // 位图由浏览器拉伸，比 transform 重新栅格化便宜得多
    for (const p of pages) {
      const vp = p.page.getViewport({ scale });
      p.wrap.style.width = Math.round(vp.width) + 'px';
      p.wrap.style.height = Math.round(vp.height) + 'px';
    }
  }

  let renderTimer = null;
  function scheduleZoom() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(() => {
      renderTimer = null;
      busy = busy.then(applyZoom);
    }, 220);
  }

  // 文本层：透明 span，选择工具下可框选/复制页面文字
  async function buildTextLayer(p, scale) {
    if (!p.textEl) {
      p.textEl = doc.createElement('div');
      p.textEl.className = 'textlayer';
      p.wrap.appendChild(p.textEl);
    }
    if (!p.textItems) {
      try {
        p.textItems = await p.page.getTextContent();
      } catch (e) {
        p.textItems = { items: [] };
      }
    }
    const host = p.textEl;
    host.textContent = '';
    // 尺寸跟 .page 走（canvas 现在是 100% 填充，style.width 是空的）
    const box = p.wrap.getBoundingClientRect();
    host.style.width = p.wrap.style.width || Math.round(box.width) + 'px';
    host.style.height = p.wrap.style.height || Math.round(box.height) + 'px';
    const vp = p.page.getViewport({ scale: 1 });
    for (const item of p.textItems.items) {
      if (!item.str || !item.str.trim()) continue;
      const span = doc.createElement('span');
      const x = item.transform[4] * scale;
      const y = (vp.height - (item.transform[5] + item.height)) * scale;
      span.textContent = item.str;
      span.style.left = x + 'px';
      span.style.top = y + 'px';
      span.style.width = Math.max(1, item.width * scale) + 'px';
      span.style.height = Math.max(1, item.height * scale) + 'px';
      span.style.fontSize = Math.max(1, item.height * scale) + 'px';
      span.style.lineHeight = Math.max(1, item.height * scale) + 'px';
      host.appendChild(span);
    }
  }

  async function applyZoom() {
    if (!pdfDoc) return;
    const my = ++token;
    const scale = zoom.scale;
    const dpr = Math.min(1.5, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);

    const host = container.getBoundingClientRect();
    const near = (p) => {
      const r = p.wrap.getBoundingClientRect();
      return r.bottom > host.top - 800 && r.top < host.bottom + 800;
    };

    // 先画当前页，其余页随后，避免切页后等所有页一起渲染
    const ordered = pages.slice().sort((a, b) => (b.no === current ? 1 : 0) - (a.no === current ? 1 : 0));

    for (const p of ordered) {
      if (my !== token) return;
      // 只画视口附近的页；远处的先留着旧位图，等滚回来再补（滚动手势里会再触发）
      if (!near(p) && p.renderedScale) continue;
      const vp = p.page.getViewport({ scale });
      p.renderedScale = scale;
      // 尺寸挂在 .page 上，canvas 用 100% 撑满，布局立刻正确
      p.wrap.style.width = Math.round(vp.width) + 'px';
      p.wrap.style.height = Math.round(vp.height) + 'px';
      await renderPage(p.page, { scale, dpr, canvas: p.canvas });
      await buildTextLayer(p, scale);
    }
  }

  function rowIndexOf(no) {
    const rows = pageCombos(pages.length, view);
    for (let i = 0; i < rows.length; i += 1) if (rows[i].includes(no)) return i;
    return 0;
  }

  function buildRows() {
    const rows = pageCombos(pages.length, view);
    root.textContent = '';
    rows.forEach((row, i) => {
      const rowEl = doc.createElement('div');
      rowEl.className = 'page-row';
      rowEl.dataset.row = String(i);
      // 书式：第 1 页单独在右，末页落单在左，别和双页行错开
      if (view.dual && row.length === 1) {
        rowEl.dataset.single = row[0] === 1 ? 'right' : 'left';
      }
      for (const no of row) {
        const p = pages[no - 1];
        if (p) rowEl.appendChild(p.wrap);
      }
      root.appendChild(rowEl);
    });
    syncVisibility();
  }

  function syncVisibility() {
    const cur = rowIndexOf(current);
    for (const rowEl of root.children) {
      const isCur = Number(rowEl.dataset.row) === cur;
      rowEl.classList.toggle('is-current', isCur);
      rowEl.style.display = view.continuous || isCur ? '' : 'none';
    }
  }

  async function mount(newDoc) {
    pdfDoc = newDoc;
    root.textContent = '';
    pages.length = 0;
    token += 1;

    for (let no = 1; no <= newDoc.pages; no += 1) {
      const wrap = doc.createElement('div');
      wrap.className = 'page';
      wrap.dataset.page = String(no);

      const canvas = doc.createElement('canvas');
      const overlay = doc.createElement('div');
      overlay.className = 'page-overlay';

      wrap.append(canvas, overlay);
      pages.push({ no, wrap, canvas, overlay, page: null });
    }

    for (const p of pages) {
      p.page = await newDoc.pdf.getPage(p.no);
    }

    buildRows();
    busy = applyZoom();
    await busy;
    setCurrent(current);
    return pages.length;
  }

  function setCurrent(no) {
    current = no;
    for (const p of pages) p.wrap.classList.toggle('is-current', p.no === no);
    syncVisibility();
    const target = pages.find((p) => p.no === no);
    if (target && target.wrap.scrollIntoView) target.wrap.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    return current;
  }

  function applyLayout(next) {
    if (next.dual !== undefined) view.dual = !!next.dual;
    if (next.oddLeft !== undefined) view.oddLeft = !!next.oddLeft;
    if (next.continuous !== undefined) view.continuous = !!next.continuous;
    if (view.dual && view.oddLeft === undefined) view.oddLeft = false;
    buildRows();
    return { ...view };
  }

  function visibleRects() {
    return pages.map((p) => {
      const r = p.wrap.getBoundingClientRect();
      return { no: p.no, top: r.top, height: r.height };
    });
  }

  // 缩放后重排文本层（否则透明文字会停在旧缩放位置，选不中）
  async function refreshTextLayers() {
    for (const p of pages) {
      if (!p.textEl || !p.textItems) continue;
      const vp1 = p.page.getViewport({ scale: 1 });
      const width = parseFloat(p.wrap.style.width) || vp1.width;
      const scale = width / vp1.width;
      await buildTextLayer(p, scale);
    }
  }

  return {
    root,
    pages,
    view,
    mount,
    refreshTextLayers,
    setCurrent,
    applyLayout,
    visibleRects,
    applyZoom: () => {
      busy = busy.then(applyZoom);
      return busy;
    },
    setVisualScale,
    scheduleZoom,
    get current() {
      return current;
    },
  };
}

function setCurrent(stack, no) {
  return stack.setCurrent(no);
}

function visibleRects(stack) {
  return stack.visibleRects();
}

// ---- src/core/geometry.js ----
// 矩形与多边形的纯几何运算
// 状态：已实现。不碰 DOM、不碰 PDF，输入输出都是普通对象与数组。



const MIN_REGION_PT = 2;

function normRect(x0, y0, x1, y1) {
  const x = Math.min(x0, x1);
  const y = Math.min(y0, y1);
  return { x, y, w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
}

// 反着拖出的框也归一化；任一边小于 minSize 视为误触，返回 null。
function rectFromPoints(x0, y0, x1, y1, minSize = MIN_REGION_PT) {
  const r = normRect(x0, y0, x1, y1);
  if (!(r.w >= minSize) || !(r.h >= minSize)) return null;
  if (!Number.isFinite(r.w) || !Number.isFinite(r.h)) return null;
  return r;
}

// 整块塞进页内：先夹尺寸，再夹位置，形状不变。
function clampRect(rect, pageW, pageH) {
  const w = clamp(Math.min(rect.w, pageW), 0, pageW);
  const h = clamp(Math.min(rect.h, pageH), 0, pageH);
  const x = clamp(rect.x, 0, pageW - w);
  const y = clamp(rect.y, 0, pageH - h);
  return { x, y, w, h };
}

function expandRect(rect, dx, dy) {
  return { x: rect.x - dx, y: rect.y - dy, w: rect.w + dx * 2, h: rect.h + dy * 2 };
}

function polyBounds(points) {
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  for (const p of points) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// 整体平移：按外接框夹边，形状一点不变。
function movePoly(points, dx, dy, pageW, pageH) {
  const b = polyBounds(points);
  let mx = dx;
  let my = dy;
  if (b.x + mx < 0) mx = -b.x;
  if (b.x + b.w + mx > pageW) mx = pageW - (b.x + b.w);
  if (b.y + my < 0) my = -b.y;
  if (b.y + b.h + my > pageH) my = pageH - (b.y + b.h);
  if (mx !== dx || my !== dy) {
    const nb = { x: b.x + mx, y: b.y + my, w: b.w, h: b.h };
    if (nb.x < 0 || nb.y < 0 || nb.x + nb.w > pageW || nb.y + nb.h > pageH) {
      return points.map((p) => ({ x: p.x, y: p.y }));
    }
  }
  return points.map((p) => ({ x: p.x + mx, y: p.y + my }));
}

function hitTestRect(rect, x, y, tol = 0) {
  return (
    x >= rect.x - tol &&
    x <= rect.x + rect.w + tol &&
    y >= rect.y - tol &&
    y <= rect.y + rect.h + tol
  );
}

function distanceToSegment(px, py, ax, ay, bx, by) {
  const vx = bx - ax;
  const vy = by - ay;
  const len2 = vx * vx + vy * vy;
  const t = len2 === 0 ? 0 : clamp(((px - ax) * vx + (py - ay) * vy) / len2, 0, 1);
  const cx = ax + t * vx;
  const cy = ay + t * vy;
  return Math.hypot(px - cx, py - cy);
}

function hitTestPoly(points, x, y, tol = 0) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
    const a = points[i];
    const b = points[j];
    if (a.y > y !== b.y > y && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) {
      inside = !inside;
    }
  }
  if (inside) return true;
  if (tol <= 0) return false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
    const a = points[j];
    const b = points[i];
    if (distanceToSegment(x, y, a.x, a.y, b.x, b.y) <= tol) return true;
  }
  return false;
}

const CORNERS = [
  ['nw', 0, 0],
  ['ne', 1, 0],
  ['sw', 0, 1],
  ['se', 1, 1],
];

function cornerAt(rect, x, y, tol = 8) {
  for (const [name, fx, fy] of CORNERS) {
    const cx = rect.x + rect.w * fx;
    const cy = rect.y + rect.h * fy;
    if (Math.abs(x - cx) <= tol && Math.abs(y - cy) <= tol) return name;
  }
  return null;
}

// ---- src/view/editor.js ----
// 框的增删改与工具模式
// 状态：已实现（纯逻辑：坐标一律 pt，不碰 DOM，可在 node 单测）。
// 已拍板：蓝框停在手画位置，不做任何吸附；白界只由导出框负责。



const TOOLS = ['select', 'rect', 'poly'];

function createEditor(opts = {}) {
  return {
    tool: opts.tool || 'rect',
    page: opts.page || 1,
    pageW: opts.pageW || 595,
    pageH: opts.pageH || 842,
    regions: [],
    selectedId: null,
    draft: null,
    drag: null,
    nextId: 1,
  };
}

function setTool(ed, tool) {
  if (!TOOLS.includes(tool)) throw new Error('未知工具: ' + tool);
  ed.tool = tool;
  ed.draft = null;
  ed.drag = null;
  return tool;
}

function setPage(ed, page) {
  ed.page = page;
  ed.selectedId = null;
  ed.draft = null;
  ed.drag = null;
}

function boundsOf(region) {
  return region.shape === 'poly' ? polyBounds(region.points) : region.rect;
}

function regionAt(ed, pt) {
  for (let i = ed.regions.length - 1; i >= 0; i -= 1) {
    const r = ed.regions[i];
    if (r.page !== ed.page) continue;
    const hit = r.shape === 'poly' ? hitTestPoly(r.points, pt.x, pt.y, 2) : hitTestRect(r.rect, pt.x, pt.y, 2);
    if (hit) return r;
  }
  return null;
}

function selected(ed) {
  return ed.regions.find((r) => r.id === ed.selectedId) || null;
}

function addRegion(ed, region) {
  const r = { id: ed.nextId++, kind: 'stem', opt: null, q: '', note: '', page: ed.page, ...region };
  ed.regions.push(r);
  ed.selectedId = r.id;
  return r;
}

function deleteSelection(ed) {
  if (ed.selectedId === null) return null;
  const idx = ed.regions.findIndex((r) => r.id === ed.selectedId);
  if (idx < 0) return null;
  const [gone] = ed.regions.splice(idx, 1);
  ed.selectedId = null;
  return gone;
}

// 方向键微移：Shift 1pt / Alt 10pt 由调用方换算好再传进来。
function nudge(ed, dx, dy) {
  const r = selected(ed);
  if (!r) return null;
  if (r.shape === 'poly') {
    r.points = movePoly(r.points, dx, dy, ed.pageW, ed.pageH);
  } else {
    r.rect = clampRect({ x: r.rect.x + dx, y: r.rect.y + dy, w: r.rect.w, h: r.rect.h }, ed.pageW, ed.pageH);
  }
  return r;
}

// 边命中：把矩形拆成四条边，返回 'n' | 's' | 'w' | 'e'
function edgeAt(rect, x, y, tol = 8) {
  const nearX = x >= rect.x - tol && x <= rect.x + rect.w + tol;
  const nearY = y >= rect.y - tol && y <= rect.y + rect.h + tol;
  if (!nearX || !nearY) return null;
  if (Math.abs(y - rect.y) <= tol) return 'n';
  if (Math.abs(y - (rect.y + rect.h)) <= tol) return 's';
  if (Math.abs(x - rect.x) <= tol) return 'w';
  if (Math.abs(x - (rect.x + rect.w)) <= tol) return 'e';
  return null;
}

// 顶点命中：返回索引
function vertexAt(points, x, y, tol = 8) {
  for (let i = 0; i < points.length; i += 1) {
    if (Math.hypot(points[i].x - x, points[i].y - y) <= tol) return i;
  }
  return -1;
}

const HANDLE_TOL = 8;

// 任何工具下，先看能不能编辑已有框；空白处才用当前工具新建。
function pointerDown(ed, pt) {
  const sel = selected(ed);
  if (sel && sel.page === ed.page) {
    if (sel.shape === 'rect') {
      const corner = cornerAt(sel.rect, pt.x, pt.y, HANDLE_TOL);
      if (corner) {
        ed.drag = { mode: 'resize', corner, start: { ...pt }, origin: { ...sel.rect }, target: sel };
        return { selection: sel.id, mode: 'resize' };
      }
      const edge = edgeAt(sel.rect, pt.x, pt.y, HANDLE_TOL);
      if (edge) {
        ed.drag = { mode: 'resize', edge, start: { ...pt }, origin: { ...sel.rect }, target: sel };
        return { selection: sel.id, mode: 'resize' };
      }
    } else {
      const vi = vertexAt(sel.points, pt.x, pt.y, HANDLE_TOL + 2);
      if (vi >= 0) {
        ed.drag = { mode: 'vertex', index: vi, start: { ...pt }, origin: sel.points.map((p) => ({ ...p })), target: sel };
        return { selection: sel.id, mode: 'vertex' };
      }
    }
  }

  const hit = regionAt(ed, pt);
  if (hit) {
    ed.selectedId = hit.id;
    ed.drag = {
      mode: 'move',
      start: { ...pt },
      origin: hit.shape === 'poly' ? hit.points.map((p) => ({ ...p })) : { ...hit.rect },
      target: hit,
    };
    return { selection: hit.id, mode: 'move' };
  }

  ed.selectedId = null;

  if (ed.tool === 'rect') {
    // 两次点击画矩形：第一次落角，第二次对角即成形（拖动也照样可用）
    if (ed.draft && ed.draft.shape === 'rect') {
      ed.draft.clicked = true;
      ed.draft.x1 = pt.x;
      ed.draft.y1 = pt.y;
      return { draft: true, second: true };
    }
    ed.draft = { shape: 'rect', x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y, clicked: false };
    return { draft: true };
  }

  if (ed.tool === 'poly') {
    if (!ed.draft || ed.draft.shape !== 'poly') ed.draft = { shape: 'poly', points: [{ x: pt.x, y: pt.y }] };
    else ed.draft.points.push({ x: pt.x, y: pt.y });
    return { draft: true, points: ed.draft.points.length };
  }

  return { selection: null };
}

function pointerMove(ed, pt) {
  if (ed.draft && ed.draft.shape === 'rect') {
    ed.draft.x1 = pt.x;
    ed.draft.y1 = pt.y;
    return { draft: true };
  }

  if (!ed.drag) return null;
  const t = ed.drag.target;
  const dx = pt.x - ed.drag.start.x;
  const dy = pt.y - ed.drag.start.y;

  if (ed.drag.mode === 'move') {
    if (t.shape === 'poly') {
      const moved = movePoly(ed.drag.origin, dx, dy, ed.pageW, ed.pageH);
      t.points = moved;
    } else {
      t.rect = clampRect({ x: ed.drag.origin.x + dx, y: ed.drag.origin.y + dy, w: ed.drag.origin.w, h: ed.drag.origin.h }, ed.pageW, ed.pageH);
    }
    return { moved: true };
  }

  if (ed.drag.mode === 'vertex') {
    const idx = ed.drag.index;
    const pts = ed.drag.origin.map((p) => ({ x: p.x, y: p.y }));
    if (pts[idx]) {
      pts[idx] = {
        x: Math.min(Math.max(pt.x, 0), ed.pageW),
        y: Math.min(Math.max(pt.y, 0), ed.pageH),
      };
      t.points = pts;
    }
    return { vertex: true };
  }

  const o = ed.drag.origin;
  let left = o.x;
  let top = o.y;
  let right = o.x + o.w;
  let bottom = o.y + o.h;
  const corner = ed.drag.corner;
  const edge = ed.drag.edge;

  if (corner) {
    if (corner.includes('w')) left = Math.min(pt.x, right - 2);
    if (corner.includes('e')) right = Math.max(pt.x, left + 2);
    if (corner.includes('n')) top = Math.min(pt.y, bottom - 2);
    if (corner.includes('s')) bottom = Math.max(pt.y, top + 2);
  } else if (edge === 'n') {
    top = Math.min(pt.y, bottom - 2);
  } else if (edge === 's') {
    bottom = Math.max(pt.y, top + 2);
  } else if (edge === 'w') {
    left = Math.min(pt.x, right - 2);
  } else if (edge === 'e') {
    right = Math.max(pt.x, left + 2);
  }

  t.rect = clampRect({ x: left, y: top, w: right - left, h: bottom - top }, ed.pageW, ed.pageH);
  return { resized: true };
}

function pointerUp(ed, pt) {
  if (ed.draft && ed.draft.shape === 'rect') {
    const moved = Math.hypot(pt.x - ed.draft.x0, pt.y - ed.draft.y0);
    // 点了一下没拖：等着点第二个对角点
    if (!ed.draft.clicked && moved < 2) return null;

    const r = rectFromPoints(ed.draft.x0, ed.draft.y0, ed.draft.x1, ed.draft.y1);
    ed.draft = null;
    if (!r) return null;
    return addRegion(ed, { shape: 'rect', rect: clampRect(r, ed.pageW, ed.pageH) });
  }

  if (ed.draft && ed.draft.shape === 'poly') {
    // 只有"点回首点"才闭合；否则继续加点（Enter 走 closePoly）
    const first = ed.draft.points[0];
    const nearFirst = Math.hypot(pt.x - first.x, pt.y - first.y) <= 8;
    if (nearFirst && ed.draft.points.length >= 4) {
      ed.draft.points.pop();
      return closePoly(ed);
    }
    return null;
  }

  if (ed.drag) {
    ed.drag = null;
    return { committed: true };
  }
  return null;
}

function closePoly(ed) {
  if (!ed.draft || ed.draft.shape !== 'poly') return null;
  if (ed.draft.points.length < 3) {
    ed.draft = null;
    return null;
  }
  const points = ed.draft.points.map((p) => ({ x: p.x, y: p.y }));
  ed.draft = null;
  return addRegion(ed, { shape: 'poly', points });
}

// ---- src/view/overlay.js ----
// 每页选框覆盖层：SVG 画框，editor 负责逻辑，这里只画。
// 状态：已实现。



const NS = 'http://www.w3.org/2000/svg';

function createOverlay(pageEl, size) {
  const doc = pageEl.ownerDocument;
  const host = pageEl.querySelector('.page-overlay');
  const svg = doc.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'regions');
  svg.setAttribute('viewBox', '0 0 ' + size.w + ' ' + size.h);
  svg.setAttribute('preserveAspectRatio', 'none');
  host.appendChild(svg);
  return { svg, size };
}

function put(parent, node) {
  parent.appendChild(node);
  return node;
}

// 手柄按屏幕像素算大小：pt 尺寸 = 像素 / 当前倍率，缩放到多大都一个手感。
function addHandle(doc, parent, x, y, size, cls) {
  const h = doc.createElementNS(NS, 'rect');
  h.setAttribute('x', x - size / 2);
  h.setAttribute('y', y - size / 2);
  h.setAttribute('width', size);
  h.setAttribute('height', size);
  h.setAttribute('class', 'handle ' + cls);
  parent.appendChild(h);
  return h;
}

function addHandles(doc, parent, sel, scale) {
  const size = 8 / Math.max(0.05, scale);
  if (sel.shape === 'poly') {
    for (const p of sel.points) addHandle(doc, parent, p.x, p.y, size * 0.8, 'is-poly');
    return;
  }
  const r = sel.rect;
  addHandle(doc, parent, r.x, r.y, size, 'is-nw');
  addHandle(doc, parent, r.x + r.w, r.y, size, 'is-ne');
  addHandle(doc, parent, r.x, r.y + r.h, size, 'is-sw');
  addHandle(doc, parent, r.x + r.w, r.y + r.h, size, 'is-se');
  // 四条边中点也给手柄
  addHandle(doc, parent, r.x + r.w / 2, r.y, size * 0.85, 'is-edge');
  addHandle(doc, parent, r.x + r.w / 2, r.y + r.h, size * 0.85, 'is-edge');
  addHandle(doc, parent, r.x, r.y + r.h / 2, size * 0.85, 'is-edge');
  addHandle(doc, parent, r.x + r.w, r.y + r.h / 2, size * 0.85, 'is-edge');
}

function drawRegions(overlay, regions, opts = {}) {
  const doc = overlay.svg.ownerDocument;
  while (overlay.svg.firstChild) overlay.svg.removeChild(overlay.svg.firstChild);

  for (const r of regions) {
    const cls = 'region' + (r.id === opts.selectedId ? ' is-selected' : '');
    if (r.shape === 'poly') {
      const poly = doc.createElementNS(NS, 'polygon');
      poly.setAttribute('points', r.points.map((p) => p.x + ',' + p.y).join(' '));
      poly.setAttribute('class', cls);
      put(overlay.svg, poly);
    } else {
      const rect = doc.createElementNS(NS, 'rect');
      rect.setAttribute('x', r.rect.x);
      rect.setAttribute('y', r.rect.y);
      rect.setAttribute('width', r.rect.w);
      rect.setAttribute('height', r.rect.h);
      rect.setAttribute('class', cls);
      put(overlay.svg, rect);
    }
  }

  // 选中态画手柄，能拖哪儿一眼看得出
  if (opts.selected) addHandles(doc, overlay.svg, opts.selected, opts.scale || 1);

  // 真正会导出的框：缩紧到墨迹后再扩 margin，虚线画出来
  const box = opts.selected && (opts.selected.box || opts.selected.ink);
  if (box) {
    const crop = doc.createElementNS(NS, 'rect');
    crop.setAttribute('x', box.x);
    crop.setAttribute('y', box.y);
    crop.setAttribute('width', box.w);
    crop.setAttribute('height', box.h);
    crop.setAttribute('class', 'cropbox');
    overlay.svg.appendChild(crop);
  }

  const draft = opts.draft;
  if (draft && draft.shape === 'rect') {
    const x = Math.min(draft.x0, draft.x1);
    const y = Math.min(draft.y0, draft.y1);
    const rect = doc.createElementNS(NS, 'rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', Math.abs(draft.x1 - draft.x0));
    rect.setAttribute('height', Math.abs(draft.y1 - draft.y0));
    rect.setAttribute('class', 'draft-rect');
    put(overlay.svg, rect);
  } else if (draft && draft.shape === 'poly' && draft.points.length > 0) {
    // 已落下的点 + 折线 + 到光标的橡皮筋
    const pts = draft.points;
    if (pts.length > 1) {
      const line = doc.createElementNS(NS, 'polyline');
      line.setAttribute('points', pts.map((p) => p.x + ',' + p.y).join(' '));
      line.setAttribute('class', 'draft-line');
      put(overlay.svg, line);
    }
    if (opts.cursor) {
      const last = pts[pts.length - 1];
      const band = doc.createElementNS(NS, 'line');
      band.setAttribute('x1', last.x);
      band.setAttribute('y1', last.y);
      band.setAttribute('x2', opts.cursor.x);
      band.setAttribute('y2', opts.cursor.y);
      band.setAttribute('class', 'draft-line');
      band.setAttribute('opacity', '0.7');
      put(overlay.svg, band);
    }
    for (const p of pts) {
      const dot = doc.createElementNS(NS, 'circle');
      dot.setAttribute('cx', p.x);
      dot.setAttribute('cy', p.y);
      dot.setAttribute('r', 8 / Math.max(0.05, opts.scale || 1));
      dot.setAttribute('class', 'draft-dot');
      put(overlay.svg, dot);
    }
  }
}

// 命中测试交给 editor；这里只把当前页的框挑出来画。
function regionsOfPage(regions, page) {
  return regions.filter((r) => r.page === page);
}

function hitTest(ed, pt, regionAtFn) {
  return regionAtFn(ed, pt);
}

// ---- src/ui/preview.js ----
// 右栏常驻预览：显示导出结果（缩紧框 + margin 的裁切）
// 状态：已实现。按 devicePixelRatio 给足分辨率，别糊。

function createPreview(host) {
  const doc = host.ownerDocument;
  const canvas = doc.createElement('canvas');
  canvas.className = 'preview-canvas';
  host.textContent = '';
  host.appendChild(canvas);
  return { canvas, host };
}

function sizeCanvas(canvas, w, h) {
  const dpr = Math.min(3, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);
  canvas.width = Math.max(1, Math.round(w * dpr));
  canvas.height = Math.max(1, Math.round(h * dpr));
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  return { ctx, dpr };
}

function renderPreview(preview, opts) {
  const canvas = preview.canvas;
  const { source, regions, selectedId, pageW, pageH, crop } = opts;

  if (crop) {
    const maxW = opts.maxW || 232;
    const w = Math.max(1, Math.round(Math.min(maxW, crop.w * (opts.zoom || 1.6))));
    const h = Math.max(1, Math.round((crop.h / crop.w) * w));
    const { ctx } = sizeCanvas(canvas, w, h);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    if (source) {
      ctx.save();
      if (opts.poly && opts.poly.length >= 3) {
        // 多边形蒙版：选区外的像素留白，预览和导出一致
        ctx.beginPath();
        opts.poly.forEach((p, i) => {
          const x = ((p.x - crop.x) / crop.w) * w;
          const y = ((p.y - crop.y) / crop.h) * h;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.closePath();
        ctx.clip();
      }
      ctx.drawImage(
        source,
        (crop.x / pageW) * source.width,
        (crop.y / pageH) * source.height,
        (crop.w / pageW) * source.width,
        (crop.h / pageH) * source.height,
        0,
        0,
        w,
        h
      );
      ctx.restore();
    }
    return { mode: 'crop', w, h };
  }

  const w = Math.max(120, Math.round(pageW / 3));
  const h = Math.max(1, Math.round((pageH / pageW) * w));
  const { ctx } = sizeCanvas(canvas, w, h);
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  if (source) ctx.drawImage(source, 0, 0, w, h);

  const sx = w / pageW;
  const sy = h / pageH;
  ctx.lineWidth = 1;
  for (const r of regions) {
    ctx.strokeStyle = r.id === selectedId ? '#ff8c00' : '#1c6ef2';
    if (r.shape === 'poly') {
      ctx.beginPath();
      r.points.forEach((p, i) => {
        const x = p.x * sx;
        const y = p.y * sy;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.stroke();
    } else {
      ctx.strokeRect(r.rect.x * sx, r.rect.y * sy, r.rect.w * sx, r.rect.h * sy);
    }
  }
  return { mode: 'page', w, h };
}

function drawCrop(preview, opts) {
  return renderPreview(preview, opts);
}

// ---- src/ui/region-list.js ----
// 右栏区域列表：本页可编辑，其他页只读分组
// 状态：已实现。




// 按页分组给列表用；真正的分组逻辑在 io/config（存盘也要用同一份）
function groupRowsByPage(regions) {
  const map = new Map();
  for (const r of regions) {
    if (!map.has(r.page)) map.set(r.page, []);
    map.get(r.page).push(r);
  }
  return [...map.entries()].sort((a, b) => a[0] - b[0]);
}

function labelOf(region) {
  const kind = region.kind === 'opt' ? '选项 ' + (region.opt || 'A') : '题干';
  const q = region.q ? ' · 第 ' + region.q + ' 题' : '';
  return kind + q;
}

function renderRegions(host, opts) {
  const doc = host.ownerDocument;
  const { regions, page, selectedId, onSelect, onChange, onDelete, onThumb, onThumbClick, onReorder } = opts;
  // 清掉上一轮挂在 body 上的类型弹层
  for (const old of doc.querySelectorAll('.opt-menu')) old.remove();
  host.textContent = '';

  const groups = groupRowsByPage(regions);
  if (groups.length === 0) {
    const empty = doc.createElement('div');
    empty.className = 'region-empty';
    empty.textContent = '还没有框。用左上角的矩形/多边形圈一张图。';
    host.appendChild(empty);
    return 0;
  }

  let rows = 0;
  for (const [pageNo, list] of groups) {
    const head = doc.createElement('div');
    head.className = 'region-group' + (pageNo === page ? ' is-current' : '');
    head.textContent = '第 ' + pageNo + ' 页 · ' + list.length + ' 个';
    host.appendChild(head);

    for (const r of list) {
      const row = doc.createElement('div');
      row.className = 'region-row' + (r.id === selectedId ? ' is-selected' : '');
      row.dataset.id = String(r.id);
      row.addEventListener('click', (ev) => {
        // 点控件（类型按钮/输入框）时不算"选中这一行"，否则列表重建会把弹层关掉
        if (ev.target && ev.target.closest && ev.target.closest('.inspector')) return;
        if (ev.target && ev.target.closest && ev.target.closest('.region-thumb')) {
          onThumbClick && onThumbClick(r);
          return;
        }
        onSelect(r);
      });

      // 拖动抓手：只在同一页内换顺序
      const grip = doc.createElement('span');
      grip.className = 'region-grip';
      grip.textContent = '⋮⋮';
      grip.title = '拖动调整顺序';
      grip.draggable = true;
      grip.addEventListener('dragstart', (ev) => {
        ev.dataTransfer.effectAllowed = 'move';
        ev.dataTransfer.setData('text/plain', String(r.id));
        row.classList.add('is-dragging');
      });
      grip.addEventListener('dragend', () => row.classList.remove('is-dragging'));
      row.addEventListener('dragover', (ev) => {
        if (r.page !== page) return;
        ev.preventDefault();
        row.classList.add('is-drop');
      });
      row.addEventListener('dragleave', () => row.classList.remove('is-drop'));
      row.addEventListener('drop', (ev) => {
        ev.preventDefault();
        row.classList.remove('is-drop');
        const id = Number(ev.dataTransfer.getData('text/plain'));
        if (id && id !== r.id && onReorder) onReorder(id, r.id);
      });
      row.appendChild(grip);

      const thumb = onThumb ? onThumb(r) : null;
      if (thumb) {
        thumb.className = 'region-thumb';
        row.appendChild(thumb);
      } else {
        const ph = doc.createElement('div');
        ph.className = 'region-thumb is-empty';
        row.appendChild(ph);
      }

      if (pageNo === page) {
        row.appendChild(buildControls(doc, r, (region, meta) => onChange(region, meta)));
      } else {
        const label = doc.createElement('div');
        label.className = 'region-label';
        label.textContent = labelOf(r);
        row.appendChild(label);
      }

      const del = doc.createElement('button');
      del.type = 'button';
      del.className = 'region-del';
      del.innerHTML = ICONS.trash;
      del.title = '删除';
      del.addEventListener('click', (ev) => {
        ev.stopPropagation();
        onDelete(r);
      });
      row.appendChild(del);

      host.appendChild(row);
      rows += 1;
    }
  }
  return rows;
}

// ---- src/ui/page-list.js ----
// 左栏页面列表：大缩略图（Papers 那种）+ 页码 + 标注数
// 状态：已实现。

function countByPage(regions) {
  const counts = {};
  for (const r of regions) counts[r.page] = (counts[r.page] || 0) + 1;
  return counts;
}

function renderPageList(host, opts) {
  const doc = host.ownerDocument;
  const { pages, current, regions, onPick, thumbFor } = opts;
  const counts = countByPage(regions || []);
  // 只替换列表本身，别把表头和折叠按钮一起清掉
  const old = host.querySelector('.page-list');
  if (old) old.remove();

  const list = doc.createElement('div');
  list.className = 'page-list' + (opts.cols === 2 ? ' is-double' : '');

  for (const p of pages) {
    const row = doc.createElement('button');
    row.type = 'button';
    row.className = 'page-item' + (p.no === current ? ' is-current' : '');
    row.dataset.page = String(p.no);
    row.title = '第 ' + p.no + ' 页';

    const frame = doc.createElement('div');
    frame.className = 'page-frame';

    const thumb = thumbFor ? thumbFor(p.no) : null;
    if (thumb) {
      thumb.className = 'page-thumb';
      frame.appendChild(thumb);
    }

    const num = doc.createElement('span');
    num.className = 'page-no';
    num.textContent = String(p.no);
    frame.appendChild(num);

    const badge = doc.createElement('span');
    badge.className = 'page-count';
    badge.textContent = counts[p.no] ? String(counts[p.no]) : '';
    frame.appendChild(badge);

    // 看大图：鼠标悬停才出现，不影响点缩略图跳页
    const zoom = doc.createElement('span');
    zoom.className = 'page-zoom';
    zoom.textContent = '⤢';
    zoom.title = '全屏看这一页';
    zoom.addEventListener('click', (ev) => {
      ev.stopPropagation();
      opts.onZoom && opts.onZoom(p.no);
    });
    frame.appendChild(zoom);

    row.appendChild(frame);
    row.addEventListener('click', () => onPick && onPick(p.no));
    list.appendChild(row);
  }

  host.appendChild(list);

  // 中间滚到哪，左栏就把它滚进可视区（只滚左栏，不动画布）
  const active = list.querySelector('.page-item.is-current');
  if (active && active.scrollIntoView) {
    active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  }
  return list;
}

function markCurrent(host, no) {
  for (const row of host.querySelectorAll('.page-item')) {
    row.classList.toggle('is-current', Number(row.dataset.page) === no);
  }
  return no;
}

// ---- src/pdf/ink.js ----
// 墨迹掩膜与笔画连通域
// 状态：已实现。掩膜吃的是 RGBA 像素数组，因此不依赖 canvas，node 里能测。

const INK_THRESHOLD = 250;

// 任一通道低于阈值就算墨迹；半透明像素按 alpha 折算。
function pixelInk(r, g, b, a, threshold) {
  if (a < 8) return 0;
  return r < threshold || g < threshold || b < threshold ? 1 : 0;
}

function buildInkMask(image, opts = {}) {
  const data = image.data;
  const width = image.width;
  const height = image.height;
  const threshold = opts.threshold === undefined ? INK_THRESHOLD : opts.threshold;
  const pxPerPt = opts.pxPerPt === undefined ? 1 : opts.pxPerPt;

  const out = new Uint8Array(width * height);
  for (let i = 0, p = 0; i < out.length; i += 1, p += 4) {
    out[i] = pixelInk(data[p], data[p + 1], data[p + 2], data[p + 3], threshold);
  }
  return { w: width, h: height, pxPerPt, data: out };
}

// 4 连通分量，返回整根笔画的包围盒与像素数。
function components(mask) {
  const seen = new Uint8Array(mask.w * mask.h);
  const out = [];

  for (let start = 0; start < mask.data.length; start += 1) {
    if (seen[start] || mask.data[start] === 0) continue;
    const stack = [start];
    seen[start] = 1;
    let minX = mask.w;
    let minY = mask.h;
    let maxX = -1;
    let maxY = -1;
    let total = 0;

    while (stack.length > 0) {
      const i = stack.pop();
      const y = Math.floor(i / mask.w);
      const x = i - y * mask.w;
      total += 1;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;

      if (x > 0) {
        const n = i - 1;
        if (!seen[n] && mask.data[n] !== 0) { seen[n] = 1; stack.push(n); }
      }
      if (x + 1 < mask.w) {
        const n = i + 1;
        if (!seen[n] && mask.data[n] !== 0) { seen[n] = 1; stack.push(n); }
      }
      if (y > 0) {
        const n = i - mask.w;
        if (!seen[n] && mask.data[n] !== 0) { seen[n] = 1; stack.push(n); }
      }
      if (y + 1 < mask.h) {
        const n = i + mask.w;
        if (!seen[n] && mask.data[n] !== 0) { seen[n] = 1; stack.push(n); }
      }
    }

    out.push({ minX, minY, maxX, maxY, total });
  }
  return out;
}

// 命中某个像素时返回它所在的那根笔画，否则 null。
function strokeAt(mask, x, y) {
  if (x < 0 || y < 0 || x >= mask.w || y >= mask.h) return null;
  if (mask.data[y * mask.w + x] === 0) return null;

  const seen = new Uint8Array(mask.w * mask.h);
  const stack = [y * mask.w + x];
  seen[stack[0]] = 1;
  let minX = x;
  let minY = y;
  let maxX = x;
  let maxY = y;
  let total = 0;

  while (stack.length > 0) {
    const i = stack.pop();
    const py = Math.floor(i / mask.w);
    const px = i - py * mask.w;
    total += 1;
    if (px < minX) minX = px;
    if (px > maxX) maxX = px;
    if (py < minY) minY = py;
    if (py > maxY) maxY = py;
    const nbrs = [px > 0 ? i - 1 : -1, px + 1 < mask.w ? i + 1 : -1, py > 0 ? i - mask.w : -1, py + 1 < mask.h ? i + mask.w : -1];
    for (const n of nbrs) {
      if (n >= 0 && !seen[n] && mask.data[n] !== 0) { seen[n] = 1; stack.push(n); }
    }
  }

  return { minX, minY, maxX, maxY, total };
}

// ---- src/core/whitemargin.js ----
/* 导出框 = 选区内非白像素的最外接框，再每边扩 margin（导出仍是完整矩形图）。
   需求原文：钢笔框选 → 收缩背景至非白色像素 → 扩展 margin

   要点：
     - **只算多边形内部的像素**。多边形存在的意义就是排除矩形躲不开的东西
       （相邻图、边框、题号），所以框外哪怕有墨也不算进外接框。
     - 导出不做多边形蒙版：裁出来是完整矩形图，跨到边界上的内容不会被切掉形状。
     - 不做纯白吸附：外接框本身贴墨迹，纯白四边由 margin 提供。
   坐标：进来 pt，内部 px，出去 pt。 */

const INK_T = 246;   // 任一通道低于它就算非白
const MIN_ALPHA = 8;

function rectToPoly(rect) {
  return [
    { x: rect.x, y: rect.y },
    { x: rect.x + rect.w, y: rect.y },
    { x: rect.x + rect.w, y: rect.y + rect.h },
    { x: rect.x, y: rect.y + rect.h },
  ];
}

// 多边形在第 yc 行命中的 x 区间（偶奇规则）
function spansAt(poly, s, yc) {
  const xs = [];
  const n = poly.length;
  for (let i = 0, j = n - 1; i < n; j = i, i += 1) {
    const yi = poly[i].y * s;
    const yj = poly[j].y * s;
    if (yi > yc === yj > yc) continue;
    const xi = poly[i].x * s;
    const xj = poly[j].x * s;
    xs.push(xi + ((yc - yi) * (xj - xi)) / (yj - yi));
  }
  xs.sort((a, b) => a - b);
  const out = [];
  for (let k = 0; k + 1 < xs.length; k += 2) out.push([xs[k], xs[k + 1]]);
  return out;
}

// 8 连通标注（只标墨迹，不区分文字）
function labelInk(mask, minArea = 4) {
  const { w, h, data } = mask;
  const lab = new Int32Array(w * h);
  const stack = new Int32Array(w * h);
  const comps = [];
  let id = 0;

  for (let p = 0; p < lab.length; p += 1) {
    if (lab[p] || !data[p]) continue;
    id += 1;
    let sp = 0;
    stack[sp++] = p;
    lab[p] = id;
    let minX = w;
    let minY = h;
    let maxX = -1;
    let maxY = -1;
    let total = 0;

    while (sp) {
      const q = stack[--sp];
      const x = q % w;
      const y = (q / w) | 0;
      total += 1;
      if (x < minX) minX = x;
      if (x > maxX) maxX = x;
      if (y < minY) minY = y;
      if (y > maxY) maxY = y;
      for (let dy = -1; dy <= 1; dy += 1) {
        const ny = y + dy;
        if (ny < 0 || ny >= h) continue;
        for (let dx = -1; dx <= 1; dx += 1) {
          if (!dx && !dy) continue;
          const nx = x + dx;
          if (nx < 0 || nx >= w) continue;
          const nq = ny * w + nx;
          if (!lab[nq] && data[nq]) {
            lab[nq] = id;
            stack[sp++] = nq;
          }
        }
      }
    }

    if (total >= minArea) comps.push({ id, minX, minY, maxX, maxY, total });
  }
  return comps;
}

// 与选区相交的笔画整根纳入（跨出框的线不会被切断），返回并集外接框
function contentBounds(mask, rect) {
  const s = mask.pxPerPt;
  const x0 = Math.max(0, Math.floor(rect.x * s));
  const y0 = Math.max(0, Math.floor(rect.y * s));
  const x1 = Math.min(mask.w - 1, Math.ceil((rect.x + rect.w) * s) - 1);
  const y1 = Math.min(mask.h - 1, Math.ceil((rect.y + rect.h) * s) - 1);
  if (x1 < x0 || y1 < y0) return null;

  const comps = labelInk(mask);
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  let hit = 0;

  for (const c of comps) {
    if (c.maxX < x0 || c.minX > x1 || c.maxY < y0 || c.minY > y1) continue;
    // 只在框边擦过 1px 的碎屑不算（避免页眉横线把整页拉进来）
    const ox = Math.min(c.maxX, x1) - Math.max(c.minX, x0) + 1;
    const oy = Math.min(c.maxY, y1) - Math.max(c.minY, y0) + 1;
    if (ox * oy < 2) continue;
    hit += 1;
    if (c.minX < minX) minX = c.minX;
    if (c.minY < minY) minY = c.minY;
    if (c.maxX > maxX) maxX = c.maxX;
    if (c.maxY > maxY) maxY = c.maxY;
  }

  if (hit === 0) return null;
  return { minX, minY, maxX, maxY };
}

// 掩膜内非白像素的最小外接框（px）。掩膜没有则返回 null。
function inkBounds(mask, shape) {
  const poly = Array.isArray(shape) ? shape : rectToPoly(shape);
  if (poly.length < 3) return null;
  const s = mask.pxPerPt;
  const { w, h, data } = mask;

  let top = Infinity;
  let bot = -Infinity;
  for (const p of poly) {
    if (p.y < top) top = p.y;
    if (p.y > bot) bot = p.y;
  }
  const y0 = Math.max(0, Math.floor(top * s));
  const y1 = Math.min(h - 1, Math.ceil(bot * s));

  let minX = Infinity;
  let maxX = -Infinity;
  let minY = Infinity;
  let maxY = -Infinity;

  for (let py = y0; py <= y1; py += 1) {
    const spans = spansAt(poly, s, py + 0.5);
    if (spans.length === 0) continue;
    const base = py * w;
    let rowHit = false;
    for (const [xa, xb] of spans) {
      const a = Math.max(0, Math.ceil(xa));
      const b = Math.min(w - 1, Math.floor(xb - 0.001));
      for (let px = a; px <= b; px += 1) {
        if (!data[base + px]) continue;
        if (px < minX) minX = px;
        if (px > maxX) maxX = px;
        rowHit = true;
      }
    }
    if (rowHit) {
      if (py < minY) minY = py;
      if (py > maxY) maxY = py;
    }
  }

  if (!Number.isFinite(minX)) return null;
  return { minX, minY, maxX, maxY };
}

// 导出框（pt）：框内非白像素的外接矩形；框里全白返回 null。
// 选区 → 外接矩形（"填充为矩形"这一步）
function fillToRect(shape) {
  const poly = Array.isArray(shape) ? shape : rectToPoly(shape);
  let x0 = Infinity;
  let y0 = Infinity;
  let x1 = -Infinity;
  let y1 = -Infinity;
  for (const p of poly) {
    if (p.x < x0) x0 = p.x;
    if (p.y < y0) y0 = p.y;
    if (p.x > x1) x1 = p.x;
    if (p.y > y1) y1 = p.y;
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function computeExportBox(mask, shape) {
  // 只量多边形内部的非白像素：多边形用来排除矩形躲不开的内容
  const b = inkBounds(mask, shape) || inkBounds(mask, fillToRect(shape));
  if (!b) return null;
  const s = mask.pxPerPt;
  return {
    x: b.minX / s,
    y: b.minY / s,
    w: (b.maxX - b.minX + 1) / s,
    h: (b.maxY - b.minY + 1) / s,
  };
}

// 每边加边距，夹在页内（不看墨迹）
function withMargin(box, margin, pageW, pageH) {
  const m = margin > 0 ? margin : 0;
  const x0 = Math.max(0, box.x - m);
  const y0 = Math.max(0, box.y - m);
  const x1 = Math.min(pageW, box.x + box.w + m);
  const y1 = Math.min(pageH, box.y + box.h + m);
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

// 加边距，但只往白里长：哪条边走边碰到墨就停在那儿。
// 这样 margin 不会把旁边的横线、题号拖进导出图。
function growWhite(mask, box, margin, pageW, pageH) {
  if (!(margin > 0)) return { ...box };
  const s = mask.pxPerPt;
  const maxPx = Math.max(0, Math.round(margin * s));
  if (!maxPx) return { ...box };
  const c = (v, hi) => Math.min(hi, Math.max(0, v));

  let l = c(Math.floor(box.x * s), mask.w - 1);
  let t = c(Math.floor(box.y * s), mask.h - 1);
  let r = c(Math.ceil((box.x + box.w) * s) - 1, mask.w - 1);
  let b = c(Math.ceil((box.y + box.h) * s) - 1, mask.h - 1);

  const colWhite = (x) => {
    for (let y = t; y <= b; y += 1) if (mask.data[y * mask.w + x]) return false;
    return true;
  };
  const rowWhite = (y) => {
    for (let x = l; x <= r; x += 1) if (mask.data[y * mask.w + x]) return false;
    return true;
  };

  for (let n = 0; n < maxPx && l > 0 && colWhite(l - 1); n += 1) l -= 1;
  for (let n = 0; n < maxPx && r < mask.w - 1 && colWhite(r + 1); n += 1) r += 1;
  for (let n = 0; n < maxPx && t > 0 && rowWhite(t - 1); n += 1) t -= 1;
  for (let n = 0; n < maxPx && b < mask.h - 1 && rowWhite(b + 1); n += 1) b += 1;

  return { x: l / s, y: t / s, w: (r - l + 1) / s, h: (b - t + 1) / s };
}

// 对齐到导出像素网格：向内取整，不重采样
function cropRect(box, pageW, pageH, scale) {
  const pxW = Math.max(1, Math.round(pageW * scale));
  const pxH = Math.max(1, Math.round(pageH * scale));
  const clampPx = (v, hi) => Math.min(hi, Math.max(0, v));

  const x0 = clampPx(Math.ceil(box.x * scale - 1e-6), pxW - 1);
  const y0 = clampPx(Math.ceil(box.y * scale - 1e-6), pxH - 1);
  const x1 = clampPx(Math.max(Math.floor((box.x + box.w) * scale + 1e-6), x0 + 1), pxW);
  const y1 = clampPx(Math.max(Math.floor((box.y + box.h) * scale + 1e-6), y0 + 1), pxH);

  return { px: [x0, y0, x1, y1], x: x0 / scale, y: y0 / scale, w: (x1 - x0) / scale, h: (y1 - y0) / scale };
}

function isWhiteRow(mask, y, x0 = 0, x1 = mask.w) {
  if (y < 0 || y >= mask.h) return true;
  const a = Math.max(0, Math.floor(x0));
  const b = Math.min(mask.w, Math.ceil(x1));
  for (let x = a; x < b; x += 1) if (mask.data[y * mask.w + x] !== 0) return false;
  return true;
}

function isWhiteCol(mask, x, y0 = 0, y1 = mask.h) {
  if (x < 0 || x >= mask.w) return true;
  const a = Math.max(0, Math.floor(y0));
  const b = Math.min(mask.h, Math.ceil(y1));
  for (let y = a; y < b; y += 1) if (mask.data[y * mask.w + x] !== 0) return false;
  return true;
}

// 标签只能落在纯白处（导出时可选画题号/选项字母）
function findLabelSpot(mask, labelRect, candidates) {
  const s = mask.pxPerPt;
  for (const c of candidates) {
    const x = Math.round(c.x * s);
    const y = Math.round(c.y * s);
    const w = Math.round(labelRect.w * s);
    const h = Math.round(labelRect.h * s);
    if (x < 0 || y < 0 || x + w > mask.w || y + h > mask.h) continue;
    let clear = true;
    for (let j = 0; j < h && clear; j += 1) {
      for (let i = 0; i < w; i += 1) {
        if (mask.data[(y + j) * mask.w + (x + i)] !== 0) { clear = false; break; }
      }
    }
    if (clear) return { x: c.x, y: c.y };
  }
  return null;
}

// ---- src/core/history.js ----
// 撤销重做栈与微移合并
// 状态：已实现。存的是"整份快照"，合并窗口内同 key 的动作只留一条。

const COALESCE_MS = 600;

function createHistory(initial, opts = {}) {
  return {
    present: initial === undefined ? null : initial,
    past: [],
    future: [],
    limit: opts.limit === undefined ? 200 : opts.limit,
    windowMs: opts.windowMs === undefined ? COALESCE_MS : opts.windowMs,
    now: opts.now || (() => Date.now()),
    lastKey: null,
    lastTime: 0,
  };
}

function current(h) {
  return h.present;
}

// key 相同且落在合并窗口内 → 只更新 present，不再压一条历史。
function commit(h, next, opts = {}) {
  const key = opts.key === undefined ? null : opts.key;
  const t = h.now();
  const merge = key !== null && key === h.lastKey && t - h.lastTime <= h.windowMs && h.past.length > 0;

  if (!merge) {
    h.past.push(h.present);
    if (h.past.length > h.limit) h.past.shift();
  }
  h.present = next;
  h.lastKey = key;
  h.lastTime = t;
  h.future.length = 0;
  return next;
}

function undo(h) {
  if (h.past.length === 0) return null;
  h.future.push(h.present);
  h.present = h.past.pop();
  h.lastKey = null;
  return h.present;
}

function redo(h) {
  if (h.future.length === 0) return null;
  h.past.push(h.present);
  h.present = h.future.pop();
  h.lastKey = null;
  return h.present;
}

function canUndo(h) {
  return h.past.length > 0;
}

function canRedo(h) {
  return h.future.length > 0;
}

// pdf.js 走 CDN，worker 跟同一个版本
const PDFJS_VERSION = '3.11.174';
const WORKER_SRC = 'https://unpkg.com/pdfjs-dist@' + PDFJS_VERSION + '/build/pdf.worker.min.js';

async function openFile(file, opts = {}) {
