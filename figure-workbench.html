<!doctype html>
<html lang="zh-CN" data-ui="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figcut</title>


<style>
/* figcut 设计令牌：Adwaita 风格浅/深两套 + 排版与控件尺寸。 */
:root {
  color-scheme: light;
  --accent: #3584e4;
  --accent-hover: #4a90e8;
  --accent-fg: #ffffff;
  --opt: #e5a50a;
  --destructive: #e01b24;
  --window: #fafafa;
  --header: #ebebeb;
  --sidebar: #f2f2f2;
  --view: #f6f5f4;
  --card: #ffffff;
  --page: #ffffff;
  --page-dark: #1b1b1b;
  --line: rgba(0, 0, 0, 0.1);
  --line-strong: rgba(0, 0, 0, 0.18);
  --hover: rgba(0, 0, 0, 0.06);
  --active: rgba(0, 0, 0, 0.12);
  --sel: rgba(53, 132, 228, 0.16);
  --ink-box: rgba(224, 27, 36, 0.55);
  --text: rgba(0, 0, 0, 0.88);
  --text-2: rgba(0, 0, 0, 0.56);
  --text-3: rgba(0, 0, 0, 0.38);
  --h-header: 46px;
  --w-side: 176px;
  --w-panel: 250px;
  --r-ctl: 6px;
  --ctl-h: 28px;
  --font: "Adwaita Sans", Cantarell, system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Source Code Pro", monospace;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.08);
  --shadow-2: 0 3px 9px rgba(0, 0, 0, 0.14);
}

:root[data-ui="dark"] {
  color-scheme: dark;
  --accent: #3584e4;
  --accent-hover: #4a90e8;
  --destructive: #ff7b72;
  --window: #242424;
  --header: #303030;
  --sidebar: #2b2b2b;
  --view: #1e1e1e;
  --card: #363636;
  --page: #ffffff;
  --page-dark: #141414;
  --line: rgba(255, 255, 255, 0.1);
  --line-strong: rgba(255, 255, 255, 0.18);
  --hover: rgba(255, 255, 255, 0.08);
  --active: rgba(255, 255, 255, 0.14);
  --sel: rgba(53, 132, 228, 0.32);
  --ink-box: rgba(255, 123, 114, 0.6);
  --text: #ffffff;
  --text-2: rgba(255, 255, 255, 0.72);
  --text-3: rgba(255, 255, 255, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 3px 9px rgba(0, 0, 0, 0.45);
}

</style>
<style>
/* 布局与组件：顶栏 / 左栏 / 画布 / 右栏。 */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--window);
  color: var(--text);
  font: 13px/1.4 var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: var(--h-header) minmax(0, 1fr);
  background: var(--window);
}

/* ---------- 顶栏 ---------- */

.topbar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  background: var(--header);
  border-bottom: 1px solid var(--line);
}

.cluster { display: flex; align-items: center; gap: 6px; }
.cluster-right { margin-left: auto; }

.title-block {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 36vw;
  text-align: center;
  pointer-events: none;
}

.title {
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.subtitle {
  font-size: 10.5px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- 按钮 ---------- */

.btn {
  height: var(--ctl-h);
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-ctl);
  background: var(--card);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: var(--shadow-1);
}

.btn:hover { background: var(--hover); }

.btn.suggested {
  background: var(--accent);
  border-color: transparent;
  color: var(--accent-fg);
}

.btn.suggested:hover { background: var(--accent-hover); }

.icon-btn {
  width: var(--ctl-h);
  height: var(--ctl-h);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--r-ctl);
  background: transparent;
  color: var(--text-2);
}

.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.on { background: var(--sel); color: var(--accent); }
.icon-btn svg, .btn svg { display: block; flex: none; }

/* ---------- 三栏 ---------- */

.body {
  display: grid;
  grid-template-columns: var(--w-side) 5px minmax(0, 1fr) 5px var(--w-panel);
  min-height: 0;
}

.sidebar, .panel { min-height: 0; overflow: auto; background: var(--sidebar); }
.sidebar { border-right: 1px solid var(--line); }
.panel { border-left: 1px solid var(--line); display: flex; flex-direction: column; }

.sidebar.is-collapsed, .panel.is-collapsed { display: none; }

.splitter { position: relative; cursor: col-resize; background: transparent; }
.splitter::after {
  content: '';
  position: absolute;
  inset: 0 2px;
  background: transparent;
  transition: background 0.12s;
}
.splitter:hover::after, .splitter.is-dragging::after { background: var(--accent); opacity: 0.5; }

.side-head {
  padding: 9px 12px 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  letter-spacing: 0.02em;
}

/* ---------- 画布 ---------- */

.canvas {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--view);
}

.pages {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 56px 24px 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  overflow-anchor: none;
}

.page-row { display: flex; align-items: flex-start; justify-content: center; gap: 20px; }

.page {
  position: relative;
  background: var(--page);
  box-shadow: var(--shadow-1);
  border-radius: 2px;
}

.page canvas { display: block; width: 100%; height: 100%; border-radius: 2px; }
.page-overlay { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.regions { width: 100%; height: 100%; overflow: visible; }

.region {
  fill: rgba(53, 132, 228, 0.06);
  stroke: var(--accent);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.region.is-selected { fill: rgba(53, 132, 228, 0.12); stroke-width: 1.6; }

.region.is-draft {
  fill: rgba(53, 132, 228, 0.08);
  stroke-dasharray: 4 3;
}

.handle {
  fill: #ffffff;
  stroke: var(--accent);
  stroke-width: 1.4;
  vector-effect: non-scaling-stroke;
}

/* ---------- 浮动工具组与缩放 ---------- */

.tool-group {
  position: absolute;
  left: 12px;
  top: 10px;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 9px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-2);
  z-index: 6;
}

.tool-group .icon-btn { width: 30px; height: 28px; border-radius: 6px; }

.zoom-control {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 2px;
  height: var(--ctl-h);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-ctl);
  background: var(--card);
  box-shadow: var(--shadow-1);
}

.zoom-control .icon-btn { width: 24px; height: 22px; border-radius: 4px; }

.zoom-input {
  width: 58px;
  height: 22px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text);
  text-align: center;
  font-family: var(--mono);
  font-size: 11.5px;
}

.zoom-input:focus { background: var(--hover); outline: none; }

.zoom-presets {
  height: 22px;
  padding: 0 2px;
  border: 0;
  border-radius: 4px;
  background: var(--card);
  color: var(--text);
  font-size: 11.5px;
  cursor: pointer;
}

.zoom-presets:hover { background: var(--hover); }
.zoom-presets option { background: var(--card); color: var(--text); }

.zoom-sep { width: 1px; height: 16px; margin: 0 2px; background: var(--line); }

/* ---------- 空状态 ---------- */

.empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  pointer-events: none;
  color: var(--text-3);
}

.empty .big { font-size: 15px; font-weight: 700; color: var(--text-2); }
.empty .small { font-size: 11.5px; }

/* ---------- 左栏页面列表 ---------- */

.page-list { padding: 2px 6px 8px; display: flex; flex-direction: column; gap: 1px; }

.page-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  min-height: 62px;
  padding: 4px 8px;
  border: 0;
  border-radius: var(--r-ctl);
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  text-align: left;
}

.page-thumb {
  width: 40px;
  height: 54px;
  flex: none;
  border-radius: 3px;
  border: 1px solid var(--line);
  background: #fff;
}

.page-no { flex: 1; }

.page-item:hover { background: var(--hover); }
.page-item.is-current { background: var(--sel); color: var(--text); font-weight: 600; }
.page-no { font-variant-numeric: tabular-nums; }

.page-count {
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.page-count:empty { display: none; }

/* ---------- 右栏 ---------- */

.preview-host { padding: 8px; }

.preview-canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 4px;
  background: var(--page);
  border: 1px solid var(--line);
}

.region-list { padding: 0 6px 8px; }
.region-empty { padding: 12px 8px; color: var(--text-3); font-size: 11.5px; line-height: 1.5; }

.region-group {
  display: flex;
  justify-content: space-between;
  padding: 10px 4px 3px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
}

.region-group.is-current { color: var(--text-2); }

.region-row {
  display: grid;
  grid-template-columns: 1fr auto;
  align-items: center;
  gap: 4px;
  padding: 4px 6px;
  border-radius: 7px;
  cursor: pointer;
}

.region-row:hover { background: var(--hover); }
.region-row.is-selected { background: var(--sel); }

.inspector { display: flex; align-items: center; gap: 4px; min-width: 0; }

.region-kind, .region-q, .region-note {
  height: 22px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--card);
  font-size: 11.5px;
  min-width: 0;
}

.region-kind { width: 58px; font-size: 11px; }
.region-q { width: 48px; font-family: var(--mono); padding: 0 5px; }
.region-note { flex: 1; padding: 0 5px; border-color: var(--line); color: var(--text-2); }
.region-label { font-size: 11.5px; color: var(--text-2); }

.region-del {
  width: 20px;
  height: 20px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--destructive);
}

.region-del:hover { background: var(--hover); }

/* ---------- 弹出设置 ---------- */

.settings-popover {
  position: fixed;
  top: 50px;
  right: 12px;
  z-index: 40;
  display: flex;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-2);
}

.settings-popover[hidden] { display: none; }

.settings-popover label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }

.settings-popover input {
  width: 66px;
  height: 24px;
  padding: 0 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-ctl);
  background: var(--card);
  font-family: var(--mono);
  font-size: 11.5px;
}

/* ---------- 提示条 ---------- */

.banner {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  z-index: 60;
  max-width: 70vw;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(20, 20, 20, 0.92);
  color: #fff;
  font-size: 12.5px;
  pointer-events: none;
  box-shadow: var(--shadow-2);
}

.banner[hidden] { display: none; }
.banner[data-kind="error"] { background: var(--destructive); }

/* ---------- PDF 预览反相：只反相纸面 ---------- */

:root[data-pdf-invert="1"] .page canvas,
:root[data-pdf-invert="1"] .preview-canvas { filter: invert(1); }

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="cluster cluster-left" id="topbar-left"></div>
    <div class="title-block"><div class="title" id="topbar-title">figcut</div></div>
    <div class="cluster cluster-right" id="topbar-right"></div>
  </header>
  <main class="body" id="body">
    <aside class="sidebar" id="panel-left"><div class="side-head" id="side-head">页面</div></aside>
    <div class="splitter" id="split-left" title="拖动调整宽度，双击折叠"></div>
    <div class="canvas" id="canvas">
      <div class="empty" id="empty">
        <div class="big">把 PDF 拖进来</div>
        <div class="small">或点左上角「打开」</div>
      </div>
    </div>
    <div class="splitter" id="split-right" title="拖动调整宽度，双击折叠"></div>
    <aside class="panel" id="panel-right"></aside>
  </main>
  <div class="banner" id="banner" hidden></div>
</div>
<script src="vendor/pdfjs/pdf.min.js"></script>
<script>
(function () {
'use strict';

// ---- src/core/errors.js ----
// 错误类型与未实现占位
// 状态：骨架。接口已冻结，实现待补。

function figcutError(code, message, context) {
  const err = new Error(message);
  err.name = 'FigcutError';
  err.code = code;
  err.context = context || {};
  return err;
}

function notImplemented(name) {
  return figcutError('not-implemented', '未实现: ' + name, { name });
}

// ---- src/ui/shell.js ----
// 顶栏与三栏骨架
// 状态：已实现。只读 DOM 引用 + 少量写操作。



function createShell(root) {
  const doc = root || (typeof document !== 'undefined' ? document : null);
  if (!doc) throw figcutError('no-dom', '没有 DOM 就搭不出骨架');

  const el = (id) => {
    const node = doc.getElementById(id);
    if (!node) throw figcutError('missing-node', 'index.html 缺少 #' + id, { id });
    return node;
  };

  return {
    left: el('topbar-left'),
    right: el('topbar-right'),
    title: el('topbar-title'),
    canvas: el('canvas'),
    panelLeft: el('panel-left'),
    panelRight: el('panel-right'),
    empty: el('empty'),
    banner: el('banner'),
  };
}

function setTitle(shell, text) {
  shell.title.textContent = text;
  return text;
}

function setFileInfo(shell, text) {
  shell.title.textContent = text;
  return text;
}

function setEmpty(shell, visible) {
  shell.empty.style.display = visible ? '' : 'none';
}

function addButtonTo(container, label, onClick, opts = {}) {
  const doc = (container && container.ownerDocument) || (typeof document !== 'undefined' ? document : null);
  if (!doc) throw figcutError('no-dom', '没有 DOM 就加不了按钮');
  const btn = doc.createElement('button');
  btn.type = 'button';
  btn.className = opts.kind === 'btn' ? 'btn' : 'icon-btn';
  if (opts.suggested) btn.classList.add('suggested');
  if (opts.icon) btn.innerHTML = opts.icon;
  else btn.textContent = label;
  if (opts.title) btn.title = opts.title;
  if (opts.ariaLabel) btn.setAttribute('aria-label', opts.ariaLabel);
  btn.addEventListener('click', onClick);
  container.appendChild(btn);
  return btn;
}

function addButton(shell, side, label, onClick, opts = {}) {
  return addButtonTo(side === 'right' ? shell.right : shell.left, label, onClick, opts);
}

// ---- src/core/units.js ----
// 单位换算：pdf pt / css px / 输出 dpi
// 状态：已实现。PDF 坐标一律 pt，页内左上原点、y 向下。

const PT_PER_INCH = 72;

// pt → 导出像素：dpi 是每英寸像素，pt 是 1/72 英寸。
function pxForDpi(pt, dpi) {
  return (pt / PT_PER_INCH) * dpi;
}

// pt → css 像素：scale 是当前缩放倍率（100% = 1）。
function ptToPx(pt, scale) {
  return pt * scale;
}

function pxToPt(px, scale) {
  if (!Number.isFinite(scale) || scale <= 0) {
    throw figcutError('bad-scale', '缩放倍率必须是正有限数', { scale });
  }
  return px / scale;
}

// NaN 返回下界（坐标计算里出现 NaN 时宁可贴边也不要写进模型）；
// 正无穷贴上限、负无穷贴下限，符合夹取直觉。
function clamp(value, lo, hi) {
  if (!Number.isFinite(value)) return value === Infinity ? hi : lo;
  if (lo > hi) return lo;
  return value < lo ? lo : value > hi ? hi : value;
}

// ---- src/core/layout.js ----
// 视图布局：单双页、书式配对、适应缩放、缩放台阶
// 状态：已实现。纯计算，页尺寸与视口尺寸都由调用方给。



const MIN_SCALE = 0.25;
const MAX_SCALE = 8;

// 照 GNOME Papers：
//   单页 → 每页一行
//   双页书式（默认）→ 第 1 页单独在右，之后 2|3、4|5
//   双页 + 奇数页在左 → 1|2、3|4、5|6
function pageCombos(pageCount, opts = {}) {
  const dual = !!opts.dual;
  const oddLeft = !!opts.oddLeft;
  const rows = [];

  if (!dual) {
    for (let p = 1; p <= pageCount; p += 1) rows.push([p]);
    return rows;
  }

  if (oddLeft) {
    for (let p = 1; p <= pageCount; p += 2) {
      rows.push(p + 1 <= pageCount ? [p, p + 1] : [p]);
    }
    return rows;
  }

  if (pageCount >= 1) rows.push([1]);
  for (let p = 2; p <= pageCount; p += 2) {
    rows.push(p + 1 <= pageCount ? [p, p + 1] : [p]);
  }
  return rows;
}

// 适应页面：整页必须完整可见，padding 按真实的上下留白算。
function fitPageScale(opts) {
  const padX = opts.padX || 0;
  const padY = opts.padY || 0;
  const avw = Math.max(1, opts.viewportW - padX * 2);
  const avh = Math.max(1, opts.viewportH - padY * 2);
  if (!(opts.pageW > 0) || !(opts.pageH > 0)) return 1;
  const scale = Math.min(avw / opts.pageW, avh / opts.pageH);
  return clamp(Math.floor(scale * 1000) / 1000, MIN_SCALE, MAX_SCALE);
}

// 适应宽度：横向不许出滚动条，所以最后再往下抹一点余量。
function fitWidthScale(opts) {
  const padX = opts.padX || 0;
  const avw = Math.max(1, opts.viewportW - padX * 2);
  if (!(opts.pageW > 0)) return 1;
  const scale = avw / opts.pageW;
  return clamp(Math.floor(scale * 1000) / 1000, MIN_SCALE, MAX_SCALE);
}

function zoomPresets() {
  return [0.5, 0.7, 0.85, 1, 1.25, 1.5, 1.75, 2, 3, 4, 8];
}

// 缩放按钮 / 快捷键：按 ×1.2 步进，并夹在 25%–800%。
function stepZoom(scale, dir) {
  const factor = dir >= 0 ? 1.2 : 1 / 1.2;
  return clamp(Math.round(scale * factor * 1000) / 1000, MIN_SCALE, MAX_SCALE);
}

// ---- src/view/zoom.js ----
// 缩放与鼠标锚点
// 状态：已实现。状态与数学都在这，DOM 由 ui/zoom-control 负责。




function createZoom(opts = {}) {
  return {
    scale: opts.scale === undefined ? 1 : opts.scale,
    mode: 'free',
    min: MIN_SCALE,
    max: MAX_SCALE,
    listeners: new Set(),
  };
}

function notify(z) {
  for (const fn of z.listeners) fn(z.scale, z.mode);
}

function subscribe(z, fn) {
  z.listeners.add(fn);
  return () => z.listeners.delete(fn);
}

function setScale(z, value) {
  const next = clamp(Number(value), z.min, z.max);
  if (!Number.isFinite(next)) return z.scale;
  z.mode = 'free';
  if (Math.abs(next - z.scale) < 1e-6) return z.scale;
  z.scale = next;
  notify(z);
  return z.scale;
}

// 'page' 整页可见，'width' 贴满宽度
function setFit(z, mode, dims) {
  const scale =
    mode === 'page'
      ? fitPageScale(dims)
      : mode === 'width'
        ? fitWidthScale(dims)
        : z.scale;
  z.mode = mode;
  if (Math.abs(scale - z.scale) > 1e-6) {
    z.scale = scale;
    notify(z);
  }
  return z.scale;
}

// 以指针为锚点缩放的滚动补偿：指针下的内容不许漂。
function anchorAt(scroll, px, py, from, to) {
  if (!(from > 0) || !(to > 0)) return { x: scroll.x, y: scroll.y };
  const cx = (scroll.x + px) / from;
  const cy = (scroll.y + py) / from;
  return {
    x: Math.max(0, cx * to - px),
    y: Math.max(0, cy * to - py),
  };
}

// ---- src/app/shortcuts.js ----
// 快捷键表与输入框豁免
// 状态：已实现。resolveKey 是纯函数，绑定时只负责 preventDefault + 分发。

const KEYMAP = {
  v: 'tool.select',
  r: 'tool.rect',
  g: 'tool.poly',
  n: 'page.next',
  p: 'page.prev',
  f: 'zoom.fitPage',
  w: 'zoom.fitWidth',
  '+': 'zoom.in',
  '=': 'zoom.in',
  '-': 'zoom.out',
  c: 'view.continuous',
  d: 'view.dual',
  o: 'view.oddLeft',
};

const TYPING_TAGS = ['INPUT', 'TEXTAREA', 'SELECT'];

function isTyping(ev) {
  const t = ev.target;
  if (!t) return false;
  if (t.isContentEditable) return true;
  return TYPING_TAGS.includes(String(t.tagName || '').toUpperCase());
}

// 焦点在输入框时不拦截（Esc 除外），否则用户打不出字母 n。
function resolveKey(ev) {
  const key = ev.key;
  if (!key) return null;
  const ctrl = !!(ev.ctrlKey || ev.metaKey);

  if (isTyping(ev)) return key === 'Escape' ? 'cancel' : null;

  if (ctrl) {
    const lower = key.toLowerCase();
    if (lower === 'z') return 'history.undo';
    if (lower === 'y') return 'history.redo';
    if (lower === 'e') return 'export.zip';
    if (lower === 's') return 'config.save';
    if (lower === 'o') return 'file.open';
    if (lower === 'i') return 'view.invert';
    if (key === '0') return 'zoom.reset';
    if (key === 'Home') return 'page.first';
    if (key === 'End') return 'page.last';
    return null;
  }

  if (key === 'Escape') return 'cancel';
  if (key === 'Enter') return 'tool.closePoly';
  if (key === 'Delete' || key === 'Backspace') return 'region.delete';
  if (key === 'PageDown') return ev.shiftKey ? 'page.plus10' : 'page.next';
  if (key === 'PageUp') return ev.shiftKey ? 'page.minus10' : 'page.prev';

  if (key.startsWith('Arrow')) {
    if (!ev.shiftKey) return null;
    return 'region.nudge';
  }

  const mapped = KEYMAP[key.toLowerCase()];
  return mapped || null;
}

// nudge 需要方向信息，单独给一个纯函数，方便单测。
function nudgeVector(ev) {
  const step = ev.altKey ? 10 : 1;
  switch (ev.key) {
    case 'ArrowLeft':
      return { dx: -step, dy: 0 };
    case 'ArrowRight':
      return { dx: step, dy: 0 };
    case 'ArrowUp':
      return { dx: 0, dy: -step };
    case 'ArrowDown':
      return { dx: 0, dy: step };
    default:
      return { dx: 0, dy: 0 };
  }
}

function bindShortcuts(target, handlers, opts = {}) {
  const onKey = (ev) => {
    const action = resolveKey(ev);
    if (!action) return;
    const fn = handlers[action];
    if (!fn) return;
    ev.preventDefault();
    fn(ev, action);
  };
  const el = target || (typeof document !== 'undefined' ? document : null);
  if (!el) return () => {};
  el.addEventListener('keydown', onKey);
  return () => el.removeEventListener('keydown', onKey);
}

// ---- src/view/navigator.js ----
// 翻页与页码跳转
// 状态：已实现。真正的滚动由 page-stack 负责，这里只管"该去第几页"。

function createNavigator(stack, opts = {}) {
  return {
    stack,
    total: opts.total || 0,
    current: 1,
  };
}

function clampPage(nav, no) {
  const total = nav.total || (nav.stack && nav.stack.pages.length) || 1;
  return Math.min(Math.max(1, Math.round(no)), total);
}

function gotoPage(nav, no) {
  const next = clampPage(nav, no);
  nav.current = next;
  if (nav.stack) nav.stack.setCurrent(next);
  return next;
}

function nextPage(nav, delta = 1) {
  return gotoPage(nav, nav.current + delta);
}

function prevPage(nav, delta = 1) {
  return gotoPage(nav, nav.current - delta);
}

// 滚动时按"离视口顶部最近的页"更新当前页
function pageAtScroll(rects, viewportTop) {
  if (!rects || rects.length === 0) return 1;
  let best = rects[0];
  let bestD = Infinity;
  for (const r of rects) {
    const d = Math.abs(r.top - viewportTop);
    if (d < bestD) {
      bestD = d;
      best = r;
    }
  }
  return best.no;
}

function renderZoomControl(opts) {

  plus.type = 'button';
  plus.className = 'icon-btn';
  plus.innerHTML = ICONS.plus;
  plus.setAttribute('aria-label', '放大');

  const fitPage = doc.createElement('button');
  fitPage.type = 'button';
  fitPage.className = 'icon-btn';
  fitPage.innerHTML = ICONS.fitPage;
  fitPage.title = '适应页高 (f)';
  fitPage.setAttribute('aria-label', '适应页高');

  const fitWidth = doc.createElement('button');
  fitWidth.type = 'button';
  fitWidth.className = 'icon-btn';
  fitWidth.innerHTML = ICONS.fitWidth;
  fitWidth.title = '适应页宽 (w)';
  fitWidth.setAttribute('aria-label', '适应页宽');

  const sep = doc.createElement('span');
  sep.className = 'zoom-sep';

  const menu = doc.createElement('select');
  menu.className = 'zoom-presets';
  menu.setAttribute('aria-label', '缩放预设');
  for (const p of zoomPresets()) {
    const o = doc.createElement('option');
    o.value = String(p);
    o.textContent = Math.round(p * 100) + '%';
    menu.appendChild(o);
  }

  box.append(minus, input, plus, sep, fitPage, fitWidth, menu);
  container.appendChild(box);

  const sync = () => {
    input.value = Math.round(z.scale * 100) + '%';
    const want = String(Number(z.scale.toFixed(4)));
    const has = Array.prototype.some.call(menu.options, (o) => o.value === want);
    if (has) menu.value = want;
  };
  sync();

  minus.addEventListener('click', () => setScale(z, z.scale / 1.2));
  plus.addEventListener('click', () => setScale(z, z.scale * 1.2));
  fitPage.addEventListener('click', () => opts.onFitPage && opts.onFitPage());
  fitWidth.addEventListener('click', () => opts.onFitWidth && opts.onFitWidth());
  input.addEventListener('change', () => {
    const n = parseFloat(String(input.value).replace('%', ''));
    if (Number.isFinite(n) && n > 0) setScale(z, n / 100);
    else sync();
  });
  menu.addEventListener('change', () => setScale(z, Number(menu.value)));

  if (typeof z.listeners !== 'undefined') z.listeners.add(sync);

  return { box, sync };
}

// ---- src/pdf/bitmap.js ----
// 按 devicePixelRatio 渲染页位图并缓存
// 状态：已实现。渲染需要 DOM canvas；缓存键是纯函数，可单测。



// 缓存键必须含文档身份，否则换文件后读到上一份的像素。
function cacheKey(docId, pageNo, scale, dpr) {
  return docId + ':' + pageNo + ':' + Number(scale).toFixed(4) + ':' + Number(dpr).toFixed(3);
}

async function renderPage(page, opts = {}) {
  if (typeof document === 'undefined') {
    throw figcutError('no-dom', '离开浏览器没法渲染页位图');
  }
  const scale = opts.scale === undefined ? 1 : opts.scale;
  const dpr = opts.dpr === undefined ? 1 : opts.dpr;
  const viewport = page.getViewport({ scale });

  const canvas = opts.canvas || document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(viewport.width * dpr));
  canvas.height = Math.max(1, Math.round(viewport.height * dpr));

  const ctx = canvas.getContext('2d', { alpha: false });
  ctx.save();
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const transform = dpr === 1 ? null : [dpr, 0, 0, dpr, 0, 0];
  await page.render({ canvasContext: ctx, viewport, transform }).promise;
  ctx.restore();

  return canvas;
}

function clearCache(cache) {
  if (cache && typeof cache.clear === 'function') cache.clear();
  return cache;
}

// ---- src/view/page-stack.js ----
// 连续/分页滚动 + 单页/双页排版
// 状态：已实现（依赖浏览器 canvas）。当前页只有一页可编辑，其余页只显示。





function createPageStack(opts) {
  const container = opts.container;
  const zoom = opts.zoom;
  if (!container || !container.ownerDocument) throw figcutError('no-dom', '页栈需要 DOM 容器');

  const doc = container.ownerDocument;
  const root = doc.createElement('div');
  root.className = 'pages';
  container.appendChild(root);

  const pages = [];
  let pdfDoc = null;
  let current = 1;
  let token = 0;
  let busy = Promise.resolve();

  // 视图状态：单/双页、奇偶、连续/分页
  const view = { dual: false, oddLeft: false, continuous: true };

  async function applyZoom() {
    if (!pdfDoc) return;
    const my = ++token;
    const scale = zoom.scale;
    const dpr = Math.min(2, (typeof window !== 'undefined' && window.devicePixelRatio) || 1);

    for (const p of pages) {
      if (my !== token) return;
      const vp = p.page.getViewport({ scale });
      p.canvas.style.width = Math.round(vp.width) + 'px';
      p.canvas.style.height = Math.round(vp.height) + 'px';
      p.overlay.style.width = Math.round(vp.width) + 'px';
      p.overlay.style.height = Math.round(vp.height) + 'px';
      await renderPage(p.page, { scale, dpr, canvas: p.canvas });
    }
  }

  function rowIndexOf(no) {
    const rows = pageCombos(pages.length, view);
    for (let i = 0; i < rows.length; i += 1) if (rows[i].includes(no)) return i;
    return 0;
  }

  function buildRows() {
    const rows = pageCombos(pages.length, view);
    root.textContent = '';
    rows.forEach((row, i) => {
      const rowEl = doc.createElement('div');
      rowEl.className = 'page-row';
      rowEl.dataset.row = String(i);
      // 书式：第 1 页单独在右；末页落单时在左
      if (view.dual && row.length === 1) {
        rowEl.dataset.single = row[0] === 1 ? 'right' : 'left';
      }
      for (const no of row) {
        const p = pages[no - 1];
        if (p) rowEl.appendChild(p.wrap);
      }
      root.appendChild(rowEl);
    });
    syncVisibility();
  }

  function syncVisibility() {
    const cur = rowIndexOf(current);
    for (const rowEl of root.children) {
      const isCur = Number(rowEl.dataset.row) === cur;
      rowEl.classList.toggle('is-current', isCur);
      rowEl.style.display = view.continuous || isCur ? '' : 'none';
    }
  }

  async function mount(newDoc) {
    pdfDoc = newDoc;
    root.textContent = '';
    pages.length = 0;
    token += 1;

    for (let no = 1; no <= newDoc.pages; no += 1) {
      const wrap = doc.createElement('div');
      wrap.className = 'page';
      wrap.dataset.page = String(no);

      const canvas = doc.createElement('canvas');
      const overlay = doc.createElement('div');
      overlay.className = 'page-overlay';

      wrap.append(canvas, overlay);
      pages.push({ no, wrap, canvas, overlay, page: null });
    }

    for (const p of pages) {
      p.page = await newDoc.pdf.getPage(p.no);
    }

    buildRows();
    busy = applyZoom();
    await busy;
    setCurrent(current);
    return pages.length;
  }

  function setCurrent(no) {
    current = no;
    for (const p of pages) p.wrap.classList.toggle('is-current', p.no === no);
    syncVisibility();
    const target = pages.find((p) => p.no === no);
    if (target && target.wrap.scrollIntoView) target.wrap.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    return current;
  }

  function applyLayout(next) {
    if (next.dual !== undefined) view.dual = !!next.dual;
    if (next.oddLeft !== undefined) view.oddLeft = !!next.oddLeft;
    if (next.continuous !== undefined) view.continuous = !!next.continuous;
    if (view.dual && view.oddLeft === undefined) view.oddLeft = false;
    buildRows();
    return { ...view };
  }

  function visibleRects() {
    return pages.map((p) => {
      const r = p.wrap.getBoundingClientRect();
      return { no: p.no, top: r.top, height: r.height };
    });
  }

  return {
    root,
    pages,
    view,
    mount,
    setCurrent,
    applyLayout,
    visibleRects,
    applyZoom: () => {
      busy = busy.then(applyZoom);
      return busy;
    },
    get current() {
      return current;
    },
  };
}

function setCurrent(stack, no) {
  return stack.setCurrent(no);
}

function visibleRects(stack) {
  return stack.visibleRects();
}

// ---- src/core/geometry.js ----
// 矩形与多边形的纯几何运算
// 状态：已实现。不碰 DOM、不碰 PDF，输入输出都是普通对象与数组。



const MIN_REGION_PT = 2;

function normRect(x0, y0, x1, y1) {
  const x = Math.min(x0, x1);
  const y = Math.min(y0, y1);
  return { x, y, w: Math.abs(x1 - x0), h: Math.abs(y1 - y0) };
}

// 反着拖出的框也归一化；任一边小于 minSize 视为误触，返回 null。
function rectFromPoints(x0, y0, x1, y1, minSize = MIN_REGION_PT) {
  const r = normRect(x0, y0, x1, y1);
  if (!(r.w >= minSize) || !(r.h >= minSize)) return null;
  if (!Number.isFinite(r.w) || !Number.isFinite(r.h)) return null;
  return r;
}

// 整块塞进页内：先夹尺寸，再夹位置，形状不变。
function clampRect(rect, pageW, pageH) {
  const w = clamp(Math.min(rect.w, pageW), 0, pageW);
  const h = clamp(Math.min(rect.h, pageH), 0, pageH);
  const x = clamp(rect.x, 0, pageW - w);
  const y = clamp(rect.y, 0, pageH - h);
  return { x, y, w, h };
}

function expandRect(rect, dx, dy) {
  return { x: rect.x - dx, y: rect.y - dy, w: rect.w + dx * 2, h: rect.h + dy * 2 };
}

function polyBounds(points) {
  let minX = Infinity;
  let minY = Infinity;
  let maxX = -Infinity;
  let maxY = -Infinity;
  for (const p of points) {
    if (p.x < minX) minX = p.x;
    if (p.y < minY) minY = p.y;
    if (p.x > maxX) maxX = p.x;
    if (p.y > maxY) maxY = p.y;
  }
  return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
}

// 整体平移：按外接框夹边，形状一点不变。
function movePoly(points, dx, dy, pageW, pageH) {
  const b = polyBounds(points);
  let mx = dx;
  let my = dy;
  if (b.x + mx < 0) mx = -b.x;
  if (b.x + b.w + mx > pageW) mx = pageW - (b.x + b.w);
  if (b.y + my < 0) my = -b.y;
  if (b.y + b.h + my > pageH) my = pageH - (b.y + b.h);
  if (mx !== dx || my !== dy) {
    const nb = { x: b.x + mx, y: b.y + my, w: b.w, h: b.h };
    if (nb.x < 0 || nb.y < 0 || nb.x + nb.w > pageW || nb.y + nb.h > pageH) {
      return points.map((p) => ({ x: p.x, y: p.y }));
    }
  }
  return points.map((p) => ({ x: p.x + mx, y: p.y + my }));
}

function hitTestRect(rect, x, y, tol = 0) {
  return (
    x >= rect.x - tol &&
    x <= rect.x + rect.w + tol &&
    y >= rect.y - tol &&
    y <= rect.y + rect.h + tol
  );
}

function distanceToSegment(px, py, ax, ay, bx, by) {
  const vx = bx - ax;
  const vy = by - ay;
  const len2 = vx * vx + vy * vy;
  const t = len2 === 0 ? 0 : clamp(((px - ax) * vx + (py - ay) * vy) / len2, 0, 1);
  const cx = ax + t * vx;
  const cy = ay + t * vy;
  return Math.hypot(px - cx, py - cy);
}

function hitTestPoly(points, x, y, tol = 0) {
  let inside = false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
    const a = points[i];
    const b = points[j];
    if (a.y > y !== b.y > y && x < ((b.x - a.x) * (y - a.y)) / (b.y - a.y) + a.x) {
      inside = !inside;
    }
  }
  if (inside) return true;
  if (tol <= 0) return false;
  for (let i = 0, j = points.length - 1; i < points.length; j = i, i += 1) {
    const a = points[j];
    const b = points[i];
    if (distanceToSegment(x, y, a.x, a.y, b.x, b.y) <= tol) return true;
  }
  return false;
}

const CORNERS = [
  ['nw', 0, 0],
  ['ne', 1, 0],
  ['sw', 0, 1],
  ['se', 1, 1],
];

function cornerAt(rect, x, y, tol = 8) {
  for (const [name, fx, fy] of CORNERS) {
    const cx = rect.x + rect.w * fx;
    const cy = rect.y + rect.h * fy;
    if (Math.abs(x - cx) <= tol && Math.abs(y - cy) <= tol) return name;
  }
  return null;
}

// ---- src/view/editor.js ----
// 框的增删改与工具模式
// 状态：已实现（纯逻辑：坐标一律 pt，不碰 DOM，可在 node 单测）。
// 已拍板：蓝框停在手画位置，不做任何吸附；白界只由导出框负责。



const TOOLS = ['select', 'rect', 'poly'];

function createEditor(opts = {}) {
  return {
    tool: opts.tool || 'rect',
    page: opts.page || 1,
    pageW: opts.pageW || 595,
    pageH: opts.pageH || 842,
    regions: [],
    selectedId: null,
    draft: null,
    drag: null,
    nextId: 1,
  };
}

function setTool(ed, tool) {
  if (!TOOLS.includes(tool)) throw new Error('未知工具: ' + tool);
  ed.tool = tool;
  ed.draft = null;
  ed.drag = null;
  return tool;
}

function setPage(ed, page) {
  ed.page = page;
  ed.selectedId = null;
  ed.draft = null;
  ed.drag = null;
}

function boundsOf(region) {
  return region.shape === 'poly' ? polyBounds(region.points) : region.rect;
}

function regionAt(ed, pt) {
  for (let i = ed.regions.length - 1; i >= 0; i -= 1) {
    const r = ed.regions[i];
    if (r.page !== ed.page) continue;
    const hit = r.shape === 'poly' ? hitTestPoly(r.points, pt.x, pt.y, 2) : hitTestRect(r.rect, pt.x, pt.y, 2);
    if (hit) return r;
  }
  return null;
}

function selected(ed) {
  return ed.regions.find((r) => r.id === ed.selectedId) || null;
}

function addRegion(ed, region) {
  const r = { id: ed.nextId++, kind: 'stem', opt: null, q: '', note: '', page: ed.page, ...region };
  ed.regions.push(r);
  ed.selectedId = r.id;
  return r;
}

function deleteSelection(ed) {
  if (ed.selectedId === null) return null;
  const idx = ed.regions.findIndex((r) => r.id === ed.selectedId);
  if (idx < 0) return null;
  const [gone] = ed.regions.splice(idx, 1);
  ed.selectedId = null;
  return gone;
}

// 方向键微移：Shift 1pt / Alt 10pt 由调用方换算好再传进来。
function nudge(ed, dx, dy) {
  const r = selected(ed);
  if (!r) return null;
  if (r.shape === 'poly') {
    r.points = movePoly(r.points, dx, dy, ed.pageW, ed.pageH);
  } else {
    r.rect = clampRect({ x: r.rect.x + dx, y: r.rect.y + dy, w: r.rect.w, h: r.rect.h }, ed.pageW, ed.pageH);
  }
  return r;
}

function pointerDown(ed, pt) {
  if (ed.tool === 'rect') {
    ed.draft = { shape: 'rect', x0: pt.x, y0: pt.y, x1: pt.x, y1: pt.y };
    return { draft: true };
  }

  if (ed.tool === 'poly') {
    if (!ed.draft || ed.draft.shape !== 'poly') ed.draft = { shape: 'poly', points: [{ x: pt.x, y: pt.y }] };
    else ed.draft.points.push({ x: pt.x, y: pt.y });
    return { draft: true, points: ed.draft.points.length };
  }

  const hit = regionAt(ed, pt);
  ed.selectedId = hit ? hit.id : null;
  if (!hit) return { selection: null };

  const box = boundsOf(hit);
  const corner = hit.shape === 'rect' ? cornerAt(box, pt.x, pt.y, 8) : null;
  ed.drag = {
    mode: corner ? 'resize' : 'move',
    corner,
    start: { x: pt.x, y: pt.y },
    origin: hit.shape === 'poly' ? hit.points.map((p) => ({ ...p })) : { ...hit.rect },
    target: hit,
  };
  return { selection: hit.id, mode: ed.drag.mode };
}

function pointerMove(ed, pt) {
  if (ed.draft && ed.draft.shape === 'rect') {
    ed.draft.x1 = pt.x;
    ed.draft.y1 = pt.y;
    return { draft: true };
  }

  if (!ed.drag) return null;
  const t = ed.drag.target;
  const dx = pt.x - ed.drag.start.x;
  const dy = pt.y - ed.drag.start.y;

  if (ed.drag.mode === 'move') {
    if (t.shape === 'poly') {
      const moved = movePoly(ed.drag.origin, dx, dy, ed.pageW, ed.pageH);
      t.points = moved;
    } else {
      t.rect = clampRect({ x: ed.drag.origin.x + dx, y: ed.drag.origin.y + dy, w: ed.drag.origin.w, h: ed.drag.origin.h }, ed.pageW, ed.pageH);
    }
    return { moved: true };
  }

  const o = ed.drag.origin;
  let left = o.x;
  let top = o.y;
  let right = o.x + o.w;
  let bottom = o.y + o.h;
  const corner = ed.drag.corner;
  if (corner.includes('w')) left = Math.min(pt.x, right - 2);
  if (corner.includes('e')) right = Math.max(pt.x, left + 2);
  if (corner.includes('n')) top = Math.min(pt.y, bottom - 2);
  if (corner.includes('s')) bottom = Math.max(pt.y, top + 2);
  t.rect = clampRect({ x: left, y: top, w: right - left, h: bottom - top }, ed.pageW, ed.pageH);
  return { resized: true };
}

function pointerUp(ed, pt) {
  if (ed.draft && ed.draft.shape === 'rect') {
    const r = rectFromPoints(ed.draft.x0, ed.draft.y0, ed.draft.x1, ed.draft.y1);
    ed.draft = null;
    if (!r) return null;
    return addRegion(ed, { shape: 'rect', rect: clampRect(r, ed.pageW, ed.pageH) });
  }

  if (ed.draft && ed.draft.shape === 'poly') {
    // 只有"点回首点"才闭合；否则继续加点（Enter 走 closePoly）
    const first = ed.draft.points[0];
    const nearFirst = Math.hypot(pt.x - first.x, pt.y - first.y) <= 8;
    if (nearFirst && ed.draft.points.length >= 4) {
      ed.draft.points.pop();
      return closePoly(ed);
    }
    return null;
  }

  if (ed.drag) {
    ed.drag = null;
    return { committed: true };
  }
  return null;
}

function closePoly(ed) {
  if (!ed.draft || ed.draft.shape !== 'poly') return null;
  if (ed.draft.points.length < 3) {
    ed.draft = null;
    return null;
  }
  const points = ed.draft.points.map((p) => ({ x: p.x, y: p.y }));
  ed.draft = null;
  return addRegion(ed, { shape: 'poly', points });
}

// ---- src/view/overlay.js ----
// 每页选框覆盖层：SVG 画框，editor 负责逻辑，这里只画。
// 状态：已实现。



const NS = 'http://www.w3.org/2000/svg';

function createOverlay(pageEl, size) {
  const doc = pageEl.ownerDocument;
  const host = pageEl.querySelector('.page-overlay');
  const svg = doc.createElementNS(NS, 'svg');
  svg.setAttribute('class', 'regions');
  svg.setAttribute('viewBox', '0 0 ' + size.w + ' ' + size.h);
  svg.setAttribute('preserveAspectRatio', 'none');
  host.appendChild(svg);
  return { svg, size };
}

function put(parent, node) {
  parent.appendChild(node);
  return node;
}

// 手柄按屏幕像素算大小：pt 尺寸 = 像素 / 当前倍率，缩放到多大都一个手感。
function addHandle(doc, parent, x, y, size, cls) {
  const h = doc.createElementNS(NS, 'rect');
  h.setAttribute('x', x - size / 2);
  h.setAttribute('y', y - size / 2);
  h.setAttribute('width', size);
  h.setAttribute('height', size);
  h.setAttribute('class', 'handle ' + cls);
  parent.appendChild(h);
  return h;
}

function addHandles(doc, parent, sel, scale) {
  const size = 8 / Math.max(0.05, scale);
  if (sel.shape === 'poly') {
    for (const p of sel.points) addHandle(doc, parent, p.x, p.y, size * 0.8, 'is-poly');
    return;
  }
  const r = sel.rect;
  addHandle(doc, parent, r.x, r.y, size, 'is-nw');
  addHandle(doc, parent, r.x + r.w, r.y, size, 'is-ne');
  addHandle(doc, parent, r.x, r.y + r.h, size, 'is-sw');
  addHandle(doc, parent, r.x + r.w, r.y + r.h, size, 'is-se');
}

function drawRegions(overlay, regions, opts = {}) {
  const doc = overlay.svg.ownerDocument;
  while (overlay.svg.firstChild) overlay.svg.removeChild(overlay.svg.firstChild);

  for (const r of regions) {
    const cls = 'region' + (r.id === opts.selectedId ? ' is-selected' : '');
    if (r.shape === 'poly') {
      const poly = doc.createElementNS(NS, 'polygon');
      poly.setAttribute('points', r.points.map((p) => p.x + ',' + p.y).join(' '));
      poly.setAttribute('class', cls);
      put(overlay.svg, poly);
    } else {
      const rect = doc.createElementNS(NS, 'rect');
      rect.setAttribute('x', r.rect.x);
      rect.setAttribute('y', r.rect.y);
      rect.setAttribute('width', r.rect.w);
      rect.setAttribute('height', r.rect.h);
      rect.setAttribute('class', cls);
      put(overlay.svg, rect);
    }
  }

  // 选中态画手柄，能拖哪儿一眼看得出
  if (opts.selected) addHandles(doc, overlay.svg, opts.selected, opts.scale || 1);

  const draft = opts.draft;
  if (draft && draft.shape === 'rect') {
    const x = Math.min(draft.x0, draft.x1);
    const y = Math.min(draft.y0, draft.y1);
    const rect = doc.createElementNS(NS, 'rect');
    rect.setAttribute('x', x);
    rect.setAttribute('y', y);
    rect.setAttribute('width', Math.abs(draft.x1 - draft.x0));
    rect.setAttribute('height', Math.abs(draft.y1 - draft.y0));
    rect.setAttribute('class', 'region is-draft');
    put(overlay.svg, rect);
  } else if (draft && draft.shape === 'poly' && draft.points.length > 1) {
    const line = doc.createElementNS(NS, 'polyline');
    line.setAttribute('points', draft.points.map((p) => p.x + ',' + p.y).join(' '));
    line.setAttribute('class', 'region is-draft');
    put(overlay.svg, line);
  }
}

// 命中测试交给 editor；这里只把当前页的框挑出来画。
function regionsOfPage(regions, page) {
  return regions.filter((r) => r.page === page);
}

function hitTest(ed, pt, regionAtFn) {
  return regionAtFn(ed, pt);
}

// ---- src/ui/preview.js ----
// 右栏常驻预览：整页 + 所有框；选中时画导出裁切
// 状态：已实现（canvas 2D）。

function createPreview(host) {
  const doc = host.ownerDocument;
  const canvas = doc.createElement('canvas');
  canvas.className = 'preview-canvas';
  host.textContent = '';
  host.appendChild(canvas);
  return { canvas, host };
}

function renderPreview(preview, opts) {
  const canvas = preview.canvas;
  const ctx = canvas.getContext('2d');
  const { source, regions, selectedId, pageW, pageH, crop } = opts;

  if (crop) {
    const w = Math.min(240, Math.max(80, Math.round(crop.w * 2)));
    const h = Math.max(1, Math.round((crop.h / crop.w) * w));
    canvas.width = w;
    canvas.height = h;
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    if (source) {
      const sx = (crop.x / pageW) * source.width;
      const sy = (crop.y / pageH) * source.height;
      const sw = (crop.w / pageW) * source.width;
      const sh = (crop.h / pageH) * source.height;
      ctx.drawImage(source, sx, sy, sw, sh, 0, 0, w, h);
    }
    return { mode: 'crop', w, h };
  }

  const w = Math.min(240, Math.max(120, Math.round(pageW / 3)));
  const h = Math.max(1, Math.round((pageH / pageW) * w));
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = w + 'px';
  canvas.style.height = h + 'px';

  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, w, h);
  if (source) ctx.drawImage(source, 0, 0, w, h);

  const sx = w / pageW;
  const sy = h / pageH;
  ctx.lineWidth = 1;
  for (const r of regions) {
    ctx.strokeStyle = r.id === selectedId ? '#ff8c00' : '#1c6ef2';
    if (r.shape === 'poly') {
      ctx.beginPath();
      r.points.forEach((p, i) => {
        const x = p.x * sx;
        const y = p.y * sy;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.stroke();
    } else {
      ctx.strokeRect(r.rect.x * sx, r.rect.y * sy, r.rect.w * sx, r.rect.h * sy);
    }
  }
  return { mode: 'page', w, h };
}

function drawCrop(preview, opts) {
  return renderPreview(preview, opts);
}

// ---- src/ui/inspector.js ----
// 选中区域的就地控件：类型（题干/A-D）、题号、备注
// 状态：已实现。setter 是纯函数，DOM 只负责把它们接上。

const KINDS = ['stem', 'A', 'B', 'C', 'D'];

function setKind(region, kind) {
  if (kind === 'stem') {
    region.kind = 'stem';
    region.opt = null;
  } else if (KINDS.includes(kind)) {
    region.kind = 'opt';
    region.opt = kind;
  }
  return region;
}

function setQuestion(region, q) {
  region.q = String(q === undefined || q === null ? '' : q).trim();
  return region;
}

function setNote(region, note) {
  region.note = String(note || '');
  return region;
}

function kindValue(region) {
  return region.kind === 'opt' ? region.opt || 'A' : 'stem';
}

function buildControls(doc, region, onChange) {
  const row = doc.createElement('div');
  row.className = 'inspector';

  const kind = doc.createElement('select');
  kind.className = 'region-kind';
  kind.title = '类型';
  for (const k of KINDS) {
    const o = doc.createElement('option');
    o.value = k;
    o.textContent = k === 'stem' ? '题干' : k;
    kind.appendChild(o);
  }
  kind.value = kindValue(region);

  const q = doc.createElement('input');
  q.className = 'region-q';
  q.type = 'text';
  q.placeholder = '题号';
  q.value = region.q || '';
  q.title = '题号';

  const note = doc.createElement('input');
  note.className = 'region-note';
  note.type = 'text';
  note.placeholder = '备注';
  note.value = region.note || '';
  note.title = '备注';

  kind.addEventListener('change', () => {
    setKind(region, kind.value);
    onChange(region);
  });
  q.addEventListener('input', () => {
    setQuestion(region, q.value);
    onChange(region, { quiet: true });
  });
  note.addEventListener('input', () => {
    setNote(region, note.value);
    onChange(region, { quiet: true });
  });

  row.append(kind, q, note);
  return row;
}

// 给一个容器就地渲染控件（骨架里声明的名字）
function renderInspector(container, region, onChange) {
  const row = buildControls(container.ownerDocument, region, onChange);
  container.textContent = '';
  container.appendChild(row);
  return row;
}

// ---- src/ui/region-list.js ----
// 右栏区域列表：本页可编辑，其他页只读分组
// 状态：已实现。




// 按页分组给列表用；真正的分组逻辑在 io/config（存盘也要用同一份）
function groupRowsByPage(regions) {
  const map = new Map();
  for (const r of regions) {
    if (!map.has(r.page)) map.set(r.page, []);
    map.get(r.page).push(r);
  }
  return [...map.entries()].sort((a, b) => a[0] - b[0]);
}

function labelOf(region) {
  const kind = region.kind === 'opt' ? '选项 ' + (region.opt || 'A') : '题干';
  const q = region.q ? ' · 第 ' + region.q + ' 题' : '';
  return kind + q;
}

function renderRegions(host, opts) {
  const doc = host.ownerDocument;
  const { regions, page, selectedId, onSelect, onChange, onDelete } = opts;
  host.textContent = '';

  const groups = groupRowsByPage(regions);
  if (groups.length === 0) {
    const empty = doc.createElement('div');
    empty.className = 'region-empty';
    empty.textContent = '还没有框。用左上角的矩形/多边形圈一张图。';
    host.appendChild(empty);
    return 0;
  }

  let rows = 0;
  for (const [pageNo, list] of groups) {
    const head = doc.createElement('div');
    head.className = 'region-group' + (pageNo === page ? ' is-current' : '');
    head.textContent = '第 ' + pageNo + ' 页 · ' + list.length + ' 个';
    host.appendChild(head);

    for (const r of list) {
      const row = doc.createElement('div');
      row.className = 'region-row' + (r.id === selectedId ? ' is-selected' : '');
      row.dataset.id = String(r.id);
      row.addEventListener('click', (ev) => {
        if (ev.target && ev.target.tagName === 'SELECT') return;
        onSelect(r);
      });

      if (pageNo === page) {
        row.appendChild(buildControls(doc, r, (region, meta) => onChange(region, meta)));
      } else {
        const label = doc.createElement('div');
        label.className = 'region-label';
        label.textContent = labelOf(r);
        row.appendChild(label);
      }

      const del = doc.createElement('button');
      del.type = 'button';
      del.className = 'region-del';
      del.innerHTML = ICONS.trash;
      del.title = '删除';
      del.addEventListener('click', (ev) => {
        ev.stopPropagation();
        onDelete(r);
      });
      row.appendChild(del);

      host.appendChild(row);
      rows += 1;
    }
  }
  return rows;
}

// ---- src/ui/page-list.js ----
// 左栏页面列表：缩略图 + 页码 + 标注数，当前页高亮
// 状态：已实现。

function countByPage(regions) {
  const counts = {};
  for (const r of regions) counts[r.page] = (counts[r.page] || 0) + 1;
  return counts;
}

function renderPageList(host, opts) {
  const doc = host.ownerDocument;
  const { pages, current, regions, onPick, thumbFor } = opts;
  const counts = countByPage(regions || []);
  const head = host.querySelector('.side-head');
  host.textContent = '';

  const list = doc.createElement('div');
  list.className = 'page-list';

  for (const p of pages) {
    const row = doc.createElement('button');

    row.className = 'page-item' + (p.no === current ? ' is-current' : '');
    row.dataset.page = String(p.no);
    row.title = '第 ' + p.no + ' 页';

    const thumb = thumbFor ? thumbFor(p.no) : null;

      thumb.className = 'page-thumb';

    }

    const num = doc.createElement('span');

function markCurrent(host, no) {

}

// ---- src/core/history.js ----
// 撤销重做栈与微移合并
// 状态：已实现。存的是"整份快照"，合并窗口内同 key 的动作只留一条。

const COALESCE_MS = 600;

function createHistory(initial, opts = {}) {
  return {
    present: initial === undefined ? null : initial,
    past: [],
    future: [],
    limit: opts.limit === undefined ? 200 : opts.limit,
    windowMs: opts.windowMs === undefined ? COALESCE_MS : opts.windowMs,
    now: opts.now || (() => Date.now()),
    lastKey: null,
    lastTime: 0,
  };
}

function current(h) {
  return h.present;
}

// key 相同且落在合并窗口内 → 只更新 present，不再压一条历史。
function commit(h, next, opts = {}) {
  const key = opts.key === undefined ? null : opts.key;
  const t = h.now();
  const merge = key !== null && key === h.lastKey && t - h.lastTime <= h.windowMs && h.past.length > 0;

  if (!merge) {
    h.past.push(h.present);
    if (h.past.length > h.limit) h.past.shift();
  }
  h.present = next;
  h.lastKey = key;
  h.lastTime = t;
  h.future.length = 0;
  return next;
}

function undo(h) {
  if (h.past.length === 0) return null;
  h.future.push(h.present);
  h.present = h.past.pop();
  h.lastKey = null;
  return h.present;
}

function redo(h) {
  if (h.future.length === 0) return null;
  h.past.push(h.present);
  h.present = h.future.pop();
  h.lastKey = null;
  return h.present;
}

function canUndo(h) {
  return h.past.length > 0;
}

function canRedo(h) {
  return h.future.length > 0;
}

// ---- src/pdf/document.js ----
// 打开 PDF、页数、页尺寸
// 状态：已实现。pdf.js 由 index.html 以 classic script 外部引入，本模块只包一层。



async function openDocument(source, opts = {}) {
  const lib = opts.lib || (typeof pdfjsLib !== 'undefined' ? pdfjsLib : null);
  if (!lib) throw figcutError('no-pdfjs', 'pdf.js 没加载（vendor/pdfjs/pdf.min.js）');

  if (opts.workerSrc) lib.GlobalWorkerOptions.workerSrc = opts.workerSrc;

  const task = lib.getDocument(source);
  const pdf = await task.promise;
  return {
    pdf,
    id: opts.id || 'doc-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 8),
    pages: pdf.numPages,
  };
}

function pageCount(doc) {
  return doc.pages;
}

async function pageSize(doc, pageNo) {
  const page = await doc.pdf.getPage(pageNo);
  const vp = page.getViewport({ scale: 1 });
  return { w: vp.width, h: vp.height, rotation: vp.rotation };
}

const WORKER_SRC = 'vendor/pdfjs/pdf.worker.min.js';

async function openFile(file, opts = {}) {
