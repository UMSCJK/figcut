  return openDocument(
    { data: new Uint8Array(buffer) },
    { workerSrc: opts.workerSrc || WORKER_SRC, id: file.name + '|' + file.size }
  );
}

// 拖放：只认第一个 PDF，一次只处理一个文件。
function acceptDrop(element, onFile) {
  const stop = (e) => {
    e.preventDefault();
    e.stopPropagation();
  };
  const over = (e) => {
    stop(e);
    element.classList.add('is-dragover');
  };
  const leave = (e) => {
    stop(e);
    element.classList.remove('is-dragover');
  };
  const drop = (e) => {
    stop(e);
    element.classList.remove('is-dragover');
    const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (file) onFile(file);
  };
  element.addEventListener('dragenter', over);
  element.addEventListener('dragover', over);
  element.addEventListener('dragleave', leave);
  element.addEventListener('drop', drop);
  return () => {
    element.removeEventListener('dragenter', over);
    element.removeEventListener('dragover', over);
    element.removeEventListener('dragleave', leave);
    element.removeEventListener('drop', drop);
  };
}

// 系统文件选择框
function pickFile() {
  return new Promise((resolve) => {
    if (typeof document === 'undefined') return resolve(null);
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = 'application/pdf,.pdf';
    input.style.display = 'none';
    document.body.appendChild(input);
    input.addEventListener('change', () => {
      const file = input.files && input.files[0];
      input.remove();
      resolve(file || null);
    });
    input.click();
  });
}

// ---- src/io/filehandles.js ----
// 记住最近打开的文件句柄（File System Access API + IndexedDB），
// 这样点「最近打开」能直接打开，而不是再弹一次选择框。
// 状态：已实现；不支持句柄的浏览器自动退回文件选择框。

const DB_NAME = 'figcut';
const STORE = 'handles';

function hasIdb() {
  return typeof indexedDB !== 'undefined';
}

function openDb() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      if (!db.objectStoreNames.contains('bytes')) db.createObjectStore('bytes');
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function handleKey(name, size) {
  return String(name) + '|' + Number(size);
}

const BYTES_STORE = 'bytes';
const MAX_CACHED_BYTES = 40 * 1024 * 1024;

// 把 PDF 原字节缓存下来：浏览器不给文件句柄时（比如 file:// 打开），
// 最近文件仍然能直接打开，不用再弹选择框。
async function cacheBytes(name, size, bytes) {
  if (!hasIdb() || !bytes || bytes.byteLength > MAX_CACHED_BYTES) return false;
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(BYTES_STORE, 'readwrite');
      tx.objectStore(BYTES_STORE).put(bytes, handleKey(name, size));
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return true;
  } catch (e) {
    return false;
  }
}

async function readCachedBytes(name, size) {
  if (!hasIdb()) return null;
  try {
    const db = await openDb();
    const bytes = await new Promise((resolve, reject) => {
      const tx = db.transaction(BYTES_STORE, 'readonly');
      const req = tx.objectStore(BYTES_STORE).get(handleKey(name, size));
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return bytes || null;
  } catch (e) {
    return null;
  }
}

async function saveHandle(name, size, handle) {
  if (!handle || !hasIdb()) return false;
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(handle, handleKey(name, size));
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return true;
  } catch (e) {
    return false;
  }
}

async function loadHandle(name, size) {
  if (!hasIdb()) return null;
  try {
    const db = await openDb();
    const handle = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(handleKey(name, size));
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return handle;
  } catch (e) {
    return null;
  }
}

// 直接打开最近文件：拿到句柄就读，权限被拒就返回 null 让调用方退回选择框
async function reopenRecent(entry) {
  const handle = await loadHandle(entry.name, entry.size);
  if (!handle) return null;
  try {
    const perm = handle.queryPermission ? await handle.queryPermission({ mode: 'read' }) : 'granted';
    if (perm !== 'granted') {
      const asked = handle.requestPermission ? await handle.requestPermission({ mode: 'read' }) : 'denied';
      if (asked !== 'granted') return null;
    }
    const file = await handle.getFile();
    if (!file) return null;
    return file;
  } catch (e) {
    return null;
  }
}

// 从最近列表踢掉时，把缓存字节和句柄一起删掉，别让 IndexedDB 无限长大
async function forgetFile(name, size) {
  if (!hasIdb()) return false;
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction([STORE, BYTES_STORE], 'readwrite');
      tx.objectStore(STORE).delete(handleKey(name, size));
      tx.objectStore(BYTES_STORE).delete(handleKey(name, size));
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return true;
  } catch (e) {
    return false;
  }
}

// 依次尝试：句柄 → 本地缓存字节；都没有才返回 null
async function openRecent(entry) {
  const viaHandle = await reopenRecent(entry);
  if (viaHandle) return viaHandle;
  const bytes = await readCachedBytes(entry.name, entry.size);
  if (bytes) {
    try {
      return new File([bytes], entry.name, { type: 'application/pdf' });
    } catch (e) {
      return null;
    }
  }
  return null;
}

function hasPickHandle() {
  return typeof window !== 'undefined' && typeof window.showOpenFilePicker === 'function';
}

const LAST_KEY = '@last';

async function saveLastHandle(handle) {
  if (!handle || !hasIdb()) return false;
  try {
    const db = await openDb();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put(handle, LAST_KEY);
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => reject(tx.error);
    });
    db.close();
    return true;
  } catch (e) {
    return false;
  }
}

async function loadLastHandle() {
  if (!hasIdb()) return null;
  try {
    const db = await openDb();
    const handle = await new Promise((resolve, reject) => {
      const tx = db.transaction(STORE, 'readonly');
      const req = tx.objectStore(STORE).get(LAST_KEY);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
    db.close();
    return handle;
  } catch (e) {
    return null;
  }
}

async function pickWithHandle() {
  if (!hasPickHandle()) return null;
  try {
    // 从上次打开的文件所在目录开始，别又跳回「文档」
    const startIn = await loadLastHandle();
    const options = {
      types: [{ description: 'PDF', accept: { 'application/pdf': ['.pdf'] } }],
      multiple: false,
    };
    if (startIn) options.startIn = startIn;
    const [handle] = await window.showOpenFilePicker(options);
    if (!handle) return null;
    await saveLastHandle(handle);
    const file = await handle.getFile();
    return { file, handle };
  } catch (e) {
    return null; // 用户取消
  }
}

// ---- src/core/checksum.js ----
// 校验和：ZIP 用 crc32，PNG 的 zlib 流用 adler32
// 状态：已实现。纯函数。

const CRC_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let i = 0; i < 256; i += 1) {
    let c = i;
    for (let k = 0; k < 8; k += 1) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    table[i] = c >>> 0;
  }
  return table;
})();

function crc32(bytes, crc = 0) {
  let c = (crc ^ 0xffffffff) >>> 0;
  for (let i = 0; i < bytes.length; i += 1) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

function adler32(bytes) {
  let a = 1;
  let b = 0;
  for (let i = 0; i < bytes.length; i += 1) {
    a = (a + bytes[i]) % 65521;
    b = (b + a) % 65521;
  }
  return ((b << 16) | a) >>> 0;
}

// ---- src/core/bytes.js ----
// 字节小工具：拼接、大小端整数
// 状态：已实现。PNG 用大端，ZIP 用小端，别搞混。

function concatBytes(parts) {
  let total = 0;
  for (const p of parts) total += p.length;
  const out = new Uint8Array(total);
  let at = 0;
  for (const p of parts) {
    out.set(p, at);
    at += p.length;
  }
  return out;
}

function be32(v) {
  return [(v >>> 24) & 0xff, (v >>> 16) & 0xff, (v >>> 8) & 0xff, v & 0xff];
}

function le16(v) {
  return [v & 0xff, (v >>> 8) & 0xff];
}

function le32(v) {
  return [v & 0xff, (v >>> 8) & 0xff, (v >>> 16) & 0xff, (v >>> 24) & 0xff];
}

// ---- src/io/png.js ----
// 最小 PNG 编码器：RGBA 像素 → RGB PNG（zlib 用 stored 块，不依赖 canvas / zlib）
// 状态：已实现。导出永远是白底，所以丢掉 alpha 通道。




const SIG = [0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a];

function chunk(type, data) {
  const typeBytes = new TextEncoder().encode(type);
  const body = new Uint8Array(typeBytes.length + data.length);
  body.set(typeBytes, 0);
  body.set(data, typeBytes.length);
  return [new Uint8Array(be32(data.length)), body, new Uint8Array(be32(crc32(body)))];
}

// zlib 容器 + 不压缩的 deflate 块
function zlibStored(raw) {
  const out = [new Uint8Array([0x78, 0x01])];
  let at = 0;
  while (at < raw.length) {
    const n = Math.min(65535, raw.length - at);
    const final = at + n >= raw.length ? 1 : 0;
    out.push(new Uint8Array([final, n & 0xff, (n >>> 8) & 0xff, ~n & 0xff, (~n >>> 8) & 0xff]));
    out.push(raw.subarray(at, at + n));
    at += n;
  }
  out.push(new Uint8Array(be32(adler32(raw))));
  return concatBytes(out);
}

// image: { width, height, data: RGBA }
function encodePng(image) {
  const { width, height, data } = image;
  const stride = width * 3;
  const raw = new Uint8Array((stride + 1) * height);
  for (let y = 0; y < height; y += 1) {
    const rowAt = y * (stride + 1);
    raw[rowAt] = 0; // filter: none
    for (let x = 0; x < width; x += 1) {
      const src = (y * width + x) * 4;
      const dst = rowAt + 1 + x * 3;
      raw[dst] = data[src];
      raw[dst + 1] = data[src + 1];
      raw[dst + 2] = data[src + 2];
    }
  }

  const ihdr = new Uint8Array([...be32(width), ...be32(height), 8, 2, 0, 0, 0]);
  return concatBytes([
    new Uint8Array(SIG),
    ...chunk('IHDR', ihdr),
    ...chunk('IDAT', zlibStored(raw)),
    ...chunk('IEND', new Uint8Array(0)),
  ]);
}

// ---- src/core/naming.js ----
// 导出文件名：p{页:02}-q{题号}-{角色}-{备注}.png
// 状态：已实现。暴力美学：文件名里带上页、题号、角色、备注，全部清洗成安全字符。



const OPT_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J', 'K'];

function pad(n, width = 2) {
  return String(Math.trunc(n)).padStart(width, '0');
}

// 非法字符与空白统一压成下划线，长备注截断
function sanitize(text, max = 24) {
  const s = String(text === undefined || text === null ? '' : text)
    .trim()
    .replace(/[\\/:*?"<>|\s]+/g, '_')
    .replace(/^_+|_+$/g, '');
  return s.slice(0, max);
}

function stemName() {
  return 'stem';
}

function optName(which) {
  const idx = typeof which === 'number' ? which : OPT_LETTERS.indexOf(String(which).toUpperCase());
  if (idx < 0 || idx >= OPT_LETTERS.length) {
    throw figcutError('bad-option', '选项只能是 A-K 或 0-10', { which });
  }
  return 'opt' + OPT_LETTERS[idx];
}

// 角色：stem / optA-optC / opt<自定义名>
function roleOf(region) {
  const list = Array.isArray(region.opts)
    ? region.opts
    : region.kind === 'opt' && region.opt
      ? [region.opt === 'custom' ? (region.optText || 'X') : region.opt]
      : [];
  if (list.length === 0) return 'stem';
  const names = list.map((item) => {
    const letter = String(item).toUpperCase();
    if (OPT_LETTERS.includes(letter) && String(item).length === 1) return 'opt' + letter;
    return 'opt' + (sanitize(item, 12) || 'X');
  });
  return names.join('-');
}

// p09-q28-stem.png / p09-q29-optB-note.png
function regionFileName(region) {
  const page = pad(region.page === undefined ? 1 : region.page);
  const q = sanitize(region.q, 8) || '00';
  const parts = ['p' + page, 'q' + q, roleOf(region)];
  const note = sanitize(region.note, 24);
  if (note) parts.push(note);
  return parts.join('-') + '.png';
}

function zipName(pdfName) {
  const base = String(pdfName || 'figures').replace(/\.[Pp][Dd][Ff]$/, '');
  return 'figures_' + base + '.zip';
}

function configKey(fileName, bytes) {
  return String(fileName) + '|' + Number(bytes);
}

// ---- src/io/export.js ----
// 导出 300dpi 白底 PNG
// 状态：已实现。像素搬运与编码都不依赖 canvas，浏览器里只要先拿到 ImageData。






// 导出尺寸 = (导出框 + 边距) × DPI，像素对齐不重采样。
function computePixels(box, opts = {}) {
  const dpi = opts.dpi === undefined ? 300 : opts.dpi;
  const margin = opts.margin === undefined ? 8 : opts.margin;
  return {
    w: Math.round(pxForDpi(box.w + margin * 2, dpi)),
    h: Math.round(pxForDpi(box.h + margin * 2, dpi)),
    dpi,
    margin,
  };
}

// 从整页像素里裁一块，四周补纯白。image: {width,height,data:RGBA}
function cropRgba(image, boxPx, marginPx = 0) {
  const w = Math.max(1, Math.round(boxPx.w + marginPx * 2));
  const h = Math.max(1, Math.round(boxPx.h + marginPx * 2));
  const out = new Uint8ClampedArray(w * h * 4);
  out.fill(255);

  const left = Math.round(boxPx.x - marginPx);
  const top = Math.round(boxPx.y - marginPx);

  for (let y = 0; y < h; y += 1) {
    const sy = top + y;
    if (sy < 0 || sy >= image.height) continue;
    for (let x = 0; x < w; x += 1) {
      const sx = left + x;
      if (sx < 0 || sx >= image.width) continue;
      const s = (sy * image.width + sx) * 4;
      const d = (y * w + x) * 4;
      out[d] = image.data[s];
      out[d + 1] = image.data[s + 1];
      out[d + 2] = image.data[s + 2];
      out[d + 3] = 255;
    }
  }
  return { width: w, height: h, data: out };
}

// 多边形在这个高度上的 x 跨度（pt），偶奇规则
function polySpansAt(poly, y) {
  const xs = [];
  const n = poly.length;
  for (let i = 0, j = n - 1; i < n; j = i, i += 1) {
    const a = poly[i];
    const b = poly[j];
    if (a.y > y === b.y > y) continue;
    xs.push(a.x + ((y - a.y) * (b.x - a.x)) / (b.y - a.y));
  }
  xs.sort((p1, p2) => p1 - p2);
  const out = [];
  for (let k = 0; k + 1 < xs.length; k += 2) out.push([xs[k], xs[k + 1]]);
  return out;
}

// 按导出像素矩形精确裁切；给了多边形就把多边形外涂白（v2 的 destination-in）。
function cropPxRgba(image, pxRect, opts = {}) {
  const [x0, y0, x1, y1] = pxRect;
  const w = Math.max(1, x1 - x0);
  const h = Math.max(1, y1 - y0);
  const out = new Uint8ClampedArray(w * h * 4);
  out.fill(255);
  for (let y = 0; y < h; y += 1) {
    const sy = y0 + y;
    if (sy < 0 || sy >= image.height) continue;
    for (let x = 0; x < w; x += 1) {
      const sx = x0 + x;
      if (sx < 0 || sx >= image.width) continue;
      const s = (sy * image.width + sx) * 4;
      const d = (y * w + x) * 4;
      out[d] = image.data[s];
      out[d + 1] = image.data[s + 1];
      out[d + 2] = image.data[s + 2];
      out[d + 3] = 255;
    }
  }
  // 多边形蒙版：多边形外的像素一律涂白
  const poly = opts.poly;
  const scale = opts.scale;
  if (poly && poly.length >= 3 && scale > 0) {
    for (let y = 0; y < h; y += 1) {
      const yc = (y0 + y + 0.5) / scale;
      const spans = polySpansAt(poly, yc);
      let cursor = 0;
      for (const [xa, xb] of spans) {
        const a = Math.max(0, Math.ceil(xa * scale) - x0);
        const b = Math.min(w, Math.floor(xb * scale) - x0);
        for (let x = cursor; x < a && x < w; x += 1) {
          const d = (y * w + x) * 4;
          out[d] = 255; out[d + 1] = 255; out[d + 2] = 255;
        }
        if (b > cursor) cursor = b;
      }
      for (let x = Math.max(cursor, 0); x < w; x += 1) {
        const d = (y * w + x) * 4;
        out[d] = 255; out[d + 1] = 255; out[d + 2] = 255;
      }
    }
  }

  return { width: w, height: h, data: out };
}

function renderPngPx(image, pxRect, opts = {}) {
  return encodePng(cropPxRgba(image, pxRect, opts));
}

// 不重采样：页面位图必须恰好是 dpi/72 px/pt 渲出来的，否则直接报错。
function renderPng(image, boxPt, opts = {}) {
  const dpi = opts.dpi === undefined ? 300 : opts.dpi;
  const margin = opts.margin === undefined ? 8 : opts.margin;
  const want = dpi / 72;
  const scale = opts.scale === undefined ? want : opts.scale;
  if (Math.abs(scale - want) > 1e-6) {
    throw figcutError('scale-mismatch', '导出必须按 dpi/72 渲染，不重采样', { scale, want, dpi });
  }
  return encodePng(
    cropRgba(image, { x: boxPt.x * scale, y: boxPt.y * scale, w: boxPt.w * scale, h: boxPt.h * scale }, margin * scale)
  );
}

// 一批区域 → [{name, bytes}]
function exportRegions(input) {
  const { image, regions } = input;
  const dpi = input.dpi === undefined ? 300 : input.dpi;
  const margin = input.margin === undefined ? 8 : input.margin;
  const scale = input.scale === undefined ? dpi / 72 : input.scale;
  return regions.map((r) => ({
    name: regionFileName(r),
    bytes: renderPng(image, r.box, { scale, dpi, margin }),
  }));
}

// ---- src/io/zip.js ----
// ZIP 打包与清单 JSON
// 状态：已实现。只用 store（不压缩），因此 node 里能跑、能真解开。




// 固定时间戳（1980-01-01 00:00），保证同样输入产出同样字节。
const DOS_TIME = 0;
const DOS_DATE = 0x0021;

function createZip() {
  return { entries: [] };
}

function addFile(zip, name, bytes) {
  const data = bytes instanceof Uint8Array ? bytes : new Uint8Array(bytes);
  zip.entries.push({ name: String(name), data, crc: crc32(data) });
  return zip;
}

function toBytes(zip) {
  const locals = [];
  const centrals = [];
  let offset = 0;

  for (const entry of zip.entries) {
    const name = new TextEncoder().encode(entry.name);
    const UTF8_FLAG = 0x0800; // 让解压工具按 UTF-8 解码文件名（中文备注不会乱码）
    const local = [
      ...le32(0x04034b50),
      ...le16(20),
      ...le16(UTF8_FLAG),
      ...le16(0),
      ...le16(DOS_TIME),
      ...le16(DOS_DATE),
      ...le32(entry.crc),
      ...le32(entry.data.length),
      ...le32(entry.data.length),
      ...le16(name.length),
      ...le16(0),
    ];
    locals.push(new Uint8Array(local), name, entry.data);

    const central = [
      ...le32(0x02014b50),
      ...le16(20),
      ...le16(20),
      ...le16(UTF8_FLAG),
      ...le16(0),
      ...le16(DOS_TIME),
      ...le16(DOS_DATE),
      ...le32(entry.crc),
      ...le32(entry.data.length),
      ...le32(entry.data.length),
      ...le16(name.length),
      ...le16(0),
      ...le16(0),
      ...le16(0),
      ...le16(0),
      ...le32(0),
      ...le32(offset),
    ];
    centrals.push(new Uint8Array(central), name);

    offset += local.length + name.length + entry.data.length;
  }

  const centralBytes = concatBytes(centrals);
  const end = new Uint8Array([
    ...le32(0x06054b50),
    ...le16(0),
    ...le16(0),
    ...le16(zip.entries.length),
    ...le16(zip.entries.length),
    ...le32(centralBytes.length),
    ...le32(offset),
    ...le16(0),
  ]);

  return concatBytes([...locals, centralBytes, end]);
}

function toBlob(zip) {
  const bytes = toBytes(zip);
  if (typeof Blob !== 'undefined') {
    return new Blob([bytes], { type: 'application/zip' });
  }
  return bytes;
}

// ---- src/app/export-zip.js ----
// 导出全链路：白界框 → 300dpi PNG → ZIP
// 状态：已实现（浏览器侧，需要 pdf.js 渲染）。











const MASK_PPP = 3;

// 按页分组、页内按竖直位置排序，给出 p{页}-{序号}-{类型}.png
function planExports(regions) {
  const sorted = [...regions].sort((a, b) => {
    if (a.page !== b.page) return a.page - b.page;
    return boundsOf(a).y - boundsOf(b).y;
  });

  const counters = new Map();
  return sorted.map((r) => {
    const n = (counters.get(r.page) || 0) + 1;
    counters.set(r.page, n);
    return {
      region: r,
      page: r.page,
      index: n,
      name: regionFileName(r),
      box: boundsOf(r),
    };
  });
}

async function imageOf(page, scale) {
  const canvas = await renderPage(page, { scale, dpr: 1 });
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
  return { width: img.width, height: img.height, data: img.data };
}

async function exportZip(input) {
  const { doc, regions } = input;
  const dpi = input.dpi === undefined ? 300 : input.dpi;
  const margin = input.margin === undefined ? 8 : input.margin;
  const onProgress = input.onProgress || (() => {});
  const scale = dpi / 72;

  const plan = planExports(regions);
  const pages = [...new Set(plan.map((p) => p.page))].sort((a, b) => a - b);
  const zip = createZip();
  const manifest = [];

  for (let i = 0; i < pages.length; i += 1) {
    const pageNo = pages[i];
    onProgress({ page: pageNo, done: i, total: pages.length });

    const page = await doc.pdf.getPage(pageNo);
    const maskImage = await imageOf(page, MASK_PPP);
    const mask = buildInkMask(maskImage, { pxPerPt: MASK_PPP });


    const hires = await imageOf(page, scale);
    const pageSize = page.getViewport({ scale: 1 });

    for (const item of plan.filter((p) => p.page === pageNo)) {
      // 优先用画完就算好的导出框（缩紧 + 只往白里长的 margin）
      let box = item.region.box;
      if (!box) {
        const ink = item.region.ink || computeExportBox(mask, item.box);
        if (!ink) continue;
        box = growWhite(mask, ink, margin, pageSize.width, pageSize.height);
      }
      const crop = cropRect(box, pageSize.width, pageSize.height, scale);
      const exportBox = { x: crop.x, y: crop.y, w: crop.w, h: crop.h };
      // 多边形选区按多边形做蒙版：选区外的像素涂白，才真正"避开"了框外的文字
      const poly = item.region.shape === 'poly' ? item.region.points : null;
      const bytes = renderPngPx(hires, crop.px, poly ? { poly, scale } : {});
      addFile(zip, item.name, bytes);
      manifest.push({
        name: item.name,
        page: item.page,
        index: item.index,
        kind: item.region.kind,
        opt: item.region.opt,
        q: item.region.q,
        box: {
          x: +exportBox.x.toFixed(2),
          y: +exportBox.y.toFixed(2),
          w: +exportBox.w.toFixed(2),
          h: +exportBox.h.toFixed(2),
        },
      });
    }
  }

  const key = doc.id || 'document.pdf|0';
  addFile(
    zip,
    'figure-regions.json',
    new TextEncoder().encode(
      JSON.stringify(
        {
          version: 4,
          app: 'figcut',
          files: {
            [key]: {
              source: input.source || '',
              export: { dpi, margin },
              updatedAt: Date.now(),
              regions: manifest,
            },
          },
        },
        null,
        2
      )
    )
  );

  onProgress({ page: null, done: pages.length, total: pages.length });
  return {
    bytes: toBytes(zip),
    name: zipName(input.source || 'figures'),
    files: manifest,
  };
}

// ---- src/io/config.js ----
// localStorage 配置 schema4 与迁移
// 状态：已实现。本模块不直接碰 localStorage，只吃一个 getItem/setItem 的容器，方便单测。




const STORAGE_KEY = 'figcut.regions';
const SCHEMA = 4;

function keyForFile(fileName, bytes) {
  return configKey(fileName, bytes);
}

function groupByPage(regions) {
  const pages = {};
  for (const r of regions) {
    const p = r.page || 1;
    if (!pages[p]) pages[p] = [];
    pages[p].push(r);
  }
  return pages;
}

// 从 pages 分组还原成扁平 regions，并补齐 id（重开时不能和内存里的 id 撞）
function flattenPages(pages) {
  const out = [];
  let maxId = 0;
  for (const page of Object.keys(pages || {})) {
    for (const r of pages[page] || []) {
      const id = Number(r.id) || 0;
      if (id > maxId) maxId = id;
      out.push({ ...r, page: Number(page) });
    }
  }
  return { regions: out, nextId: maxId + 1 };
}

// 把 1/2/3 版配置抬到 schema4：{version, app, files:{key:{pages}}}
function migrate(raw) {
  if (raw && raw.version === SCHEMA && raw.files && typeof raw.files === 'object') {
    return raw; // 已经是 schema4：原样返回，迁移必须幂等
  }

  const cfg = { version: SCHEMA, app: 'figcut', files: {} };
  if (!raw) return cfg;

  if (Array.isArray(raw)) {
    cfg.files._migrated = { source: '', export: null, updatedAt: 0, pages: groupByPage(raw) };
    return cfg;
  }

  if (Array.isArray(raw.regions)) {
    const key = raw.key || '_migrated';
    cfg.files[key] = {
      source: raw.source || '',
      export: raw.export || null,
      updatedAt: raw.updatedAt || 0,
      pages: groupByPage(raw.regions),
    };
    return cfg;
  }

  if (raw.files && typeof raw.files === 'object') {
    for (const [key, entry] of Object.entries(raw.files)) {
      cfg.files[key] = {
        source: (entry && entry.source) || '',
        export: (entry && entry.export) || null,
        updatedAt: (entry && entry.updatedAt) || 0,
        pages: (entry && entry.pages) || {},
      };
    }
  }
  return cfg;
}

function readAll(storage) {
  const raw = storage.getItem(STORAGE_KEY);
  if (!raw) return { version: SCHEMA, app: 'figcut', files: {} };
  try {
    return migrate(JSON.parse(raw));
  } catch (e) {
    throw figcutError('bad-config', '配置不是合法 JSON，已放弃读取', { raw });
  }
}

function loadConfig(storage, key) {
  const cfg = readAll(storage);
  return cfg.files[key] || null;
}

function saveConfig(storage, key, entry) {
  const cfg = readAll(storage);
  cfg.files[key] = {
    source: entry.source || '',
    export: entry.export || null,
    updatedAt: entry.updatedAt || Date.now(),
    pages: entry.pages || {},
  };
  storage.setItem(STORAGE_KEY, JSON.stringify(cfg));
  return cfg;
}

// ---- src/ui/theme.js ----
// 界面配色与 PDF 预览配色
// 状态：已实现。界面与 PDF 是两套独立的三态，互不影响。

const UI_MODES = ['system', 'light', 'dark'];
const PDF_MODES = ['auto', 'normal', 'invert'];

function createTheme(opts = {}) {
  return {
    ui: UI_MODES.includes(opts.ui) ? opts.ui : 'system',
    pdf: PDF_MODES.includes(opts.pdf) ? opts.pdf : 'auto',
  };
}

function nextOf(list, cur) {
  const i = list.indexOf(cur);
  return list[(i + 1) % list.length];
}

function cycleUi(theme) {
  theme.ui = nextOf(UI_MODES, theme.ui);
  return theme.ui;
}

function cyclePdfPreview(theme) {
  theme.pdf = nextOf(PDF_MODES, theme.pdf);
  return theme.pdf;
}

// 界面最终是浅还是深（跟随系统时看 prefersDark）
function resolvedUi(theme, prefersDark) {
  if (theme.ui === 'dark') return 'dark';
  if (theme.ui === 'light') return 'light';
  return prefersDark ? 'dark' : 'light';
}

// PDF 预览要不要反相：跟随界面 → 深色界面就反相；正常 → 永不；反相 → 永远
function isInverted(theme, prefersDark) {
  if (theme.pdf === 'invert') return true;
  if (theme.pdf === 'normal') return false;
  return resolvedUi(theme, prefersDark) === 'dark';
}

function applyTheme(theme, doc, prefersDark) {
  const root = doc.documentElement;
  root.dataset.ui = resolvedUi(theme, prefersDark);
  root.dataset.pdfInvert = isInverted(theme, prefersDark) ? '1' : '0';
  root.dataset.pdfMode = theme.pdf;
  root.dataset.uiMode = theme.ui;
  return { ui: root.dataset.ui, inverted: root.dataset.pdfInvert === '1' };
}

function loadTheme(storage) {
  try {
    const raw = storage && storage.getItem('figcut.theme');
    if (!raw) return createTheme();
    const j = JSON.parse(raw);
    return createTheme({ ui: j.ui, pdf: j.pdf });
  } catch (e) {
    return createTheme();
  }
}

function saveTheme(storage, theme) {
  try {
    storage.setItem('figcut.theme', JSON.stringify({ ui: theme.ui, pdf: theme.pdf }));
  } catch (e) {
    // 存不下就算了，不影响本次使用
  }
}

// ---- src/app/settings.js ----
// 全局设置：导出边距、DPI（与单文件标注配置分开存）
// 状态：已实现。



const DEFAULTS = { dpi: 300, margin: 8 };
const RANGES = { dpi: [72, 1200], margin: [0, 80] };
const SETTINGS_KEY = 'figcut.settings';

function clampDpi(v) {
  return Math.round(clamp(Number(v), RANGES.dpi[0], RANGES.dpi[1]));
}

function clampMargin(v) {
  const n = Number(v);
  return Number.isFinite(n) ? Math.round(clamp(n, RANGES.margin[0], RANGES.margin[1]) * 10) / 10 : DEFAULTS.margin;
}

function createSettings(opts = {}) {
  return { dpi: clampDpi(opts.dpi === undefined ? DEFAULTS.dpi : opts.dpi), margin: clampMargin(opts.margin === undefined ? DEFAULTS.margin : opts.margin) };
}

function setDpi(settings, v) {
  settings.dpi = clampDpi(v);
  return settings.dpi;
}

function setMargin(settings, v) {
  settings.margin = clampMargin(v);
  return settings.margin;
}

function loadSettings(storage) {
  try {
    const raw = storage && storage.getItem(SETTINGS_KEY);
    if (!raw) return createSettings();
    return createSettings(JSON.parse(raw));
  } catch (e) {
    return createSettings();
  }
}

function saveSettings(storage, settings) {
  try {
    storage.setItem(SETTINGS_KEY, JSON.stringify({ dpi: settings.dpi, margin: settings.margin }));
    return true;
  } catch (e) {
    return false;
  }
}

// 提示条与异常横幅
// 状态：已实现。

function toast(message, opts = {}) {
  if (typeof document === 'undefined') return null;
  const host = document.getElementById('banner');
  if (!host) return null;
  host.hidden = false;
  host.textContent = String(message);
  host.dataset.kind = opts.kind || 'error';
  clearTimeout(host._timer);
  host._timer = setTimeout(() => {
    host.hidden = true;
  }, opts.ms === undefined ? 10000 : opts.ms);
  return host;
}

function banner(message, opts = {}) {
  return toast(message, opts);
}

// ---- src/app/boot.js ----
// 启动装配与状态机
// 状态：已实现（打开 PDF、连续滚动、缩放、矩形/多边形标注、撤销重做）。































function boot(opts = {}) {
  const shell = createShell();
  const zoom = createZoom({ scale: 1 });
  const stack = createPageStack({ container: shell.canvas, zoom });


  const ed = createEditor({ pageW: 595, pageH: 842 });
  const hist = createHistory(JSON.stringify(ed.regions));
  const overlays = new Map();
  let state = 'idle';
  let drawing = false;
  let currentDoc = null;
  let currentName = 'figures';
  let lastPt = null;
  let liveRaf = 0;
  let refreshTextTimer = 0;

  function download(bytes, filename) {
    if (typeof URL === 'undefined' || typeof Blob === 'undefined') return false;
    const blob = new Blob([bytes], { type: 'application/zip' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 5000);
    return true;
  }

  async function doExport() {
    if (!currentDoc) {
      toast('先打开一份 PDF');
      return null;
    }
    if (ed.regions.length === 0) {
      toast('还没有框，先圈几张图');
      return null;
    }
    state = 'exporting';
    try {
      toast('正在导出 ' + ed.regions.length + ' 张图…', { kind: 'info', ms: 8000 });
      const out = await exportZip({
        doc: currentDoc,
        regions: ed.regions,
        source: currentName,
        dpi: settings.dpi,
        margin: settings.margin,
        onProgress: ({ page, done, total }) => {
          if (page) toast('正在导出第 ' + page + ' 页（' + (done + 1) + '/' + total + '）…', { kind: 'info', ms: 8000 });
        },
      });
      download(out.bytes, out.name);
      toast('已导出 ' + out.files.length + ' 张图 → ' + out.name, { kind: 'info', ms: 5000 });
      return out;
    } catch (e) {
      toast('导出失败：' + (e && e.message ? e.message : e));
      return null;
    } finally {
      state = 'ready';
    }
  }

  const snapshot = () => JSON.stringify(ed.regions);
  const record = (key) => {
    commit(hist, snapshot(), key ? { key } : {});
    scheduleSave();
  };

  // ---- 持久化：每份 PDF 一条 localStorage 记录，键 = 文件名|字节数 ----
  const storage = (() => {
    try {
      return typeof window !== 'undefined' ? window.localStorage : null;
    } catch (e) {
      return null;
    }
  })();
  let currentKey = null;
  let saveTimer = null;

  // ---- 配色：界面与 PDF 两套独立三态 ----
  const theme = loadTheme(storage);
  const prefersDark = () =>
    typeof window !== 'undefined' && window.matchMedia
      ? window.matchMedia('(prefers-color-scheme: dark)').matches
      : false;

  const settings = loadSettings(storage);

  function applyColors() {
    applyTheme(theme, document, prefersDark());
    saveTheme(storage, theme);
    if (typeof syncMenu === 'function') syncMenu();
    return theme;
  }

  function persist(force) {
    if (!storage || !currentKey) return false;
    clearTimeout(saveTimer);
    saveTimer = null;
    try {
      saveConfig(storage, currentKey, {
        source: currentName,
        export: { dpi: 300, margin: 8 },
        updatedAt: Date.now(),
        pages: groupByPage(ed.regions),
      });
      return true;
    } catch (e) {
      toast('存不下标注（localStorage 满了？），请尽快导出 ZIP');
      return false;
    }
  }

  function scheduleSave() {
    if (!storage || !currentKey) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => persist(true), 200);
  }

  // 右栏：常驻预览 + 区域列表
  const doc = shell.canvas.ownerDocument;
  const previewHost = doc.createElement('div');
  previewHost.className = 'preview-host';
  const listHost = doc.createElement('div');
  listHost.className = 'region-list';
  shell.panelRight.append(previewHost, listHost);
  const preview = createPreview(previewHost);
  let lastListSig = '';

  // 拖动排序：把 from 插到 to 的位置，然后重排同页的 order 字段
  function reorderRegion(fromId, toId) {
    const from = ed.regions.findIndex((r) => r.id === fromId);
    const to = ed.regions.findIndex((r) => r.id === toId);
    if (from < 0 || to < 0 || from === to) return;
    const [moved] = ed.regions.splice(from, 1);
    ed.regions.splice(to, 0, moved);
    const page = moved.page;
    let n = 0;
    for (const r of ed.regions) {
      if (r.page === page) r.order = n++;
    }
    record(null);
    lastListSig = '';
    refresh();
  }

  function selectRegion(region) {
    if (!region) {
      ed.selectedId = null;
    } else {
      ed.selectedId = region.id;
      if (!region.ink) measureRegion(region);
      if (region.page !== ed.page) setPage(ed, region.page);
      ed.pageW = overlays.get(region.page) ? overlays.get(region.page).size.w : ed.pageW;
      ed.pageH = overlays.get(region.page) ? overlays.get(region.page).size.h : ed.pageH;
      const wrap = stack.pages.find((p) => p.no === region.page);
      if (wrap && wrap.wrap.scrollIntoView) wrap.wrap.scrollIntoView({ block: 'nearest' });
    }
    refresh();
  }

  // ---- 缩紧：画完/改完立刻量出导出框（2px/pt 掩膜，一页缓存一份） ----
  const maskCache = new Map();

  async function pageMask(pageNo) {
    if (maskCache.has(pageNo)) return maskCache.get(pageNo);
    const p = stack.pages.find((x) => x.no === pageNo);
    if (!p) return null;
    // 2px/pt 的整页位图：既用来量墨迹，也当右栏预览的高清源
    const canvas = await renderPage(p.page, { scale: 3, dpr: 1 });
    const img = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    const entry = { mask: buildInkMask(img, { pxPerPt: 3 }), canvas };
    maskCache.set(pageNo, entry);
    return entry;
  }

  function applyMeasure(region, entry) {
    const shape = region.shape === 'poly' ? region.points : region.rect;
    region.ink = computeExportBox(entry.mask, shape) || null;
    region.box = region.ink
      ? growWhite(entry.mask, region.ink, settings.margin, entry.mask.w / 2, entry.mask.h / 2)
      : null;
  }

  function measureRegion(region) {
    if (!region) return;
    // 掩膜已经就绪就同步量，画完立刻能看到虚线框；否则后台补
    const cached = maskCache.get(region.page);
    if (cached) {
      applyMeasure(region, cached);
      return;
    }
    pageMask(region.page).then((entry) => {
      if (!entry) return;
      applyMeasure(region, entry);
      render();
    });
  }

  function remeasureAll() {
    for (const region of ed.regions) {
      const cached = maskCache.get(region.page);
      if (cached) applyMeasure(region, cached);
      else {
        region.box = null;
        measureRegion(region);
      }
    }
    render();
  }

  // 右栏每个 figure 的缩略图：从 3px/pt 高清页位图裁好，多边形选区会按蒙版涂白
  function regionThumb(region) {
    const box = region.box || region.ink;
    if (!box) {
      if (!maskCache.has(region.page)) {
        pageMask(region.page).then(() => render());
      }
      return null;
    }
    const entry = maskCache.get(region.page);
    if (!entry) {
      pageMask(region.page).then(() => render());
      return null;
    }
    const src = entry.canvas;
    const s = 3; // 与 pageMask 的栅格一致
    const W = 96;
    const H = Math.max(1, Math.round((W * box.h) / box.w));
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (region.shape === 'poly' && region.points) {
      ctx.beginPath();
      region.points.forEach((p, i) => {
        const x = ((p.x - box.x) / box.w) * W;
        const y = ((p.y - box.y) / box.h) * H;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.clip();
    }
    ctx.drawImage(src, box.x * s, box.y * s, box.w * s, box.h * s, 0, 0, W, H);
    ctx.restore();
    return c;
  }

  // 左栏缩略图：直接从已渲染的页位图缩一份
  const thumbPending = new Set();

  function thumbFor(no) {
    const p = stack.pages.find((x) => x.no === no);
    if (!p || !p.canvas || !p.canvas.width) {
      // 位图还没画好：等它好了强制重建一次列表，否则缩略图会一直空着
      if (!thumbPending.has(no)) {
        thumbPending.add(no);
        setTimeout(() => {
          thumbPending.delete(no);
          lastListSig = '';
          render();
        }, 250);
      }
      return null;
    }
    const W = 300;
    const H = Math.round((W * 842) / 595);
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);
    const k = Math.min(W / p.canvas.width, H / p.canvas.height);
    const w = p.canvas.width * k;
    const h = p.canvas.height * k;
    ctx.drawImage(p.canvas, (W - w) / 2, (H - h) / 2, w, h);
    return c;
  }

  function renderPanels() {
    const ov = overlays.get(ed.page);
    const pageW = ov ? ov.size.w : ed.pageW;
    const pageH = ov ? ov.size.h : ed.pageH;
    // 预览用 2px/pt 的高清源，别拿屏幕上的小图放大
    const hi = maskCache.get(ed.page);
    const stackPage = stack.pages.find((p) => p.no === ed.page);
    const source = hi ? hi.canvas : stackPage ? stackPage.canvas : null;
    const sel = ed.regions.find((r) => r.id === ed.selectedId && r.page === ed.page);

    // 没选中时右栏不放大缩略图（那是左栏的活），只留区域列表
    if (sel) {
      previewHost.hidden = false;
      // 预览显示的就是导出结果：缩紧后的框再扩 margin
      const b = sel.box || sel.ink || boundsOf(sel);
      renderPreview(preview, {
        source,
        pageW,
        pageH,
        selectedId: sel.id,
        regions: regionsOfPage(ed.regions, ed.page),
        crop: b,
        poly: sel.shape === 'poly' ? sel.points : null,
        // 预览宽度永远跟着右栏走，别再写死 232 把栏撑出去
        maxW: Math.max(80, Math.floor(previewHost.clientWidth - 14)),
      });
    } else {
      previewHost.hidden = true;
    }

    // 左栏：页码 + 标注数（只在签名变了才重建，画框拖动时不重排）
    const sig = stack.pages.length + ':' + ed.regions.length + ':' + ed.page;
    if (sig !== lastListSig) {
      lastListSig = sig;
      renderPageList(shell.panelLeft, {
        pages: stack.pages,
        current: ed.page,
        regions: ed.regions,
        onPick: (no) => goPage(no),
        onZoom: (no) => openLightbox(no),
        thumbFor,
        cols: effectiveCols(),
      });
    }

    renderRegions(listHost, {
      regions: ed.regions,
      page: ed.page,
      selectedId: ed.selectedId,
      onSelect: selectRegion,
      onChange: (region, meta) => {
        // 打字时不重建列表，否则每敲一个字输入框就丢焦点
        if (meta && meta.quiet) return;
        record(null);
        refresh();
      },
      onThumb: regionThumb,
      onThumbClick: (region) => openFigureLightbox(region),
      onReorder: (fromId, toId) => reorderRegion(fromId, toId),
      onDelete: (region) => {
        const idx = ed.regions.indexOf(region);
        if (idx >= 0) ed.regions.splice(idx, 1);
        if (ed.selectedId === region.id) ed.selectedId = null;
        record(null);
        refresh();
      },
    });
  }

  function clampScrollX() {
    const root = stack.root;
    const max = Math.max(0, root.scrollWidth - root.clientWidth);
    if (root.scrollLeft > max + 1) root.scrollLeft = max;
  }

  function updateSubtitle() {
    const el = document.getElementById('topbar-subtitle');
    if (!el) return;
    const total = stack.pages.length;
    if (!total) {
      el.textContent = '';
      return;
    }
    el.textContent = '第 ' + ed.page + ' / ' + total + ' 页 · ' + ed.regions.length + ' 个标注 · ' + settings.dpi + ' DPI · 边距 ' + settings.margin + ' pt';
  }

  function toggleRightPanel() {
    layout.rightCollapsed = !layout.rightCollapsed;
    applyLayout();
    saveLayout();
    scheduleRefit();
  }

  function render() {
    document.documentElement.dataset.empty = state === 'ready' && stack.pages.length > 0 ? '0' : '1';
    clampScrollX();
    updateSubtitle();
    for (const [page, ov] of overlays) {
      drawRegions(ov, regionsOfPage(ed.regions, page), {
        selectedId: page === ed.page ? ed.selectedId : null,
        selected: page === ed.page ? ed.regions.find((r) => r.id === ed.selectedId) || null : null,
        draft: page === ed.page ? ed.draft : null,
        cursor: page === ed.page ? lastPt : null,
        scale: zoom.scale,
        margin: settings.margin,
      });
    }
    renderPanels();
  }

  const refresh = render;

  // 顶栏左簇：打开 → 撤销 → 重做（工具组是画布左上的浮层，不在这儿）

  // 汉堡菜单

  // ---- 主菜单弹层（配色三圆点 + 缩放行 + 导出设置 + 撤销/重做）----

  document.body.appendChild(menu);

  function pairRow(defs) {
    const el = doc.createElement('div');
    el.className = 'menu-pair';
    for (const [label, accel, action] of defs) {
      const b = doc.createElement('button');

        a.textContent = accel;
        b.appendChild(a);
      }

    }
    return el;
  }

  function sepLine() {
    const d = doc.createElement('div');
    d.className = 'menu-sep';
    return d;
  }

  function menuRow(label, value, kind, action) {
    const el = doc.createElement('div');
    el.className = 'menu-row';
    const name = doc.createElement('span');
    name.className = 'menu-name';
    name.textContent = label;
    el.appendChild(name);
    let input = null;
    if (kind) {
      input = doc.createElement('input');
      input.type = 'number';
      input.className = 'menu-input';
      input.value = String(value);
      if (kind === 'dpi') { input.min = '72'; input.max = '1200'; }
      else { input.min = '0'; input.max = '80'; input.step = '0.5'; }
      input.addEventListener('change', () => {
        if (kind === 'dpi') {
          input.value = String(setDpi(settings, input.value));
        } else {
          input.value = String(setMargin(settings, input.value));
          remeasureAll();
        }
        saveSettings(storage, settings);
      });
      el.appendChild(input);
    } else {
      const v = doc.createElement('span');
      v.className = 'menu-value';
      v.textContent = value;
      el.appendChild(v);
      if (action) el.addEventListener('click', action);
    }
    return { el, input };
  }

  function syncMenu() {
    const ui = resolvedUi(theme, prefersDark());
    const inv = isInverted(theme, prefersDark());
    for (const { sw, item } of swatches) {
      // 白 / 混合 / 黑 三态各自对应一组 (ui, pdf)
      const active = resolvedUi(theme, prefersDark()) === item.ui && isInverted(theme, prefersDark()) === (item.pdf === 'invert');
      sw.classList.toggle('is-on', active);
    }
    zLabel.textContent = Math.round(zoom.scale * 100) + '%';
  }

  let fitPageMode = false;

  let dualBeforeFitPage = null;

  function doFitPage() {
    // 适应整页 = 单页撑满高度（暂存原来的双页设置，离开时恢复）
    if (!fitPageMode) dualBeforeFitPage = stack.view.dual;
    fitPageMode = true;
    stack.applyLayout({ dual: false });
    stack.root.style.removeProperty('--fit-extra');
    stack.root.classList.add('is-fitpage'); // 缩紧上下内边距，页面才能占满高度
    setFit(zoom, 'page', fitDims());
    // 内边距变了，把当前页对齐到顶部
    requestAnimationFrame(() => {
      const cur = stack.root.querySelector('.page-row.is-current');
      if (!cur) return;
      stack.root.scrollTop = Math.max(0, cur.offsetTop - 8);
    });
  }

  function doFitWidth() {
    fitPageMode = false;
    stack.root.classList.remove('is-fitpage');
    setFit(zoom, 'width', fitDims());
  }

  function stepZoomBy(dir) {
    const list = stepList(fitWidthScale(fitDims()));
    const i = stepIndex(zoom.scale, list);
    setScale(zoom, list[Math.min(list.length - 1, Math.max(0, i + dir))]);
  }

  function openMenu() {
    const r = menuBtn.getBoundingClientRect();
    menu.style.top = Math.round(r.bottom + 6) + 'px';
    menu.style.right = Math.round(window.innerWidth - r.right) + 'px';
    menu.hidden = false;
    menuBtn.classList.add('is-open');
    syncMenu();
    document.addEventListener('pointerdown', onMenuOutside, true);
  }
  function closeMenu() {
    menu.hidden = true;
    menuBtn.classList.remove('is-open');
    document.removeEventListener('pointerdown', onMenuOutside, true);
  }
  function onMenuOutside(ev) {
    if (menu.contains(ev.target) || menuBtn.contains(ev.target)) return;
    closeMenu();
  }
  menuBtn.addEventListener('click', () => (menu.hidden ? openMenu() : closeMenu()));
  zoom.listeners.add(syncMenu);


  // 浮动工具组：画布左上
  // 工具组放进顶栏（撤销/重做右边），不跟画布一起滚
  const toolGroup = doc.createElement('div');
  toolGroup.className = 'tool-group';
  shell.left.appendChild(toolGroup);

  const toolButtons = new Map();

  function markTool(tool) {
    for (const [name, btn] of toolButtons) btn.classList.toggle('is-active', name === tool);
    shell.canvas.dataset.tool = tool;
  }

  const toolButton = (iconSvg, label, tool) => {
    const btn = addButtonTo(toolGroup, label, () => {
      setTool(ed, tool);
      markTool(tool);
    }, { title: label, ariaLabel: label, icon: iconSvg });
    toolButtons.set(tool, btn);
    if (tool === ed.tool) btn.classList.add('is-active');
    return btn;
  };

  toolButton(ICONS.select, '选择 (Q)', 'select');
  toolButton(ICONS.rect, '矩形 (W)', 'rect');
  toolButton(ICONS.poly, '多边形 (E)', 'poly');
  markTool(ed.tool);

  function pointOf(ev) {
    const el = ev.target && ev.target.closest ? ev.target.closest('.page') : null;
    if (!el) return null;
    const canvas = el.querySelector('canvas');
    const box = canvas.getBoundingClientRect();
    if (box.width === 0 || box.height === 0) return null;
    const no = Number(el.dataset.page);
    const ov = overlays.get(no);
    const size = ov ? ov.size : { w: ed.pageW, h: ed.pageH };
    return {
      no,
      pt: {
        x: ((ev.clientX - box.left) / box.width) * size.w,
        y: ((ev.clientY - box.top) / box.height) * size.h,
      },
      size,
    };
  }

  // 中键拖拽平移
  let pan = null;
  shell.canvas.addEventListener('pointerdown', (ev) => {
    if (ev.button === 1) {
      pan = { x: ev.clientX, y: ev.clientY, left: stack.root.scrollLeft, top: stack.root.scrollTop };
      ev.preventDefault();
    }
  });

  shell.canvas.addEventListener('pointerdown', (ev) => {
    if (state !== 'ready' || ev.button === 1) return;
    const hit = pointOf(ev);
    if (!hit) return;
    if (hit.no !== ed.page) setPage(ed, hit.no);
    ed.pageW = hit.size.w;
    ed.pageH = hit.size.h;
    drawing = true;
    lastPt = hit.pt;
    pointerDown(ed, hit.pt);
    render();
  });

  // hover 反馈：手柄/顶点用 pointer，框体用 move，空白看工具
  // hover 反馈：手柄/顶点用 pointer，框体用 move，空白看工具
  function hoverCursor(ev) {
    if (state !== 'ready') return '';
    const hit = pointOf(ev);
    if (!hit) return '';
    const sel = ed.regions.find((r) => r.id === ed.selectedId && r.page === hit.no);
    if (sel) {
      if (sel.shape === 'rect') {
        if (cornerAt(sel.rect, hit.pt.x, hit.pt.y, 10)) return 'pointer';
        if (edgeAt(sel.rect, hit.pt.x, hit.pt.y, 10)) return 'pointer';
      } else if (vertexAt(sel.points, hit.pt.x, hit.pt.y, 10) >= 0) {
        return 'pointer';
      }
    }
    if (regionAt(ed, hit.pt)) return 'move';
    return 'default';
  }

  shell.canvas.addEventListener('pointermove', (ev) => {
    if (pan) {
      stack.root.scrollLeft = pan.left - (ev.clientX - pan.x);
      stack.root.scrollTop = pan.top - (ev.clientY - pan.y);
      return;
    }
    if (!drawing) {
      const cur = hoverCursor(ev);
      shell.canvas.style.cursor = cur;
      stack.root.style.cursor = cur;
      // 正在画多边形/矩形（还没松手）时，鼠标移动也要实时预览
      if (ed.draft) {
        const hit = pointOf(ev);
        if (hit && hit.no === ed.page) {
          lastPt = hit.pt;
          if (ed.draft.shape === 'rect') {
            ed.draft.x1 = hit.pt.x;
            ed.draft.y1 = hit.pt.y;
          }
          render();
        }
      }
      return;
    }
    if (state !== 'ready') return;
    const hit = pointOf(ev);
    if (!hit) return;
    lastPt = hit.pt;
    pointerMove(ed, hit.pt);
    // 拖动/改形状时橙框也要跟着变，不能等松手
    const live = ed.regions.find((r) => r.id === ed.selectedId);
    if (live && maskCache.has(live.page)) {
      if (!liveRaf) {
        liveRaf = requestAnimationFrame(() => {
          liveRaf = 0;
          const r2 = ed.regions.find((r) => r.id === ed.selectedId);
          if (r2 && maskCache.has(r2.page)) applyMeasure(r2, maskCache.get(r2.page));
          render();
        });
      }
    }
    render();
  });

  shell.canvas.addEventListener('pointerup', (ev) => {
    if (pan) {
      pan = null;
      return;
    }
    if (!drawing) return;
    drawing = false;
    const hit = pointOf(ev);
    if (!hit) return;
    const before = snapshot();
    pointerUp(ed, hit.pt);
    if (snapshot() !== before) {
      record(null);
      measureRegion(ed.regions.find((r) => r.id === ed.selectedId));
    }
    render();
  });

  // 键盘缩放和滚轮/按钮共用同一张表（预设 + 实时页宽）
  function stepZoomTo(dir) {
    const list = stepList(fitWidthScale(fitDims()));
    const i = stepIndex(zoom.scale, list);
    setScale(zoom, list[Math.min(list.length - 1, Math.max(0, i + dir))]);
  }

  // ---- 快捷键：统一走 app/shortcuts 的键表 ----
  // 视图可用区域（扣掉 padding 与滚动条）
  function viewportBox() {
    const el = stack.root;
    const cs = getComputedStyle(el);
    const padX = (parseFloat(cs.paddingLeft) || 0) + (parseFloat(cs.paddingRight) || 0);
    const padY = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    const scrollX = el.offsetWidth - el.clientWidth;
    const scrollY = el.offsetHeight - el.clientHeight;
    return {
      w: Math.max(1, el.clientWidth - padX - scrollX),
      h: Math.max(1, el.clientHeight - padY - scrollY),
    };
  }

  const PAGE_GAP = 20;

  // 适应：width = 整栏宽度塞满；page = 一页完整放进视口（双页时两页并排也要塞满宽度）
  function computeFit(mode) {
    const ov = overlays.get(ed.page);
    const pageW = ov ? ov.size.w : ed.pageW;
    const pageH = ov ? ov.size.h : ed.pageH;
    const box = viewportBox();
    const cols = stack.view.dual ? 2 : 1;
    const usableW = Math.max(60, box.w - PAGE_GAP * (cols - 1));
    const wScale = usableW / (pageW * cols);
    const hScale = box.h / pageH;
    const raw = mode === 'width' ? wScale : Math.min(wScale, hScale);
    // 留 1px 余量，避免四舍五入后正好溢出触发滚动条
    const safe = Math.floor((raw - 0.0015) * 1000) / 1000;
    return Math.max(0.05, Math.min(8, safe));
  }

  // 兼容旧调用点
  const fitDims = () => ({ viewportW: viewportBox().w, viewportH: viewportBox().h, pageW: ed.pageW, pageH: ed.pageH, padX: 0, padY: 0 });

  // ---- 缩略图全屏查看 ----
  const lb = document.getElementById('lightbox');
  const lbCanvas = document.getElementById('lightbox-canvas');
  const lbNo = document.getElementById('lb-no');
  let lbPage = 1;
  let lbMode = 'page'; // 'page' = PDF 页预览，'figure' = 单个 figure 预览
  let lbFigures = [];
  let lbFigureIndex = 0;
  const lbView = { scale: 1, x: 0, y: 0 };
  const lbStage = document.getElementById('lightbox-stage');
  const lbZoomBtn = document.getElementById('lb-zoom');

  function lbApply() {
    lbCanvas.style.transform =
      'translate(' + lbView.x + 'px,' + lbView.y + 'px) scale(' + lbView.scale + ')';
    if (lbZoomBtn) lbZoomBtn.textContent = Math.round(lbView.scale * 100) + '%';
  }

  // 适应窗口：等比缩到刚好放下并居中
  function lbFit() {
    if (!lbStage || !lbCanvas.width) return;
    const sw = lbStage.clientWidth;
    const sh = lbStage.clientHeight;
    if (sw < 8 || sh < 8) {
      requestAnimationFrame(lbFit); // 布局还没算完
      return;
    }
    const fit = Math.min(sw / lbCanvas.width, sh / lbCanvas.height);
    lbView.scale = Math.min(1, fit) || 1;
    lbView.x = (sw - lbCanvas.width * lbView.scale) / 2;
    lbView.y = (sh - lbCanvas.height * lbView.scale) / 2;
    lbApply();
  }

  // 以某个屏幕点为锚缩放（滚轮/双击都走这里）
  function lbZoomAt(factor, clientX, clientY) {
    if (!lbStage) return;
    const rect = lbStage.getBoundingClientRect();
    const mx = (clientX === undefined ? rect.left + rect.width / 2 : clientX) - rect.left;
    const my = (clientY === undefined ? rect.top + rect.height / 2 : clientY) - rect.top;
    const next = Math.min(12, Math.max(0.05, lbView.scale * factor));
    const k = next / lbView.scale;
    lbView.x = mx - (mx - lbView.x) * k;
    lbView.y = my - (my - lbView.y) * k;
    lbView.scale = next;
    lbApply();
  }

  async function drawLightbox() {
    const p = stack.pages.find((x) => x.no === lbPage);
    if (!p) return;
    const vp1 = p.page.getViewport({ scale: 1 });
    const maxW = Math.min(window.innerWidth * 0.94, 1800);
    const scale = Math.min(4, maxW / vp1.width);
    const vp = p.page.getViewport({ scale });
    lbCanvas.width = Math.round(vp.width);
    lbCanvas.height = Math.round(vp.height);
    const ctx = lbCanvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, lbCanvas.width, lbCanvas.height);
    await p.page.render({ canvasContext: ctx, viewport: vp }).promise;
    lbNo.textContent = lbPage + ' / ' + stack.pages.length;
    lbFit();
    syncLbArrows();
  }

  function syncLbArrows() {
    const prev = document.getElementById('lb-prev');
    const next = document.getElementById('lb-next');
    if (!prev || !next) return;
    const total = lbMode === 'figure' ? lbFigures.length : stack.pages.length;
    const idx = lbMode === 'figure' ? lbFigureIndex + 1 : lbPage;
    const atStart = idx <= 1;
    const atEnd = idx >= total;
    prev.classList.toggle('is-disabled', atStart);
    next.classList.toggle('is-disabled', atEnd);
  }

  function lbStep(dir) {
    if (lbMode === 'figure') {
      const next = lbFigureIndex + dir;
      if (next < 0 || next >= lbFigures.length) return;
      lbFigureIndex = next;
      openFigureLightbox(lbFigures[next]);
      return;
    }
    const next = lbPage + dir;
    if (next < 1 || next > stack.pages.length) return; // 到头就不重绘，避免闪
    lbPage = next;
    drawLightbox();
  }

  function openLightbox(no) {
    if (!lb) return;
    lbMode = 'page';
    lbPage = no;
    lb.hidden = false;
    const bar = document.querySelector('.lightbox-bar');
    if (bar) bar.style.display = '';
    drawLightbox();
    syncLbArrows();
  }

  // 右栏某个 figure 的全屏预览：按导出框裁好、按多边形蒙版涂白
  async function openFigureLightbox(region) {
    if (!lb || !region) return;
    const p = stack.pages.find((x) => x.no === region.page);
    // 有时量测还没跑完（box 为空），先补量一次，别掉回整页预览
    if (!region.box && maskCache.has(region.page)) {
      applyMeasure(region, maskCache.get(region.page));
    }
    let box = region.box || region.ink || (region.shape === 'poly' ? null : region.rect);
    if (!box && !maskCache.has(region.page)) {
      const entry = await pageMask(region.page);
      if (entry) applyMeasure(region, entry);
      box = region.box || region.ink || (region.shape === 'poly' ? null : region.rect);
    }
    if (!p || !box) {
      openLightbox(region.page);
      return;
    }
    lbMode = 'figure';
    lb.hidden = false;
    // 单图模式也能在 figure 之间翻
    lbFigures = ed.regions
      .slice()
      .sort((a, b) => a.page - b.page || (a.order || 0) - (b.order || 0));
    const idx = lbFigures.findIndex((r) => r.id === region.id);
    lbFigureIndex = idx >= 0 ? idx : 0;
    const bar = document.querySelector('.lightbox-bar');
    if (bar) bar.style.display = '';

    // 整页渲染到离屏画布（限制总像素），再裁出这块并放大到 ~1100px
    const vp1 = p.page.getViewport({ scale: 1 });
    const pageScale = Math.min(6, Math.max(1.5, 3200 / vp1.width));
    const vp = p.page.getViewport({ scale: pageScale });
    const off = doc.createElement('canvas');
    off.width = Math.round(vp.width);
    off.height = Math.round(vp.height);
    const offCtx = off.getContext('2d');
    offCtx.fillStyle = '#fff';
    offCtx.fillRect(0, 0, off.width, off.height);
    await p.page.render({ canvasContext: offCtx, viewport: vp }).promise;

    const w = Math.max(1, Math.round(Math.min(1600, Math.max(320, box.w * 3))));
    const h = Math.max(1, Math.round((box.h / box.w) * w));
    lbCanvas.width = w;
    lbCanvas.height = h;
    const ctx = lbCanvas.getContext('2d');
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, w, h);
    ctx.save();
    if (region.shape === 'poly' && region.points) {
      ctx.beginPath();
      region.points.forEach((pt, i) => {
        const x = ((pt.x - box.x) / box.w) * w;
        const y = ((pt.y - box.y) / box.h) * h;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.closePath();
      ctx.clip();
    }
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(
      off,
      box.x * pageScale,
      box.y * pageScale,
      box.w * pageScale,
      box.h * pageScale,
      0, 0, w, h
    );
    ctx.restore();
    lbNo.textContent = (lbFigureIndex + 1) + '/' + lbFigures.length + ' · ' + labelOfKind(region);
    lbFit();
    syncLbArrows();
  }



  function closeLightbox() {
    if (lb) lb.hidden = true;
  }

  if (lb) {
    // 滚轮：以光标为锚缩放
    lb.addEventListener('wheel', (ev) => {
      if (lb.hidden) return;
      ev.preventDefault();
      lbZoomAt(Math.exp(-ev.deltaY * 0.0018), ev.clientX, ev.clientY);
    }, { passive: false });

    // 拖动平移（任意缩放级别都能拖）
    let pan = null;
    let dragged = false;
    lbStage.addEventListener('pointerdown', (ev) => {
      if (ev.button !== 0) return;
      pan = { x: ev.clientX, y: ev.clientY, ox: lbView.x, oy: lbView.y };
      dragged = false;
      lbStage.classList.add('is-panning');
      if (lbStage.setPointerCapture) lbStage.setPointerCapture(ev.pointerId);
    });
    lbStage.addEventListener('pointermove', (ev) => {
      if (!pan) return;
      const dx = ev.clientX - pan.x;
      const dy = ev.clientY - pan.y;
      if (Math.abs(dx) + Math.abs(dy) > 3) dragged = true;
      lbView.x = pan.ox + dx;
      lbView.y = pan.oy + dy;
      lbApply();
    });
    const endPan = () => {
      pan = null;
      lbStage.classList.remove('is-panning');
    };
    lbStage.addEventListener('pointerup', endPan);
    lbStage.addEventListener('pointercancel', endPan);

    // 双击：100% ↔ 适应窗口
    lbStage.addEventListener('dblclick', (ev) => {
      if (Math.abs(lbView.scale - 1) < 0.01) lbFit();
      else lbZoomAt(1 / lbView.scale, ev.clientX, ev.clientY);
    });

    // 只有「点一下」才关闭；拖动松手不算点击
    lb.addEventListener('click', (ev) => {
      if (dragged) {
        dragged = false;
        return;
      }
      if (ev.target === lb || ev.target === lbStage) closeLightbox();
    });
    document.addEventListener('keydown', (ev) => {
      if (lb.hidden) return;
      if (ev.key === 'Escape') {
        closeLightbox();
        ev.preventDefault();
        return;
      }
      if (ev.key === 'ArrowLeft') lbStep(-1);
      else if (ev.key === 'ArrowRight') lbStep(1);
      else if (ev.key === '+' || ev.key === '=') lbZoomAt(1.15);
      else if (ev.key === '-' || ev.key === '_') lbZoomAt(1 / 1.15);
      else if (ev.key === '0') lbFit();
      else return;
      ev.preventDefault();
    });
    document.getElementById('lb-prev').addEventListener('click', () => lbStep(-1));
    document.getElementById('lb-next').addEventListener('click', () => lbStep(1));
    document.getElementById('lb-zoom-in').addEventListener('click', () => lbZoomAt(1.2));
    document.getElementById('lb-zoom-out').addEventListener('click', () => lbZoomAt(1 / 1.2));
    document.getElementById('lb-zoom').addEventListener('click', () => lbZoomAt(1 / lbView.scale));
    document.getElementById('lb-fit').addEventListener('click', () => lbFit());
    document.getElementById('lb-close').addEventListener('click', () => closeLightbox());
  }

  function goPage(no) {
    const total = stack.pages.length || 1;
    const next = Math.min(Math.max(1, no), total);
    stack.setCurrent(next);
    pageMask(next); // 预热，画框时能同步缩紧
    if (ed.page !== next) {
      ed.page = next;
      ed.selectedId = null;
      render();
    }
    return next;
  }

  const actions = {
    'tool.select': () => { setTool(ed, 'select'); markTool('select'); },
    'tool.rect': () => { setTool(ed, 'rect'); markTool('rect'); },
    'tool.poly': () => { setTool(ed, 'poly'); markTool('poly'); },
    'tool.closePoly': () => { if (closePoly(ed)) { record(null); render(); } },
    'page.next': () => goPage(stack.current + 1),
    'page.prev': () => goPage(stack.current - 1),
    'page.plus10': () => goPage(stack.current + 10),
    'page.minus10': () => goPage(stack.current - 10),
    'page.first': () => goPage(1),
    'page.last': () => goPage(stack.pages.length),
    'zoom.in': () => stepZoomTo(1),
    'zoom.out': () => stepZoomTo(-1),
    'zoom.reset': () => setScale(zoom, 1),
    'zoom.fitPage': () => doFitPage(),
    'zoom.fitWidth': () => doFitWidth(),
    'history.undo': undoUi,
    'history.redo': redoUi,
    'export.zip': () => doExport(),
    'config.save': () => persist(true),
    'file.open': async () => {
      const file = await pickFile();
      if (file) load(file);
    },
    'region.delete': () => {
      if (deleteSelection(ed)) { record(null); render(); }
    },
    'region.nudge': (ev) => {
      const v = nudgeVector(ev);
      if (nudge(ed, v.dx, v.dy)) {
        record('nudge');
        measureRegion(ed.regions.find((r) => r.id === ed.selectedId));
        render();
      }
    },
    'view.continuous': () => stack.applyLayout({ continuous: !stack.view.continuous }),
    'view.dual': () => stack.applyLayout({ dual: !stack.view.dual }),
    'view.oddLeft': () => stack.applyLayout({ oddLeft: !stack.view.oddLeft }),
    'view.invert': () => {
      theme.pdf = isInverted(theme, prefersDark()) ? 'normal' : 'invert';
      applyColors();
    },
    cancel: () => {
      ed.draft = null;
      ed.selectedId = null;
      render();
    },
  };

  bindShortcuts(document, actions);

  // Ctrl+滚轮：以指针为锚点缩放。事件按帧合并，trackpad 再密也只算一次。
  let wheelAcc = 0;
  let wheelPoint = null;
  let wheelRaf = 0;

  function applyWheel() {
    wheelRaf = 0;
    if (!wheelPoint || Math.abs(wheelAcc) < 10 || state !== 'ready') return;
    const root = stack.root;
    const from = zoom.scale;
    const dir = wheelAcc < 0 ? 1 : -1;
    wheelAcc = 0;
    // 档位表 = 预设 + 实时页宽比例，绝不会停在 143% 这种半吊子值
    const list = stepList(fitWidthScale(fitDims()));
    const i = stepIndex(from, list);
    const to = list[Math.min(list.length - 1, Math.max(0, i + dir))];
    if (Math.abs(to - from) < 1e-6) return;
    setScale(zoom, to);
    stack.setVisualScale(zoom.scale);
    stack.scheduleZoom();
    const next = anchorAt({ x: root.scrollLeft, y: root.scrollTop }, wheelPoint.x, wheelPoint.y, from, zoom.scale);
    root.scrollLeft = next.x;
    root.scrollTop = next.y;
  }

  shell.canvas.addEventListener('wheel', (ev) => {
    if (!(ev.ctrlKey || ev.metaKey) || state !== 'ready') return;
    ev.preventDefault();
    const root = stack.root;
    const box = root.getBoundingClientRect();
    wheelPoint = { x: ev.clientX - box.left, y: ev.clientY - box.top };
    wheelAcc += ev.deltaY;
    if (!wheelRaf) wheelRaf = requestAnimationFrame(applyWheel);
  }, { passive: false });

  // 滚动时当前页跟着走（右栏预览与列表要跟着变）
  stack.root.addEventListener('scroll', () => {
    if (state !== 'ready') return;
    const rects = stack.visibleRects();
    const viewportTop = shell.canvas.getBoundingClientRect().top + 8;
    stack.scheduleZoom(); // 滚到的新页需要补渲染
    const no = pageAtScroll(rects, viewportTop);
    if (no !== ed.page) {
      ed.page = no;
      ed.selectedId = null;
      render();
    }
  }, { passive: true });

  const load = async (file) => {
    persist(true); // 打开新文件前先落上一份
    state = 'loading';
    setEmpty(shell, false);
    document.documentElement.dataset.empty = '0';
    setTitle(shell, file.name);
    try {
      const doc = await openFile(file, opts);
      currentDoc = doc;
      currentName = file.name;
      // 默认双页（奇数页在左）；窄屏默认单页，避免两页并排溢出
      const narrow = window.innerWidth < 720;
      stack.applyLayout({ dual: !narrow, oddLeft: true });
      const n = await stack.mount(doc);

      overlays.clear();
      for (const p of stack.pages) {
        const vp = p.page.getViewport({ scale: 1 });
        overlays.set(p.no, createOverlay(p.wrap, { w: vp.width, h: vp.height }));
      }
      ed.page = 1;
      ed.pageW = stack.pages.length > 0 ? overlays.get(1).size.w : 595;
      ed.pageH = stack.pages.length > 0 ? overlays.get(1).size.h : 842;

      // 换文件：所有按文档缓存的东西必须清掉，否则新文件会显示上一份的掩膜/预览
      maskCache.clear();
      ed.regions = [];
      ed.selectedId = null;
      ed.nextId = 1;
      ed.draft = null;
      ed.page = 1;
      hist.past.length = 0;
      hist.future.length = 0;
      hist.present = snapshot();

      // 恢复这份 PDF 之前的标注
      currentKey = keyForFile(file.name, file.size);
      const saved = storage ? loadConfig(storage, currentKey) : null;
      if (saved && saved.pages) {
        const back = flattenPages(saved.pages);
        ed.regions = back.regions;
        ed.nextId = back.nextId;
        hist.present = snapshot();
      }

      // 默认缩放：横屏（宽 >= 高）适应整页，竖屏适应宽度
      if (zoom.mode === 'free') {
        const landscape = window.innerWidth >= window.innerHeight;
        if (landscape) doFitPage();
        else doFitWidth();
      }
      render();
      pageMask(1); // 预热首页掩膜
      setTitle(shell, file.name);
      updateSubtitle();
      pushRecent({ name: file.name, size: file.size, pages: n, ts: Date.now() });
      if (pendingHandle) {
        saveHandle(file.name, file.size, pendingHandle);
        pendingHandle = null;
      }
      // 顺手缓存原字节，下次不依赖句柄权限
      if (file && file.arrayBuffer) {
        file.arrayBuffer().then((buf) => cacheBytes(file.name, file.size, buf)).catch(() => {});
      }
      state = 'ready';
      document.documentElement.dataset.empty = '0'; // 打开后控件该回来了
    } catch (e) {
      state = 'error';
      toast('打开失败：' + (e && e.message ? e.message : e));
      setEmpty(shell, true);
      document.documentElement.dataset.empty = '1';
    }
  };

  // 适应页面/适应页宽/自动：窗口或侧栏一变就重新算，别等用户再点一次
  function refitIfNeeded() {
    if (!(zoom.auto || zoom.mode === 'width')) return;
    const auto = zoom.auto;
    setFit(zoom, 'width', fitDims());
    zoom.auto = auto;
  }

  let refitTimer = 0;
  const scheduleRefit = () => {
    clearTimeout(refitTimer);
    refitTimer = setTimeout(refitIfNeeded, 60);
  };

  window.addEventListener('resize', scheduleRefit);

  applyColors();
  acceptDrop(shell.canvas, (file) => load(file));
  subscribe(zoom, () => {
    if (fitPageMode && zoom.mode !== 'page') {
      fitPageMode = false;
      stack.root.classList.remove('is-fitpage');
      if (dualBeforeFitPage !== null) stack.applyLayout({ dual: dualBeforeFitPage });
      dualBeforeFitPage = null;
    }
    stack.setVisualScale(zoom.scale);
    stack.scheduleZoom();
    // 缩放停稳后把文本层重排，保证透明文字始终贴在字上
    clearTimeout(refreshTextTimer);
    refreshTextTimer = setTimeout(() => stack.refreshTextLayers(), 320);
  });

  // ---- 最近打开（启动时在中间列出来） ----
  const RECENT_KEY = 'figcut.recent';

  function readRecent() {
    try {
      const raw = storage && storage.getItem(RECENT_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function pushRecent(entry) {
    const list = readRecent().filter((x) => !(x.name === entry.name && x.size === entry.size));
    list.unshift(entry);
    const keep = list.slice(0, 8);
    const dropped = list.slice(8);
    try {
      storage && storage.setItem(RECENT_KEY, JSON.stringify(keep));
    } catch (e) {
      /* 存不下无所谓 */
    }
    // 被挤出最近列表的，缓存字节也一起清掉（40MB×N 不能无限攒）
    for (const old of dropped) forgetFile(old.name, old.size);
    renderRecent();
  }

  function renderRecent() {
    const host = document.getElementById('recent');
    if (!host) return;
    const list = readRecent();
    host.textContent = '';
    if (list.length === 0) return;

    const head = doc.createElement('div');
    head.className = 'recent-head';
    head.textContent = '最近打开';
    host.appendChild(head);

    for (const item of list) {
      const btn = doc.createElement('button');
      btn.type = 'button';
      btn.className = 'recent-item';

      const name = doc.createElement('span');
      name.className = 'name';
      name.textContent = item.name;

      const meta = doc.createElement('span');
      meta.className = 'meta';
      meta.textContent = (item.pages || '?') + ' 页';

      btn.append(name, meta);
      btn.addEventListener('click', async () => {
        // 句柄或缓存字节都能直接开；都没有才让用户再选一次
        const direct = await openRecent(item);
        if (direct) {
          load(direct);
          return;
        }
        toast('这一份需要重新选择一次（浏览器不允许静默读取）');
        const file = await chooseFile();
        if (file) load(file);
      });
      host.appendChild(btn);
    }
  }

  renderRecent();

  // ---- 侧栏拖拽 / 折叠（宽度记在 localStorage） ----
  const LAYOUT_KEY = 'figcut.layout';
  const layout = (() => {
    let saved = null;
    try {
      saved = storage && storage.getItem(LAYOUT_KEY);
      const parsed = JSON.parse(saved || '{}') || {};
      // 第一次在小屏打开：默认收起侧栏，先把页面给出来
      if (!saved && typeof window !== 'undefined') {
        const vw = window.innerWidth;
        if (vw < 900) parsed.leftCollapsed = true;
        if (vw < 720) parsed.rightCollapsed = true;
        if (vw < 720) parsed.sideCols = 1;
      }
      return parsed;
    } catch (e) {
      return {};
    }
  })();
  const saveLayout = () => {
    try {
      storage && storage.setItem(LAYOUT_KEY, JSON.stringify(layout));
    } catch (e) {
      /* 存不下无所谓 */
    }
  };

  const COLLAPSED_W = 48;
  let leftFoot = null;
  let rightFoot = null;
  let railTools = null;

  function applyLayout() {
    const root = document.documentElement;
    const vw = typeof window !== 'undefined' ? window.innerWidth : 1400;
    // 保证中间画布至少 420px，侧栏再大也不许把画布挤没
    const minCanvas = 420;
    const wantSide = layout.side || 210;
    const wantPanel = layout.panel || 240;
    const avail = Math.max(240, vw - minCanvas - 10);
    let side = wantSide;
    let panel = wantPanel;
    if (side + panel > avail) {
      const k = avail / (side + panel);
      side = Math.max(120, Math.floor(side * k));
      panel = Math.max(160, Math.floor(panel * k));
    }
    root.style.setProperty('--w-side', (layout.leftCollapsed ? COLLAPSED_W : side) + 'px');
    // 收起时把 QWE 工具竖排到窄条里
    if (railTools && toolGroup) {
      if (layout.leftCollapsed) {
        railTools.hidden = false;
        railTools.appendChild(toolGroup);
      } else {
        railTools.hidden = true;
        shell.left.appendChild(toolGroup);
      }
    }
    paintFoot(leftFoot, !!layout.leftCollapsed, 'left');
    paintFoot(rightFoot, !!layout.rightCollapsed, 'right');
    root.style.setProperty('--w-panel', (layout.rightCollapsed ? COLLAPSED_W : panel) + 'px');
    shell.panelLeft.classList.toggle('is-collapsed', !!layout.leftCollapsed);
    shell.panelRight.classList.toggle('is-collapsed', !!layout.rightCollapsed);
  }
  applyLayout();
  document.documentElement.dataset.empty = '1'; // 启动即空状态

  function bindSplitter(el, side) {
    if (!el) return;
    let start = null;
    el.addEventListener('pointerdown', (ev) => {
      const base = side === 'left' ? shell.panelLeft.getBoundingClientRect().width : shell.panelRight.getBoundingClientRect().width;
      start = { x: ev.clientX, w: base };
      el.classList.add('is-dragging');
      if (el.setPointerCapture) el.setPointerCapture(ev.pointerId);
    });
    el.addEventListener('pointermove', (ev) => {
      if (!start) return;
      const dx = ev.clientX - start.x;
      const raw = side === 'left' ? start.w + dx : start.w - dx;
      const vw = window.innerWidth;
      const min = side === 'left' ? 120 : 180;
      const max = side === 'left' ? 360 : Math.max(240, Math.min(560, Math.floor(vw * 0.45)));
      const w = Math.round(Math.max(min, Math.min(max, raw)));
      if (side === 'left') {
        layout.side = w;
        layout.leftCollapsed = false;
      } else {
        layout.panel = w;
        layout.rightCollapsed = false;
      }
      applyLayout();
      updateColsBtn && updateColsBtn();
      lastListSig = '';
      render();
      scheduleRefit();
      saveLayout();
    });
    const end = () => {
      start = null;
      el.classList.remove('is-dragging');
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    // 双击 = 恢复默认宽度（不再切折叠，折叠交给栏底按钮）
    el.addEventListener('dblclick', () => {
      if (side === 'left') {
        layout.side = 210;
        layout.leftCollapsed = false;
      } else {
        layout.panel = 210;
        layout.rightCollapsed = false;
      }
      applyLayout();
      lastListSig = '';
      render();
      scheduleRefit();
      saveLayout();
    });
  }

  bindSplitter(document.getElementById('split-left'), 'left');
  bindSplitter(document.getElementById('split-right'), 'right');

  // 左栏页头：全览 + 单/双列
  const sideHead = document.getElementById('side-head');
  let colsBtn = null;
  if (sideHead) {
    const gallery = doc.createElement('button');
    gallery.type = 'button';
    gallery.className = 'icon-btn';
    gallery.innerHTML = ICONS.grid;
    gallery.title = '预览全部页面';
    gallery.addEventListener('click', () => openLightbox(ed.page));
    sideHead.appendChild(gallery);

    colsBtn = doc.createElement('button');
    colsBtn.type = 'button';
    colsBtn.className = 'icon-btn';
    colsBtn.innerHTML = ICONS.columns;
    sideHead.appendChild(colsBtn);
    colsBtn.addEventListener('click', () => {
      // 只切列数，绝不改左栏宽度
      layout.sideCols = layout.sideCols === 2 ? 1 : 2;
      applyLayout();
      updateColsBtn();
      lastListSig = ''; // 列表结构变了，强制重建
      refresh();
      scheduleRefit();
      saveLayout();
    });
  }

  const DOUBLE_MIN = 288;

  function effectiveCols() {
    return layout.sideCols === 2 ? 2 : 1;
  }

  function updateColsBtn() {
    if (!colsBtn) return;
    const double = layout.sideCols === 2;
    colsBtn.disabled = false;
    colsBtn.classList.toggle('is-active', double);
    colsBtn.title = double ? '切回单列' : '切到双列';
  }

  // 折叠按钮固定在栏底：展开时「|← 收起侧边栏」，收起时只留图标
  leftFoot = document.getElementById('toggle-left');
  rightFoot = document.getElementById('toggle-right');
  railTools = document.getElementById('rail-tools');

  function paintFoot(btn, collapsed, side) {
    if (!btn) return;
    const icon = side === 'left'
      ? collapsed ? ICONS.sidebarRight : ICONS.sidebarLeft
      : collapsed ? ICONS.sidebarLeft : ICONS.sidebarRight;
    const iconEl = btn.querySelector('.foot-icon');
    const labelEl = btn.querySelector('.foot-label');
    if (iconEl) iconEl.innerHTML = icon;
    if (labelEl) labelEl.textContent = '收起侧边栏';
    btn.title = collapsed ? '展开侧边栏' : '收起侧边栏';
  }

  const flipLeft = () => {
    layout.leftCollapsed = !layout.leftCollapsed;
    applyLayout();
    saveLayout();
    scheduleRefit();
  };
  const flipRight = () => {
    layout.rightCollapsed = !layout.rightCollapsed;
    applyLayout();
    saveLayout();
    scheduleRefit();
  };
  if (leftFoot) leftFoot.addEventListener('click', flipLeft);
  if (rightFoot) rightFoot.addEventListener('click', flipRight);

  // 首次 applyLayout 时这些按钮还没建好，这里补刷一次
  applyLayout();

  updateColsBtn && updateColsBtn();



  // 未捕获异常进底部横幅，不覆盖空状态，10 秒后自己消失
  if (typeof window !== 'undefined') {
    window.addEventListener('error', (ev) => {
      toast('出错了：' + (ev && ev.message ? ev.message : ev));
    });
    window.addEventListener('unhandledrejection', (ev) => {
      const reason = ev && ev.reason ? ev.reason.message || ev.reason : '未知错误';
      toast('出错了：' + reason);
    });
  }

  if (typeof window !== 'undefined') {
    window.addEventListener('pagehide', () => persist(true));
    window.addEventListener('beforeunload', () => persist(true));
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') persist(true);
    });
  }

  if (opts.url) {
    const name = String(opts.url).split('/').pop() || 'document.pdf';
    fetch(opts.url)
      .then((res) => res.blob())
      .then((blob) => load(new File([blob], name, { type: 'application/pdf' })))
      .catch((e) => toast('打不开 ' + opts.url + '：' + e.message));
  }

  return {
    shell,
    zoom,
    stack,
    editor: ed,
    history: hist,
    load,
    render,
    exportZip: doExport,
    persist: () => persist(true),
    debug: () => ({ key: currentKey, hasStorage: !!storage, regions: ed.regions.length, state }),
    status: () => state,
  };
}

// 骨架里声明的名字：读装配后的状态
function status(booted) {
  return booted.status();
}

// ---- src/main.js ----
// 入口：装配并启动。构建时被内联，开发时作为 ESM 入口。


function start() {
  try {
    const q = typeof location !== 'undefined' ? new URLSearchParams(location.search) : null;
    const app = boot({ url: q ? q.get('pdf') || undefined : undefined });
    if (typeof window !== 'undefined') window.__figcut = app;
  } catch (e) {
    const banner = document.getElementById('banner');
    if (banner) {
      banner.hidden = false;
      banner.textContent = '启动失败：' + (e && e.message ? e.message : e);
    }
    console.error(e);
  }
}

if (typeof document !== 'undefined') {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
}

})();
</script>
