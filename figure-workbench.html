<!doctype html>
<html lang="zh-CN" data-ui="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>figcut</title>


<style>
/* figcut 设计令牌：Adwaita 风格浅/深两套 + 排版与控件尺寸。 */
:root {
  color-scheme: light;
  --accent: #3584e4;
  --accent-hover: #4a90e8;
  --accent-fg: #ffffff;
  --opt: #e5a50a;
  --destructive: #e01b24;
  --window: #fafafa;
  --header: #ebebeb;
  --sidebar: #f2f2f2;
  --view: #f6f5f4;
  --card: #ffffff;
  --page: #ffffff;
  --page-dark: #1b1b1b;
  --line: rgba(0, 0, 0, 0.1);
  --line-strong: rgba(0, 0, 0, 0.18);
  --hover: rgba(0, 0, 0, 0.06);
  --active: rgba(0, 0, 0, 0.12);
  --sel: rgba(53, 132, 228, 0.16);
  --ink-box: rgba(224, 27, 36, 0.55);
  --text: rgba(0, 0, 0, 0.88);
  --text-2: rgba(0, 0, 0, 0.56);
  --text-3: rgba(0, 0, 0, 0.38);
  --h-header: 46px;
  --w-side: 210px;
  --w-panel: 250px;
  --r-ctl: 6px;
  --ctl-h: 28px;
  --font: "Adwaita Sans", Cantarell, system-ui, -apple-system, "Noto Sans CJK SC", sans-serif;
  --mono: ui-monospace, "JetBrains Mono", "Source Code Pro", monospace;
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.08);
  --shadow-2: 0 3px 9px rgba(0, 0, 0, 0.14);
}

:root[data-ui="dark"] {
  color-scheme: dark;
  --accent: #3584e4;
  --accent-hover: #4a90e8;
  --destructive: #ff7b72;
  --window: #242424;
  --header: #303030;
  --sidebar: #2b2b2b;
  --view: #1e1e1e;
  --card: #363636;
  --page: #ffffff;
  --page-dark: #141414;
  --line: rgba(255, 255, 255, 0.1);
  --line-strong: rgba(255, 255, 255, 0.18);
  --hover: rgba(255, 255, 255, 0.08);
  --active: rgba(255, 255, 255, 0.14);
  --sel: rgba(53, 132, 228, 0.32);
  --ink-box: rgba(255, 123, 114, 0.6);
  --text: #ffffff;
  --text-2: rgba(255, 255, 255, 0.72);
  --text-3: rgba(255, 255, 255, 0.45);
  --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.3);
  --shadow-2: 0 3px 9px rgba(0, 0, 0, 0.45);
}

</style>
<style>
/* 布局与组件：顶栏 / 左栏 / 画布 / 右栏。 */

*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }

body {
  background: var(--window);
  color: var(--text);
  font: 13px/1.4 var(--font);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* 界面文字不该被框选；输入框和正文里照常可选 */
body { user-select: none; -webkit-user-select: none; }
input, textarea, .preview-canvas, .textlayer, .textlayer span { user-select: text; -webkit-user-select: text; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.app {
  height: 100%;
  display: grid;
  grid-template-rows: var(--h-header) minmax(0, 1fr);
  background: var(--window);
}

/* ---------- 顶栏 ---------- */

.topbar {
  position: relative;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 10px;
  background: var(--header);
  border-bottom: 1px solid var(--line);
}

.cluster { display: flex; align-items: center; gap: 6px; }
.cluster-right { margin-left: auto; }

.title-block {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  max-width: 36vw;
  text-align: center;
  pointer-events: none;
}

.title {
  font-size: 12.5px;
  font-weight: 700;
  line-height: 1.25;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.subtitle {
  font-size: 10.5px;
  color: var(--text-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ---------- 按钮 ---------- */

.btn {
  height: var(--ctl-h);
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-ctl);
  background: var(--card);
  color: var(--text);
  font-size: 12.5px;
  font-weight: 600;
  box-shadow: var(--shadow-1);
}

.btn:hover { background: var(--hover); }

.btn.suggested {
  background: var(--accent);
  border-color: transparent;
  color: var(--accent-fg);
}

.btn.suggested:hover { background: var(--accent-hover); }

.icon-btn {
  width: var(--ctl-h);
  height: var(--ctl-h);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 0;
  border-radius: var(--r-ctl);
  background: transparent;
  color: var(--text-2);
}

.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn.on, .icon-btn.is-active { background: var(--sel); color: var(--accent); }
.icon-btn svg, .btn svg { display: block; flex: none; }

/* ---------- 三栏 ---------- */

.body {
  display: grid;
  grid-template-columns: var(--w-side) 5px minmax(0, 1fr) 5px var(--w-panel);
  min-height: 0;
}

.sidebar, .panel { min-height: 0; overflow-y: auto; overflow-x: hidden; background: var(--sidebar); }
.sidebar { border-right: 1px solid var(--line); }
.panel { border-left: 1px solid var(--line); display: flex; flex-direction: column; }

.sidebar.is-collapsed .side-head, .panel.is-collapsed .side-head { display: none; }

.splitter { position: relative; cursor: col-resize; background: transparent; }
.splitter::after {
  content: '';
  position: absolute;
  inset: 0 2px;
  background: transparent;
  transition: background 0.12s;
}
.splitter:hover::after, .splitter.is-dragging::after { background: var(--accent); opacity: 0.5; }

.side-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  position: sticky;
  top: 0;
  z-index: 4;
  background: var(--sidebar);
}
.side-head .icon-btn { width: 22px; height: 22px; display: inline-flex; align-items: center; justify-content: center; border: 0; border-radius: 5px; background: transparent; color: var(--text-3); }
.side-head .icon-btn:hover { background: var(--hover); color: var(--text); }
.side-head .icon-btn:disabled { opacity: 0.35; cursor: default; }

.side-head {
  padding: 9px 12px 6px;
  font-size: 11px;
  font-weight: 700;
  color: var(--text-2);
  letter-spacing: 0.02em;
}

/* ---------- 画布 ---------- */

.canvas {
  position: relative;
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background: var(--view);
}

/* 光标由 JS 按命中目标决定（手柄 pointer / 框体 move / 空白 default），
   这里不要写死 cursor，否则会盖掉内联样式 */

.pages {
  flex: 1;
  min-height: 0;
  overflow: auto;
  padding: 56px 24px 44px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  overflow-anchor: none;
}

.page-row {
  display: grid;
  grid-template-columns: auto auto;
  align-items: flex-start;
  justify-content: safe center;
  gap: 20px;
  max-width: 100%;
}

.page-row[data-single="right"] > .page { grid-column: 2; }
.page-row[data-single="left"] > .page { grid-column: 1; }

.page {
  position: relative;
  background: var(--page);
  box-shadow: var(--shadow-1);
  border-radius: 2px;
}

.page canvas { display: block; width: 100%; height: 100%; border-radius: 2px; }
.page-overlay { position: absolute; inset: 0; overflow: visible; pointer-events: none; }
.regions { width: 100%; height: 100%; overflow: visible; }

.region {
  fill: rgba(53, 132, 228, 0.06);
  stroke: var(--accent);
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
}

.region.is-selected { fill: rgba(53, 132, 228, 0.12); stroke-width: 1.6; }

.draft-rect {
  fill: rgba(53, 132, 228, 0.1);
  stroke: var(--accent);
  stroke-width: 1.2;
  stroke-dasharray: 4 3;
  vector-effect: non-scaling-stroke;
}

.draft-line {
  fill: none;
  stroke: var(--accent);
  stroke-width: 1.2;
  stroke-dasharray: 4 3;
  vector-effect: non-scaling-stroke;
}

.draft-dot {
  fill: #ffffff;
  stroke: var(--accent);
  stroke-width: 1.4;
  vector-effect: non-scaling-stroke;
}

.cropbox {
  fill: none;
  stroke: var(--ink-box);
  stroke-width: 1;
  stroke-dasharray: 3 3;
  vector-effect: non-scaling-stroke;
}

.handle { cursor: pointer; }

.handle {
  fill: #ffffff;
  stroke: var(--accent);
  stroke-width: 1.4;
  vector-effect: non-scaling-stroke;
}

/* ---------- 浮动工具组与缩放 ---------- */

/* 顶栏里的工具组：和撤销/重做同一排 */
.tool-group {
  display: flex;
  align-items: center;
  gap: 2px;
  margin-left: 4px;
  padding: 2px;
  border-radius: var(--r-ctl);
  background: var(--card);
  border: 1px solid var(--line-strong);
}

.tool-group .icon-btn { width: 28px; height: 22px; border-radius: 4px; }

.tool-group .icon-btn { width: 30px; height: 28px; border-radius: 6px; }

.zoom-control {
  position: absolute;
  right: 12px;
  bottom: 12px;
  z-index: 5;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 0 2px;
  height: var(--ctl-h);
  border: 1px solid var(--line-strong);
  border-radius: var(--r-ctl);
  background: var(--card);
  box-shadow: var(--shadow-1);
}

.zoom-control .icon-btn { width: 24px; height: 22px; border-radius: 4px; }

.zoom-entry {
  min-width: 76px;
  height: 22px;
  padding: 0 6px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 11.5px;
  font-variant-numeric: tabular-nums;
}

.zoom-entry:hover, .zoom-entry.is-open { background: var(--hover); }

.zoom-menu {
  position: fixed;
  z-index: 70;
  display: grid;
  grid-template-columns: repeat(2, 68px);
  gap: 3px;
  padding: 6px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--shadow-2);
}

.zoom-cell {
  height: 28px;
  border: 1px solid var(--line);
  border-radius: 6px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}

.zoom-cell:hover { background: var(--hover); }
.zoom-cell.is-wide { grid-column: span 2; }
.zoom-cell.on { background: var(--accent); border-color: transparent; color: var(--accent-fg); font-weight: 600; }

.zoom-menu[hidden] { display: none; }

.zoom-item {
  display: block;
  width: 100%;
  height: 28px;
  padding: 0 10px;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 12px;
  text-align: left;
}

.zoom-item:hover { background: var(--hover); }
.zoom-item.on { background: var(--sel); color: var(--accent); font-weight: 600; }
.zoom-menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

.zoom-input {
  width: 58px;
  height: 22px;
  border: 0;
  border-radius: 4px;
  background: transparent;
  color: var(--text);
  text-align: center;
  font-family: var(--mono);
  font-size: 11.5px;
}

.zoom-input:focus { background: var(--hover); outline: none; }

.zoom-presets {
  height: 22px;
  padding: 0 2px;
  border: 0;
  border-radius: 4px;
  background: var(--card);
  color: var(--text);
  font-size: 11.5px;
  cursor: pointer;
}

.zoom-presets:hover { background: var(--hover); }
.zoom-presets option { background: var(--card); color: var(--text); }

.zoom-sep { width: 1px; height: 16px; margin: 0 2px; background: var(--line); }

/* ---------- 空状态 ---------- */

.empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  pointer-events: none;
  color: var(--text-3);
}

.empty .big { font-size: 15px; font-weight: 700; color: var(--text-2); }
.empty .small { font-size: 11.5px; }

/* ---------- 左栏页面列表 ---------- */

.page-list { padding: 2px 6px 8px; display: flex; flex-direction: column; gap: 2px; }

.page-list.is-double { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.page-list.is-double .page-item { padding: 4px; }
.page-list.is-double .page-no { font-size: 10px; }

.page-item {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px;
  border: 0;
  border-radius: 8px;
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  text-align: left;
}

.page-frame {
  position: relative;
  flex: 1;
  min-width: 0;
  border-radius: 4px;
  background: #fff;
  box-shadow: var(--shadow-1);
  overflow: hidden;
}

.page-thumb {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 595 / 842;
  background: #fff;
}

.page-no {
  position: absolute;
  right: 3px;
  bottom: 3px;
  min-width: 13px;
  padding: 0 3px;
  border-radius: 7px;
  background: rgba(0, 0, 0, 0.62);
  color: #fff;
  font-size: 9.5px;
  line-height: 13px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.page-item:hover { background: var(--hover); }
.page-item.is-current { background: var(--sel); color: var(--text); font-weight: 600; }
.page-no { font-variant-numeric: tabular-nums; }

.page-count {
  position: absolute;
  left: 3px;
  bottom: 3px;
  min-width: 13px;
  height: 13px;
  padding: 0 3px;
  border-radius: 7px;
  font-size: 9px;
  background: var(--accent);
  color: var(--accent-fg);
  font-size: 10px;
  font-weight: 700;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.page-count:empty { display: none; }

/* ---------- 右栏 ---------- */

.preview-host { padding: 8px; }

.preview-canvas {
  display: block;
  width: 100%;
  height: auto;
  border-radius: 4px;
  background: var(--page);
  border: 1px solid var(--line);
}

.region-list { padding: 0 6px 8px; }
.region-empty { padding: 12px 8px; color: var(--text-3); font-size: 11.5px; line-height: 1.5; }

.region-group {
  display: flex;
  justify-content: space-between;
  padding: 10px 4px 3px;
  font-size: 10.5px;
  font-weight: 700;
  color: var(--text-3);
}

.region-group.is-current { color: var(--text-2); }

.region-row {
  display: grid;
  grid-template-columns: 12px 64px minmax(0, 1fr) auto;
  align-items: center;
  gap: 6px;
  padding: 5px 6px;
  border-radius: 7px;
  cursor: pointer;
}

.region-thumb {
  width: 64px;
  height: auto;
  border-radius: 4px;
  border: 1px solid var(--line);
  background: #fff;
  display: block;
}

.region-thumb.is-empty { height: 44px; background: var(--hover); border-style: dashed; }

.region-row:hover { background: var(--hover); }
.region-row.is-selected { background: var(--sel); }

.inspector { display: flex; align-items: center; gap: 4px; min-width: 0; }

.region-q, .region-note {
  height: 22px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--card);
  font-size: 11.5px;
  min-width: 0;
}

.opt-btn {
  height: 22px;
  min-width: 56px;
  padding: 0 6px;
  border: 1px solid var(--line-strong);
  border-radius: 5px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 11.5px;
  text-align: left;
}

.opt-btn:hover { background: var(--hover); }

.opt-menu {
  position: fixed;
  z-index: 80;
  display: grid;
  grid-template-columns: repeat(4, 34px);
  gap: 3px;
  padding: 6px;
  border-radius: 10px;
  border: 1px solid var(--line);
  background: var(--card);
  box-shadow: var(--shadow-2);
}

.opt-menu[hidden] { display: none; }

.opt-cell {
  height: 26px;
  border: 1px solid var(--line);
  border-radius: 5px;
  background: var(--card);
  color: var(--text);
  font: inherit;
  font-size: 11.5px;
  padding: 0;
  text-align: center;
}

.opt-cell.is-wide { grid-column: span 4; }
.opt-cell:hover { background: var(--hover); }
.opt-cell.on { background: var(--accent); border-color: transparent; color: var(--accent-fg); font-weight: 600; }

.opt-input {
  grid-column: span 1;
  min-width: 0;
  padding: 0 4px;
  font-size: 11px;
}

.region-q { width: 44px; }
.region-note { flex: 1; min-width: 0; }
.region-q { width: 48px; font-family: var(--mono); padding: 0 5px; }
.region-note { flex: 1; padding: 0 5px; border-color: var(--line); color: var(--text-2); }
.region-label { font-size: 11.5px; color: var(--text-2); }

.region-del {
  width: 26px;
  height: 26px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid transparent;
  border-radius: 6px;
  background: transparent;
  color: var(--destructive);
}

.region-del svg { width: 17px; height: 17px; }

.region-del:hover {
  background: var(--destructive);
  color: #fff;
}

/* ---------- 弹出设置 ---------- */

.settings-popover {
  position: fixed;
  top: 50px;
  right: 12px;
  z-index: 40;
  display: flex;
  gap: 10px;
  padding: 9px 11px;
  border-radius: 10px;
  background: var(--card);
  border: 1px solid var(--line);
  box-shadow: var(--shadow-2);
}

.settings-popover[hidden] { display: none; }

.settings-popover label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); }

.settings-popover input {
  width: 66px;
  height: 24px;
  padding: 0 6px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-ctl);
  background: var(--card);
  font-family: var(--mono);
  font-size: 11.5px;
}

/* ---------- 提示条 ---------- */

.banner {
  position: fixed;
  left: 50%;
  bottom: 30px;
  transform: translateX(-50%);
  z-index: 60;
  max-width: 70vw;
  padding: 8px 14px;
  border-radius: 8px;
  background: rgba(20, 20, 20, 0.92);
  color: #fff;
  font-size: 12.5px;
  pointer-events: none;
  box-shadow: var(--shadow-2);
}

.banner[hidden] { display: none; }
.banner[data-kind="error"] { background: var(--destructive); }

/* ---------- PDF 预览反相：只反相纸面 ---------- */

:root[data-pdf-invert="1"] .page canvas,
:root[data-pdf-invert="1"] .page-thumb,
:root[data-pdf-invert="1"] .preview-canvas { filter: invert(1); }

/* 侧栏折叠按钮 */
.sidebar, .panel { position: relative; }



/* 顶栏内联的导出设置 */
.settings-inline {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 6px;
}

.settings-inline[hidden] { display: none; }
.settings-inline label { display: flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--text-2); }

.settings-inline input {
  width: 62px;
  height: 24px;
  padding: 0 5px;
  border: 1px solid var(--line-strong);
  border-radius: var(--r-ctl);
  background: var(--card);
  font-family: var(--mono);
  font-size: 11.5px;
}

/* 空状态里的最近文件 */
.recent {
  margin-top: 18px;
  min-width: 320px;
  max-width: 460px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  pointer-events: auto;
}

.recent:empty { display: none; }
.recent-head { font-size: 11px; font-weight: 700; color: var(--text-3); padding: 0 6px 4px; }

.recent-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px;
  border: 0;
  border-radius: 7px;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 12.5px;
  text-align: left;
}

.recent-item:hover { background: var(--hover); }
.recent-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.recent-item .meta { color: var(--text-3); font-size: 11px; font-variant-numeric: tabular-nums; }

/* 文本层：透明文字，选择工具下可框选复制 */
.textlayer {
  position: absolute;
  left: 0;
  top: 0;
  overflow: hidden;
  pointer-events: none;
  line-height: 1;
}

.textlayer span {
  position: absolute;
  color: transparent;
  white-space: pre;
  cursor: text;
}

.canvas[data-tool="select"] .textlayer { pointer-events: auto; }
.canvas[data-tool="select"] .textlayer span { pointer-events: auto; }

<script>
(function () {
'use strict';

// ---- src/core/errors.js ----
// 错误类型与未实现占位
// 状态：骨架。接口已冻结，实现待补。

function figcutError(code, message, context) {
  const err = new Error(message);
  err.name = 'FigcutError';
  err.code = code;
  err.context = context || {};
  return err;
}

function notImplemented(name) {
  return figcutError('not-implemented', '未实现: ' + name, { name });
}

// ---- src/ui/shell.js ----
// 顶栏与三栏骨架
// 状态：已实现。只读 DOM 引用 + 少量写操作。



function createShell(root) {
  const doc = root || (typeof document !== 'undefined' ? document : null);
  if (!doc) throw figcutError('no-dom', '没有 DOM 就搭不出骨架');

  const el = (id) => {
    const node = doc.getElementById(id);
    if (!node) throw figcutError('missing-node', 'index.html 缺少 #' + id, { id });
    return node;
  };

  return {
    left: el('topbar-left'),
    right: el('topbar-right'),
    title: el('topbar-title'),
    canvas: el('canvas'),
    panelLeft: el('panel-left'),
    panelRight: el('panel-right'),
    empty: el('empty'),
    banner: el('banner'),
  };
}

function setTitle(shell, text) {
  shell.title.textContent = text;
  return text;
}

function setFileInfo(shell, text) {
  shell.title.textContent = text;
  return text;
}

function setEmpty(shell, visible) {
  shell.empty.style.display = visible ? '' : 'none';
}

function addButtonTo(container, label, onClick, opts = {}) {
  const doc = (container && container.ownerDocument) || (typeof document !== 'undefined' ? document : null);
  if (!doc) throw figcutError('no-dom', '没有 DOM 就加不了按钮');
  const btn = doc.createElement('button');
  btn.type = 'button';
  btn.className = opts.kind === 'btn' ? 'btn' : 'icon-btn';
  if (opts.suggested) btn.classList.add('suggested');
  if (opts.icon) btn.innerHTML = opts.icon;
  else btn.textContent = label;
  if (opts.title) btn.title = opts.title;
  if (opts.ariaLabel) btn.setAttribute('aria-label', opts.ariaLabel);
  btn.addEventListener('click', onClick);
  container.appendChild(btn);
  return btn;
}

function addButton(shell, side, label, onClick, opts = {}) {
  return addButtonTo(side === 'right' ? shell.right : shell.left, label, onClick, opts);
}

// ---- src/core/units.js ----
// 单位换算：pdf pt / css px / 输出 dpi
// 状态：已实现。PDF 坐标一律 pt，页内左上原点、y 向下。

const PT_PER_INCH = 72;

// pt → 导出像素：dpi 是每英寸像素，pt 是 1/72 英寸。
function pxForDpi(pt, dpi) {
  return (pt / PT_PER_INCH) * dpi;
}

// pt → css 像素：scale 是当前缩放倍率（100% = 1）。
function ptToPx(pt, scale) {
  return pt * scale;
}

function pxToPt(px, scale) {
  if (!Number.isFinite(scale) || scale <= 0) {
    throw figcutError('bad-scale', '缩放倍率必须是正有限数', { scale });
  }
  return px / scale;
}

// NaN 返回下界（坐标计算里出现 NaN 时宁可贴边也不要写进模型）；
// 正无穷贴上限、负无穷贴下限，符合夹取直觉。
function clamp(value, lo, hi) {
  if (!Number.isFinite(value)) return value === Infinity ? hi : lo;
  if (lo > hi) return lo;
  return value < lo ? lo : value > hi ? hi : value;
}

// ---- src/core/layout.js ----
// 视图布局：单双页、书式配对、适应缩放、缩放台阶
// 状态：已实现。纯计算，页尺寸与视口尺寸都由调用方给。



const MIN_SCALE = 0.25;
const MAX_SCALE = 8;

// 照 GNOME Papers：
//   单页 → 每页一行
//   双页书式（默认）→ 第 1 页单独在右，之后 2|3、4|5
//   双页 + 奇数页在左 → 1|2、3|4、5|6
function pageCombos(pageCount, opts = {}) {
  const dual = !!opts.dual;
  const oddLeft = !!opts.oddLeft;
  const rows = [];

  if (!dual) {
    for (let p = 1; p <= pageCount; p += 1) rows.push([p]);
    return rows;
  }

  if (oddLeft) {
    for (let p = 1; p <= pageCount; p += 2) {
      rows.push(p + 1 <= pageCount ? [p, p + 1] : [p]);
    }
    return rows;
  }

  if (pageCount >= 1) rows.push([1]);
  for (let p = 2; p <= pageCount; p += 2) {
    rows.push(p + 1 <= pageCount ? [p, p + 1] : [p]);
  }
  return rows;
}

// 适应页面：整页必须完整可见，padding 按真实的上下留白算。
function fitPageScale(opts) {
  const padX = opts.padX || 0;
  const padY = opts.padY || 0;
  const avw = Math.max(1, opts.viewportW - padX * 2);
  const avh = Math.max(1, opts.viewportH - padY * 2);
  if (!(opts.pageW > 0) || !(opts.pageH > 0)) return 1;
  const scale = Math.min(avw / opts.pageW, avh / opts.pageH);
  return clamp(Math.floor(scale * 1000) / 1000, MIN_SCALE, MAX_SCALE);
}

// 适应宽度：横向不许出滚动条，所以最后再往下抹一点余量。
function fitWidthScale(opts) {
  const padX = opts.padX || 0;
  const avw = Math.max(1, opts.viewportW - padX * 2);
  if (!(opts.pageW > 0)) return 1;
  const scale = avw / opts.pageW;
  return clamp(Math.floor(scale * 1000) / 1000, MIN_SCALE, MAX_SCALE);
}

function zoomPresets() {
  return [0.5, 0.7, 0.85, 1, 1.25, 1.5, 1.75, 2, 3, 4, 8];
}

// 缩放按钮 / 快捷键：按 ×1.2 步进，并夹在 25%–800%。
function stepZoom(scale, dir) {
  const factor = dir >= 0 ? 1.2 : 1 / 1.2;
  return clamp(Math.round(scale * factor * 1000) / 1000, MIN_SCALE, MAX_SCALE);
}

// ---- src/view/zoom.js ----
// 缩放与鼠标锚点
// 状态：已实现。状态与数学都在这，DOM 由 ui/zoom-control 负责。




function createZoom(opts = {}) {
  return {
    scale: opts.scale === undefined ? 1 : opts.scale,
    mode: 'free',
    min: MIN_SCALE,
    max: MAX_SCALE,
    auto: false,
    listeners: new Set(),
  };
}

function notify(z) {
  for (const fn of z.listeners) fn(z.scale, z.mode);
}

function subscribe(z, fn) {
  z.listeners.add(fn);
  return () => z.listeners.delete(fn);
}

function setScale(z, value) {
  z.auto = false;
  const next = clamp(Number(value), z.min, z.max);
  if (!Number.isFinite(next)) return z.scale;
  z.mode = 'free';
  if (Math.abs(next - z.scale) < 1e-6) return z.scale;
  z.scale = next;
  notify(z);
  return z.scale;
}

// 'page' 整页可见，'width' 贴满宽度
function setFit(z, mode, dims) {
  z.auto = false;
  const scale =
    mode === 'page'
      ? fitPageScale(dims)
      : mode === 'width'
        ? fitWidthScale(dims)
        : z.scale;
  z.mode = mode;
  if (Math.abs(scale - z.scale) > 1e-6) {
    z.scale = scale;
    notify(z);
  }
  return z.scale;
}

// 以指针为锚点缩放的滚动补偿：指针下的内容不许漂。
function anchorAt(scroll, px, py, from, to) {
  if (!(from > 0) || !(to > 0)) return { x: scroll.x, y: scroll.y };
  const cx = (scroll.x + px) / from;
  const cy = (scroll.y + py) / from;
  return {
    x: Math.max(0, cx * to - px),
    y: Math.max(0, cy * to - py),
  };
}

// ---- src/app/shortcuts.js ----
// 快捷键表与输入框豁免
// 状态：已实现。resolveKey 是纯函数，绑定时只负责 preventDefault + 分发。

const KEYMAP = {
  q: 'tool.select',
  w: 'tool.rect',
  e: 'tool.poly',
  n: 'page.next',
  p: 'page.prev',
  f: 'zoom.fitPage',
  s: 'zoom.fitWidth',
  '+': 'zoom.in',
  '=': 'zoom.in',
  '-': 'zoom.out',
  c: 'view.continuous',
  d: 'view.dual',
  o: 'view.oddLeft',
};

const TYPING_TAGS = ['INPUT', 'TEXTAREA', 'SELECT'];

function isTyping(ev) {
  const t = ev.target;
  if (!t) return false;
  if (t.isContentEditable) return true;
  return TYPING_TAGS.includes(String(t.tagName || '').toUpperCase());
}

// 焦点在输入框时不拦截（Esc 除外），否则用户打不出字母 n。
function resolveKey(ev) {
  const key = ev.key;
  if (!key) return null;
  const ctrl = !!(ev.ctrlKey || ev.metaKey);

  if (isTyping(ev)) return key === 'Escape' ? 'cancel' : null;

  if (ev.altKey && !ctrl) {
    if (key.toLowerCase() === 'o') return 'file.open';
    return null;
  }

  if (ctrl) {
    const lower = key.toLowerCase();
    if (lower === 'z') return 'history.undo';
    if (lower === 'y') return 'history.redo';
    if (lower === 'e') return 'export.zip';
    if (lower === 's') return 'config.save';
    if (lower === 'o') return 'file.open';
    if (lower === 'i') return 'view.invert';
    if (key === '0') return 'zoom.reset';
    if (key === 'Home') return 'page.first';
    if (key === 'End') return 'page.last';
    return null;
  }

  if (key === 'Escape') return 'cancel';
  if (key === 'Enter') return 'tool.closePoly';
  if (key === 'Delete' || key === 'Backspace') return 'region.delete';
  if (key === 'PageDown') return ev.shiftKey ? 'page.plus10' : 'page.next';
  if (key === 'PageUp') return ev.shiftKey ? 'page.minus10' : 'page.prev';

  if (key.startsWith('Arrow')) {
    if (!ev.shiftKey) return null;
    return 'region.nudge';
  }

  const mapped = KEYMAP[key.toLowerCase()];
  return mapped || null;
}

// nudge 需要方向信息，单独给一个纯函数，方便单测。
function nudgeVector(ev) {
  const step = ev.altKey ? 10 : 1;
  switch (ev.key) {
    case 'ArrowLeft':
      return { dx: -step, dy: 0 };
    case 'ArrowRight':
      return { dx: step, dy: 0 };
    case 'ArrowUp':
      return { dx: 0, dy: -step };
    case 'ArrowDown':
      return { dx: 0, dy: step };
    default:
      return { dx: 0, dy: 0 };
  }
}

function bindShortcuts(target, handlers, opts = {}) {
  const onKey = (ev) => {
    const action = resolveKey(ev);
    if (!action) return;
    const fn = handlers[action];
    if (!fn) return;
    ev.preventDefault();
    fn(ev, action);
  };
  const el = target || (typeof document !== 'undefined' ? document : null);
  if (!el) return () => {};
  el.addEventListener('keydown', onKey);
  return () => el.removeEventListener('keydown', onKey);
}

// ---- src/view/navigator.js ----
// 翻页与页码跳转
// 状态：已实现。真正的滚动由 page-stack 负责，这里只管"该去第几页"。

function createNavigator(stack, opts = {}) {
  return {
    stack,
    total: opts.total || 0,
    current: 1,
  };
}

function clampPage(nav, no) {
  const total = nav.total || (nav.stack && nav.stack.pages.length) || 1;
  return Math.min(Math.max(1, Math.round(no)), total);
}

function gotoPage(nav, no) {
  const next = clampPage(nav, no);
  nav.current = next;
  if (nav.stack) nav.stack.setCurrent(next);
  return next;
}

function nextPage(nav, delta = 1) {
  return gotoPage(nav, nav.current + delta);
}

function prevPage(nav, delta = 1) {
  return gotoPage(nav, nav.current - delta);
}

// 滚动时按"离视口顶部最近的页"更新当前页
function pageAtScroll(rects, viewportTop) {
  if (!rects || rects.length === 0) return 1;
  let best = rects[0];
  let bestD = Infinity;
  for (const r of rects) {
    const d = Math.abs(r.top - viewportTop);
    if (d < bestD) {
      bestD = d;
      best = r;
    }
  }
  return best.no;
}

// ---- src/ui/icons.js ----
// 内联 SVG 图标：统一 16x16、currentColor 描边，跟 Adwaita 符号图标一个路数。

  grid: wrap('<rect x="2.6" y="2.6" width="4.6" height="4.6" rx="0.8"/><rect x="8.8" y="2.6" width="4.6" height="4.6" rx="0.8"/><rect x="2.6" y="8.8" width="4.6" height="4.6" rx="0.8"/><rect x="8.8" y="8.8" width="4.6" height="4.6" rx="0.8"/>'),
  // GTK4 sidebar 图标：竖线 + 箭头（|← 收起 / →| 展开）
  sidebarLeft: wrap('<path d="M3.5 3v10"/><path d="M13 8H7"/><path d="M9.6 5.4 7 8l2.6 2.6"/>'),
  sidebarRight: wrap('<path d="M12.5 3v10"/><path d="M3 8h6"/><path d="M6.4 5.4 9 8l-2.6 2.6"/>'),
  columns: wrap('<rect x="2.4" y="2.8" width="4.4" height="10.4" rx="1"/><rect x="9.2" y="2.8" width="4.4" height="10.4" rx="1"/>'),
  fitWidth: wrap('<rect x="2.4" y="3.2" width="4.2" height="9.6" rx="0.6"/><path d="M9 8h4.4M11.6 5.6L13.8 8l-2.2 2.4"/>'),
  fitPage: wrap('<rect x="4" y="2.6" width="8" height="10.8" rx="0.8"/><path d="M6 5.4h4M6 8h4M6 10.6h4"/>'),
  uiAuto: wrap('<circle cx="8" cy="8" r="5.4"/><path d="M8 2.6v10.8" stroke-dasharray="1.5 1.6"/>'),
  uiLight: wrap('<circle cx="8" cy="8" r="3"/><path d="M8 1.8v1.6M8 12.6V14.2M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/>'),

function icon(name, opts) {
